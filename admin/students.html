<script>
tailwind.config = { theme: { extend: {
  colors: { primary: '#0A3622', 'primary-dark': '#062218', secondary: '#D4AF37', cream: '#F9F7F2', charcoal: '#1A1A1A' },
  fontFamily: { heading: ['Playfair Display', 'serif'], body: ['Inter', 'sans-serif'], arabic: ['Amiri', 'serif'] }

<style>
body { font-family: 'Inter', sans-serif; background: #F9F7F2; }
h1, h2, h3, h4 { font-family: 'Playfair Display', serif; }
.btn-primary { background: #0A3622; color: white; transition: all 0.3s; }
.btn-primary:hover { background: #062218; }
.sidebar-link { transition: all 0.2s; }
.sidebar-link:hover, .sidebar-link.active { background: rgba(212,175,55,0.15); color: #0A3622; border-left: 3px solid #D4AF37; }
input:focus, select:focus { outline: none; border-color: #0A3622; box-shadow: 0 0 0 3px rgba(10,54,34,0.1); }
.badge-admin { background: #0A3622; color: #D4AF37; }

<body class="bg-cream text-charcoal min-h-screen">

<header class="sticky top-0 z-40 bg-white border-b border-primary/10">
  <div class="px-4 py-3 flex items-center justify-between">
    <div class="flex items-center gap-3">
      <button id="sidebarToggle" class="lg:hidden p-2 text-primary">

      </button>
      <a href="../index.html" class="flex items-center gap-2">
        <img src="../assets/images/logo.png" alt="Al-Arabiyah" class="w-10 h-10 rounded-full border-2 border-secondary object-cover">
        <div class="hidden sm:block">
          <div class="font-heading font-bold text-primary text-sm leading-tight">Al-Arabiyah</div>
          <div class="text-xs text-primary/70">Admin Panel</div>
        </div>
      </a>
    </div>
    <div class="flex items-center gap-3">
      <span class="hidden md:inline-block badge-admin text-xs font-semibold px-3 py-1 rounded-full">ADMIN</span>
      <div class="relative">
        <button id="userMenuBtn" class="flex items-center gap-2 p-1 rounded-full hover:bg-primary/5">
          <div id="avatar" class="w-9 h-9 rounded-full bg-primary flex items-center justify-center text-secondary font-bold">A</div>
        </button>
        <div id="userMenu" class="hidden absolute right-0 mt-2 w-48 bg-white rounded-xl shadow-lg border border-primary/10 py-2">
          <div class="px-4 py-2 border-b border-primary/10">
            <p id="userName" class="text-sm font-semibold text-primary">Admin</p>
            <p id="userEmail" class="text-xs text-charcoal/60 truncate">admin@email.com</p>
          </div>
          <button id="logoutBtn" class="w-full text-left px-4 py-2 text-sm text-red-600 hover:bg-red-50">Logout</button>
        </div>
      </div>
    </div>
  </div>
</header>

  <aside id="sidebar" class="fixed lg:sticky top-0 lg:top-[60px] left-0 z-30 w-64 h-screen lg:h-[calc(100vh-60px)] bg-white border-r border-primary/10 transform -translate-x-full lg:translate-x-0 transition-transform overflow-y-auto">
    <div class="p-4">
      <div class="lg:hidden flex justify-end mb-2">

        </button>
      </div>
      <nav class="space-y-1">
        <a href="dashboard.html" class="sidebar-link flex items-center gap-3 px-4 py-3 rounded-lg text-charcoal/70">

        <a href="students.html" class="sidebar-link active flex items-center gap-3 px-4 py-3 rounded-lg text-primary font-medium">

          Students
        </a>
        <a href="teachers.html" class="sidebar-link flex items-center gap-3 px-4 py-3 rounded-lg text-charcoal/70">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
          Teachers
        </a>
        <a href="courses.html" class="sidebar-link flex items-center gap-3 px-4 py-3 rounded-lg text-charcoal/70">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"/></svg>
          Courses
        </a>
        <a href="classes.html" class="sidebar-link flex items-center gap-3 px-4 py-3 rounded-lg text-charcoal/70">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
          Classes
        </a>
        <a href="payments.html" class="sidebar-link flex items-center gap-3 px-4 py-3 rounded-lg text-charcoal/70">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 10h18M7 15h1m4 0h1m-7 4h12a3 3 0 003-3V8a3 3 0 00-3-3H6a3 3 0 00-3 3v8a3 3 0 003 3z"/></svg>
          Payments
        </a>
        <a href="reviews.html" class="sidebar-link flex items-center gap-3 px-4 py-3 rounded-lg text-charcoal/70">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11.049 2.927c.3-.921 1.603-.921 1.902 0l1.519 4.674a1 1 0 00.95.69h4.915c.969 0 1.371 1.24.588 1.81l-3.976 2.888a1 1 0 00-.363 1.118l1.518 4.674c.3.922-.755 1.688-1.538 1.118l-3.976-2.888a1 1 0 00-1.176 0l-3.976 2.888c-.783.57-1.838-.197-1.538-1.118l1.518-4.674a1 1 0 00-.363-1.118l-3.976-2.888c-.784-.57-.38-1.81.588-1.81h4.914a1 1 0 00.951-.69l1.519-4.674z"/></svg>
          Reviews
        </a>
        <a href="certificates.html" class="sidebar-link flex items-center gap-3 px-4 py-3 rounded-lg text-charcoal/70">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4M7.835 4.697a3.42 3.42 0 001.946-.806 3.42 3.42 0 014.438 0 3.42 3.42 0 001.946.806 3.42 3.42 0 013.138 3.138 3.42 3.42 0 00.806 1.946 3.42 3.42 0 010 4.438 3.42 3.42 0 00-.806 1.946 3.42 3.42 0 01-3.138 3.138 3.42 3.42 0 00-1.946.806 3.42 3.42 0 01-4.438 0 3.42 3.42 0 00-1.946-.806 3.42 3.42 0 01-3.138-3.138 3.42 3.42 0 00-.806-1.946 3.42 3.42 0 010-4.438 3.42 3.42 0 00.806-1.946 3.42 3.42 0 013.138-3.138z"/></svg>
          Certificates
        </a>
        <a href="resources.html" class="sidebar-link flex items-center gap-3 px-4 py-3 rounded-lg text-charcoal/70">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 21h10a2 2 0 002-2V9.414a1 1 0 00-.293-.707l-5.414-5.414A1 1 0 0012.586 3H7a2 2 0 00-2 2v14a2 2 0 002 2z"/></svg>
          Resources
        </a>
        <a href="notices.html" class="sidebar-link flex items-center gap-3 px-4 py-3 rounded-lg text-charcoal/70">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5.882V19.24a1.76 1.76 0 01-3.417.592l-2.147-6.15M18 13a3 3 0 100-6M5.436 13.683A4.001 4.001 0 017 6h1.832c4.1 0 7.625-1.234 9.168-3v14c-1.543-1.766-5.067-3-9.168-3H7a3.988 3.988 0 01-1.564-.317z"/></svg>
          Notices
        </a>
      </nav>
    </div>
  </aside>

  <div id="sidebarOverlay" class="hidden lg:hidden fixed inset-0 bg-black/50 z-20"></div>

  <main class="flex-1 min-w-0 p-4 md:p-6 lg:p-8">
    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 mb-6">
      <div>
        <h1 class="text-2xl md:text-3xl font-bold text-primary mb-1">Students</h1>
        <p class="text-charcoal/60 text-sm">Manage all registered students</p>
      </div>
      <div class="flex gap-2">
        <input type="text" id="searchInput" placeholder="Search students..." class="px-4 py-2.5 border border-primary/20 rounded-full bg-white text-sm w-full sm:w-64">
      </div>
    </div>

    <div id="loading" class="text-center py-20">
      <div class="inline-block animate-spin rounded-full h-8 w-8 border-4 border-primary/20 border-t-primary"></div>
    </div>

    <div id="studentsTableWrap" class="hidden bg-white rounded-2xl border border-primary/5 overflow-hidden">
      <div class="overflow-x-auto">
        <table class="w-full text-sm">
          <thead class="bg-cream border-b border-primary/10">
            <tr>
              <th class="text-left px-4 py-3 font-semibold text-primary">Student</th>
              <th class="text-left px-4 py-3 font-semibold text-primary hidden md:table-cell">Contact</th>
              <th class="text-left px-4 py-3 font-semibold text-primary hidden lg:table-cell">Country</th>
              <th class="text-left px-4 py-3 font-semibold text-primary">Status</th>
              <th class="text-right px-4 py-3 font-semibold text-primary">Actions</th>
            </tr>
          </thead>
          <tbody id="studentsTable"></tbody>
        </table>
      </div>
    </div>
  </main>
</div>

<script>
const SUPABASE_URL = 'https://vgsgisyneymtszuslftb.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZnc2dpc3luZXltdHN6dXNsZnRiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA0NTg0NjQsImV4cCI6MjEwNjAzNDQ2NH0.HaYptmVnZCbGiOCg1NyYkcdHQDqjXlAHeq_i_bTC6Yk';
const { createClient } = supabase;
const db = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let allStudents = [];

document.getElementById('sidebarToggle').addEventListener('click', () => {
  document.getElementById('sidebar').classList.remove('-translate-x-full');
  document.getElementById('sidebarOverlay').classList.remove('hidden');
});
document.getElementById('sidebarClose').addEventListener('click', () => {
  document.getElementById('sidebar').classList.add('-translate-x-full');
  document.getElementById('sidebarOverlay').classList.add('hidden');
});
document.getElementById('sidebarOverlay').addEventListener('click', () => {
  document.getElementById('sidebar').classList.add('-translate-x-full');
  document.getElementById('sidebarOverlay').classList.add('hidden');
});
document.getElementById('userMenuBtn').addEventListener('click', (e) => {
  e.stopPropagation();
  document.getElementById('userMenu').classList.toggle('hidden');
});
document.addEventListener('click', () => document.getElementById('userMenu').classList.add('hidden'));
document.getElementById('logoutBtn').addEventListener('click', async () => {
  await db.auth.signOut();
  window.location.href = '../auth/login.html';
});

function renderStudents(list) {
  const tbody = document.getElementById('studentsTable');
  if (!list || list.length === 0) {
    tbody.innerHTML = '<tr><td colspan="5" class="text-center py-10 text-charcoal/60">No students found</td></tr>';
    return;
  }
  tbody.innerHTML = list.map(s => {
    const name = s.full_name || s.email?.split('@')[0] || 'Student';
    return `
      <tr class="border-b border-primary/5 hover:bg-cream/50">
        <td class="px-4 py-3">
          <div class="flex items-center gap-3">
            <div class="w-9 h-9 rounded-full bg-primary flex items-center justify-center text-secondary font-bold text-sm flex-shrink-0">${name.charAt(0).toUpperCase()}</div>
            <div class="min-w-0">
              <p class="font-semibold text-primary truncate">${name}</p>
              <p class="text-xs text-charcoal/60 truncate">${s.email || ''}</p>
            </div>
          </div>
        </td>
        <td class="px-4 py-3 hidden md:table-cell text-charcoal/70">${s.phone || 'N/A'}</td>
        <td class="px-4 py-3 hidden lg:table-cell text-charcoal/70">${s.country || 'N/A'}</td>
        <td class="px-4 py-3"><span class="text-xs bg-green-100 text-green-700 px-2 py-1 rounded-full font-semibold">Active</span></td>
        <td class="px-4 py-3 text-right">
          <a href="https://wa.me/${(s.phone || '').replace(/[^0-9]/g, '') || '8801737326555'}" target="_blank" class="text-xs text-green-600 font-semibold hover:underline">WhatsApp</a>
        </td>
      </tr>
    `;
  }).join('');
}

document.getElementById('searchInput').addEventListener('input', (e) => {
  const q = e.target.value.toLowerCase().trim();
  if (!q) { renderStudents(allStudents); return; }
  renderStudents(allStudents.filter(s => 
    (s.full_name || '').toLowerCase().includes(q) || 
    (s.email || '').toLowerCase().includes(q) || 
    (s.phone || '').includes(q) ||
    (s.country || '').toLowerCase().includes(q)
  ));
});

(async () => {
  const { data: { session } } = await db.auth.getSession();
  if (!session) { window.location.href = '../auth/login.html'; return; }

  const { data: profile } = await db.from('profiles').select('*').eq('id', session.user.id).single();
  if (!profile || (profile.role !== 'admin' && profile.role !== 'super_admin')) {
    alert('Access Denied');
    window.location.href = '../auth/login.html';
    return;
  }

  const fullName = profile.full_name || session.user.email.split('@')[0];
  document.getElementById('userName').textContent = fullName;
  document.getElementById('userEmail').textContent = session.user.email;
  document.getElementById('avatar').textContent = fullName.charAt(0).toUpperCase();

  const { data: students } = await db.from('profiles').select('*').eq('role', 'student').order('created_at', { ascending: false });
  allStudents = students || [];
  renderStudents(allStudents);

  document.getElementById('loading').classList.add('hidden');
  document.getElementById('studentsTableWrap').classList.remove('hidden');
})();
</script>

</body>
</html>
