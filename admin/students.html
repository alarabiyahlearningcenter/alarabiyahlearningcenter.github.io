<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Students | Admin Panel</title>
<meta name="theme-color" content="#0A3622">
<link rel="manifest" href="../manifest.json">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body{font-family:'Inter',sans-serif;background:#F9F7F2}
h1,h2,h3,h4{font-family:'Playfair Display',serif}
.btn-primary{background:#0A3622;color:white;transition:.2s}
.btn-primary:hover{background:#062218}
.sidebar-link{transition:all .2s}
.sidebar-link:hover,.sidebar-link.active{background:rgba(212,175,55,0.15);color:#0A3622;border-left:3px solid #D4AF37}
input:focus,select:focus{outline:none;border-color:#0A3622;box-shadow:0 0 0 3px rgba(10,54,34,0.1)}
.card-hover{transition:.3s}
.card-hover:hover{box-shadow:0 12px 24px rgba(10,54,34,.1)}
</style>
</head>
<body class="bg-cream text-charcoal min-h-screen">

<div id="admin-shell"></div>

<div id="page-content" class="hidden">
  <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 mb-6">
    <div>
      <h1 class="text-2xl md:text-3xl font-bold text-primary mb-1">Students</h1>
      <p class="text-charcoal/60 text-sm">Manage all registered students</p>
    </div>
    <input type="text" id="searchInput" placeholder="Search students..." class="px-4 py-2.5 border border-primary/20 rounded-full bg-white text-sm w-full sm:w-64">
  </div>

  <div id="loading" class="text-center py-20">
    <div class="inline-block animate-spin rounded-full h-8 w-8 border-4 border-primary/20 border-t-primary"></div>
  </div>

  <div id="studentsTableWrap" class="hidden bg-white rounded-2xl border border-primary/5 overflow-hidden">
    <div class="overflow-x-auto">
      <table class="w-full text-sm">
        <thead class="bg-cream border-b border-primary/10">
          <tr>
            <th class="text-left px-4 py-3 font-semibold text-primary">Student</th>
            <th class="text-left px-4 py-3 font-semibold text-primary hidden md:table-cell">Contact</th>
            <th class="text-left px-4 py-3 font-semibold text-primary hidden lg:table-cell">Country</th>
            <th class="text-left px-4 py-3 font-semibold text-primary">Joined</th>
            <th class="text-right px-4 py-3 font-semibold text-primary">Actions</th>
          </tr>
        </thead>
        <tbody id="studentsTable"></tbody>
      </table>
    </div>
  </div>
</div>

<script src="../assets/js/supabase-config.js"></script>
<script src="../assets/js/notifications.js"></script>
<script src="../assets/js/admin-shell.js"></script>
<script>
(async () => {
  const ctx = await initAdminShell();
  if (!ctx) return;
  const db = ctx.db;
  let allStudents = [];

  function renderStudents(list) {
    const tbody = document.getElementById('studentsTable');
    if (!list || list.length === 0) {
      tbody.innerHTML = '<tr><td colspan="5" class="text-center py-10 text-charcoal/60">No students found</td></tr>';
      return;
    }
    tbody.innerHTML = list.map(s => {
      const name = s.full_name || s.email?.split('@')[0] || 'Student';
      const joined = s.created_at ? new Date(s.created_at).toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' }) : 'N/A';
      const phoneDigits = (s.phone || '').replace(/[^0-9]/g, '') || '8801737326555';
      return `
        <tr class="border-b border-primary/5 hover:bg-cream/50">
          <td class="px-4 py-3">
            <div class="flex items-center gap-3">
              <div class="w-9 h-9 rounded-full bg-primary flex items-center justify-center text-secondary font-bold text-sm flex-shrink-0">${name.charAt(0).toUpperCase()}</div>
              <div class="min-w-0">
                <p class="font-semibold text-primary truncate">${name}</p>
                <p class="text-xs text-charcoal/60 truncate">${s.email || ''}</p>
              </div>
            </div>
          </td>
          <td class="px-4 py-3 hidden md:table-cell text-charcoal/70 text-xs">${s.phone || 'N/A'}</td>
          <td class="px-4 py-3 hidden lg:table-cell text-charcoal/70 text-xs">${s.country || 'N/A'}</td>
          <td class="px-4 py-3 text-charcoal/60 text-xs">${joined}</td>
          <td class="px-4 py-3 text-right">
            <a href="https://wa.me/${phoneDigits}" target="_blank" class="inline-flex items-center gap-1 text-xs bg-green-50 text-green-700 px-3 py-1.5 rounded-full font-semibold hover:bg-green-100">
              <svg class="w-3 h-3" fill="currentColor" viewBox="0 0 24 24"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347z"/></svg>
              WhatsApp
            </a>
          </td>
        </tr>
      `;
    }).join('');
  }

  document.getElementById('searchInput').addEventListener('input', (e) => {
    const q = e.target.value.toLowerCase().trim();
    if (!q) { renderStudents(allStudents); return; }
    renderStudents(allStudents.filter(s =>
      (s.full_name || '').toLowerCase().includes(q) ||
      (s.email || '').toLowerCase().includes(q) ||
      (s.phone || '').includes(q) ||
      (s.country || '').toLowerCase().includes(q)
    ));
  });

  const { data: students } = await db.from('profiles').select('*').eq('role', 'student').order('created_at', { ascending: false });
  allStudents = students || [];
  renderStudents(allStudents);

  document.getElementById('loading').classList.add('hidden');
  document.getElementById('studentsTableWrap').classList.remove('hidden');
})();
</script>

</body>
</html>
