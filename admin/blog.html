<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blog | Admin Panel</title>
<meta name="theme-color" content="#0A3622">
<link rel="manifest" href="../manifest.json">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body{font-family:'Inter',sans-serif;background:#F9F7F2}
h1,h2,h3,h4{font-family:'Playfair Display',serif}
.btn-primary{background:#0A3622;color:white;transition:.2s}
.btn-primary:hover{background:#062218}
.sidebar-link{transition:all .2s}
.sidebar-link:hover,.sidebar-link.active{background:rgba(212,175,55,0.15);color:#0A3622;border-left:3px solid #D4AF37}
input:focus,select:focus,textarea:focus{outline:none;border-color:#0A3622;box-shadow:0 0 0 3px rgba(10,54,34,.1)}
.card-hover{transition:.3s}
.card-hover:hover{box-shadow:0 12px 24px rgba(10,54,34,.1)}
</style>
</head>
<body class="bg-cream text-charcoal min-h-screen">

<div id="admin-shell"></div>

<div id="page-content" class="hidden">
  <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 mb-6">
    <div>
      <h1 class="text-2xl md:text-3xl font-bold text-primary mb-1">Blog Posts</h1>
      <p class="text-charcoal/60 text-sm">Create and manage articles</p>
    </div>
    <button onclick="openPostModal()" class="btn-primary px-5 py-2.5 rounded-full font-semibold text-sm">+ New Post</button>
  </div>

  <div class="grid grid-cols-3 gap-4 mb-6">
    <div class="bg-white rounded-2xl p-4 border border-primary/5">
      <p class="text-xs text-charcoal/60 mb-1">Total</p>
      <p id="statTotal" class="text-2xl font-bold text-primary">0</p>
    </div>
    <div class="bg-white rounded-2xl p-4 border border-primary/5">
      <p class="text-xs text-charcoal/60 mb-1">Published</p>
      <p id="statPublished" class="text-2xl font-bold text-green-600">0</p>
    </div>
    <div class="bg-white rounded-2xl p-4 border border-primary/5">
      <p class="text-xs text-charcoal/60 mb-1">Total Views</p>
      <p id="statViews" class="text-2xl font-bold text-secondary">0</p>
    </div>
  </div>

  <div id="loading" class="text-center py-10">
    <div class="inline-block animate-spin rounded-full h-8 w-8 border-4 border-primary/20 border-t-primary"></div>
  </div>

  <div id="postsGrid" class="grid sm:grid-cols-2 lg:grid-cols-3 gap-4"></div>
</div>

<div id="postModal" class="hidden fixed inset-0 z-50 bg-black/60 flex items-center justify-center p-4 overflow-y-auto">
  <div class="bg-white rounded-2xl max-w-2xl w-full my-8 max-h-[90vh] overflow-y-auto">
    <div class="sticky top-0 bg-primary text-white px-6 py-4 flex items-center justify-between rounded-t-2xl z-10">
      <h3 id="postModalTitle" class="font-bold text-lg">New Post</h3>
      <button onclick="closePostModal()" class="text-white/80 hover:text-white text-2xl leading-none">&times;</button>
    </div>
    <form id="postForm" class="p-6 space-y-4">
      <input type="hidden" id="postId">
      <div>
        <label class="block text-sm font-semibold text-primary mb-2">Title *</label>
        <input type="text" id="postTitle" required class="w-full px-4 py-3 border border-primary/20 rounded-xl bg-cream">
      </div>
      <div>
        <label class="block text-sm font-semibold text-primary mb-2">Slug *</label>
        <input type="text" id="postSlug" required placeholder="my-blog-post" class="w-full px-4 py-3 border border-primary/20 rounded-xl bg-cream font-mono text-sm">
        <p class="text-xs text-charcoal/50 mt-1">URL-friendly identifier (auto-generated from title)</p>
      </div>
      <div>
        <label class="block text-sm font-semibold text-primary mb-2">Excerpt</label>
        <textarea id="postExcerpt" rows="2" placeholder="Short summary shown on listing page" class="w-full px-4 py-3 border border-primary/20 rounded-xl bg-cream"></textarea>
      </div>
      <div>
        <label class="block text-sm font-semibold text-primary mb-2">Content *</label>
        <textarea id="postContent" rows="10" required placeholder="Write your article..." class="w-full px-4 py-3 border border-primary/20 rounded-xl bg-cream"></textarea>
        <p class="text-xs text-charcoal/50 mt-1">Plain text with line breaks supported</p>
      </div>
      <div>
        <label class="block text-sm font-semibold text-primary mb-2">Cover Image URL</label>
        <input type="url" id="postCover" placeholder="https://..." class="w-full px-4 py-3 border border-primary/20 rounded-xl bg-cream">
      </div>
      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="block text-sm font-semibold text-primary mb-2">Category</label>
          <select id="postCategory" class="w-full px-4 py-3 border border-primary/20 rounded-xl bg-cream">
            <option value="general">General</option>
            <option value="quran">Qur'an Learning</option>
            <option value="tajweed">Tajweed</option>
            <option value="hifz">Hifz</option>
            <option value="parenting">Parenting</option>
            <option value="islamic">Islamic Knowledge</option>
          </select>
        </div>
        <div>
          <label class="block text-sm font-semibold text-primary mb-2">Tags (comma separated)</label>
          <input type="text" id="postTags" placeholder="quran, learning" class="w-full px-4 py-3 border border-primary/20 rounded-xl bg-cream">
        </div>
      </div>
      <div>
        <label class="flex items-center gap-2 text-sm"><input type="checkbox" id="postPublish" checked> Publish immediately</label>
      </div>
      <button type="submit" id="postSubmitBtn" class="btn-primary w-full py-3.5 rounded-xl font-semibold">Save Post</button>
      <p id="postStatus" class="text-sm text-center hidden"></p>
    </form>
  </div>
</div>

<script src="../assets/js/supabase-config.js"></script>
<script src="../assets/js/notifications.js"></script>
<script src="../assets/js/admin-shell.js"></script>
<script>
(async () => {
  const ctx = await initAdminShell();
  if (!ctx) return;
  const db = ctx.db;
  let allPosts = [];

  window.closePostModal = () => document.getElementById('postModal').classList.add('hidden');

  function slugify(text) {
    return text.toLowerCase().trim().replace(/[^a-z0-9\s-]/g, '').replace(/\s+/g, '-').replace(/-+/g, '-').substring(0, 80);
  }

  document.getElementById('postTitle').addEventListener('input', (e) => {
    if (!document.getElementById('postId').value) {
      document.getElementById('postSlug').value = slugify(e.target.value);
    }
  });

  window.openPostModal = (p = null) => {
    document.getElementById('postModal').classList.remove('hidden');
    document.getElementById('postStatus').classList.add('hidden');
    if (p) {
      document.getElementById('postModalTitle').textContent = 'Edit Post';
      document.getElementById('postId').value = p.id;
      document.getElementById('postTitle').value = p.title || '';
      document.getElementById('postSlug').value = p.slug || '';
      document.getElementById('postExcerpt').value = p.excerpt || '';
      document.getElementById('postContent').value = p.content || '';
      document.getElementById('postCover').value = p.cover_image_url || '';
      document.getElementById('postCategory').value = p.category || 'general';
      document.getElementById('postTags').value = (p.tags || []).join(', ');
      document.getElementById('postPublish').checked = p.is_published !== false;
    } else {
      document.getElementById('postModalTitle').textContent = 'New Post';
      document.getElementById('postForm').reset();
      document.getElementById('postId').value = '';
      document.getElementById('postPublish').checked = true;
    }
  };

  async function loadPosts() {
    document.getElementById('loading').classList.remove('hidden');
    const { data } = await db.from('blog_posts').select('*').order('created_at', { ascending: false });
    allPosts = data || [];

    document.getElementById('statTotal').textContent = allPosts.length;
    document.getElementById('statPublished').textContent = allPosts.filter(p => p.is_published).length;
    document.getElementById('statViews').textContent = allPosts.reduce((s, p) => s + (p.views || 0), 0);

    renderPosts();
    document.getElementById('loading').classList.add('hidden');
  }

  function renderPosts() {
    const grid = document.getElementById('postsGrid');
    if (!allPosts.length) {
      grid.innerHTML = '<div class="col-span-full bg-white rounded-2xl p-10 text-center border border-primary/5 text-charcoal/60 text-sm">No posts yet. Click "New Post" to start.</div>';
      return;
    }
    grid.innerHTML = allPosts.map(p => {
      const date = new Date(p.created_at).toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' });
      return `
        <div class="bg-white rounded-2xl overflow-hidden border border-primary/5 card-hover">
          ${p.cover_image_url ? `<img src="${p.cover_image_url}" class="w-full h-40 object-cover">` : '<div class="w-full h-40 bg-primary/10 flex items-center justify-center"><span class="text-5xl">📝</span></div>'}
          <div class="p-5">
            <div class="flex items-start justify-between mb-3 gap-2">
              <span class="text-xs bg-primary/10 text-primary px-2 py-1 rounded-full font-semibold uppercase">${p.category || 'general'}</span>
              <span class="text-xs px-2 py-1 rounded-full font-semibold ${p.is_published ? 'bg-green-100 text-green-700' : 'bg-gray-100 text-gray-600'}">${p.is_published ? 'Published' : 'Draft'}</span>
            </div>
            <h3 class="font-bold text-primary mb-2 line-clamp-2">${p.title}</h3>
            <p class="text-xs text-charcoal/60 mb-3 line-clamp-2">${p.excerpt || (p.content || '').substring(0, 80) + '...'}</p>
            <div class="flex items-center justify-between text-xs text-charcoal/50 mb-3">
              <span>${date}</span>
              <span>👁️ ${p.views || 0}</span>
            </div>
            <div class="flex gap-2 pt-3 border-t border-primary/10">
              <a href="../blog-post.html?slug=${p.slug}" target="_blank" class="flex-1 text-center text-xs bg-secondary/20 text-primary px-3 py-2 rounded-full font-semibold">View</a>
              <button onclick='openPostModal(${JSON.stringify(p).replace(/'/g, "\\'")})' class="flex-1 text-xs bg-primary/10 text-primary px-3 py-2 rounded-full font-semibold">Edit</button>
              <button onclick="deletePost('${p.id}')" class="text-xs bg-red-50 text-red-600 px-3 py-2 rounded-full font-semibold">×</button>
            </div>
          </div>
        </div>
      `;
    }).join('');
  }

  window.deletePost = async (id) => {
    if (!confirm('Delete this post permanently?')) return;
    await db.from('blog_posts').delete().eq('id', id);
    loadPosts();
  };

  document.getElementById('postForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('postSubmitBtn');
    const status = document.getElementById('postStatus');
    btn.disabled = true;
    btn.textContent = 'Saving...';

    const id = document.getElementById('postId').value;
    const isPublished = document.getElementById('postPublish').checked;
    const tagsArr = document.getElementById('postTags').value.split(',').map(t => t.trim()).filter(Boolean);

    const { data: profile } = await db.from('profiles').select('full_name').eq('id', ctx.session.user.id).single();

    const payload = {
      title: document.getElementById('postTitle').value.trim(),
      slug: document.getElementById('postSlug').value.trim(),
      excerpt: document.getElementById('postExcerpt').value.trim(),
      content: document.getElementById('postContent').value.trim(),
      cover_image_url: document.getElementById('postCover').value.trim() || null,
      category: document.getElementById('postCategory').value,
      tags: tagsArr.length ? tagsArr : null,
      author_id: ctx.session.user.id,
      author_name: profile?.full_name || 'Admin',
      is_published: isPublished,
      published_at: isPublished ? new Date().toISOString() : null,
      updated_at: new Date().toISOString()
    };

    let error;
    if (id) {
      ({ error } = await db.from('blog_posts').update(payload).eq('id', id));
    } else {
      ({ error } = await db.from('blog_posts').insert(payload));
    }

    if (error) {
      status.textContent = '❌ ' + error.message;
      status.className = 'text-sm text-center text-red-600';
      status.classList.remove('hidden');
      btn.disabled = false;
      btn.textContent = 'Save Post';
      return;
    }

    // Notify all students if published
    if (isPublished && window.Notif) {
      window.Notif.toStudents('New Article Published 📰', payload.title, 'info', '/blog.html').catch(() => {});
    }

    status.textContent = '✓ Post saved!';
    status.className = 'text-sm text-center text-green-600';
    status.classList.remove('hidden');
    setTimeout(() => { closePostModal(); loadPosts(); }, 1000);
  });

  loadPosts();
})();
</script>

</body>
</html>
