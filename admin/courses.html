<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Courses | Admin Panel</title>
<meta name="theme-color" content="#0A3622">
<link rel="manifest" href="../manifest.json">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body{font-family:'Inter',sans-serif;background:#F9F7F2}
h1,h2,h3,h4{font-family:'Playfair Display',serif}
.btn-primary{background:#0A3622;color:white;transition:.2s}
.btn-primary:hover{background:#062218}
.sidebar-link{transition:all .2s}
.sidebar-link:hover,.sidebar-link.active{background:rgba(212,175,55,0.15);color:#0A3622;border-left:3px solid #D4AF37}
input:focus,select:focus,textarea:focus{outline:none;border-color:#0A3622;box-shadow:0 0 0 3px rgba(10,54,34,0.1)}
.card-hover{transition:.3s}
.card-hover:hover{transform:translateY(-3px);box-shadow:0 12px 24px rgba(10,54,34,.1)}
</style>
</head>
<body class="bg-cream text-charcoal min-h-screen">

<div id="admin-shell"></div>

<div id="page-content" class="hidden">
  <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 mb-6">
    <div>
      <h1 class="text-2xl md:text-3xl font-bold text-primary mb-1">Courses</h1>
      <p class="text-charcoal/60 text-sm">Manage all your courses with BDT & USD pricing</p>
    </div>
    <button onclick="openCourseModal()" class="btn-primary px-5 py-2.5 rounded-full font-semibold text-sm">+ New Course</button>
  </div>

  <div id="loading" class="text-center py-10">
    <div class="inline-block animate-spin rounded-full h-8 w-8 border-4 border-primary/20 border-t-primary"></div>
  </div>

  <div id="coursesGrid" class="grid sm:grid-cols-2 lg:grid-cols-3 gap-4"></div>
</div>

<div id="courseModal" class="hidden fixed inset-0 z-50 bg-black/60 flex items-center justify-center p-4">
  <div class="bg-white rounded-2xl max-w-lg w-full max-h-[90vh] overflow-y-auto">
    <div class="sticky top-0 bg-primary text-white px-6 py-4 flex items-center justify-between rounded-t-2xl">
      <h3 id="modalTitle" class="font-bold text-lg">New Course</h3>
      <button onclick="closeCourseModal()" class="text-white/80 hover:text-white text-2xl leading-none">&times;</button>
    </div>
    <form id="courseForm" class="p-6 space-y-4">
      <input type="hidden" id="courseId">
      <div>
        <label class="block text-sm font-semibold text-primary mb-2">Title *</label>
        <input type="text" id="title" required class="w-full px-4 py-3 border border-primary/20 rounded-xl bg-cream">
      </div>
      <div>
        <label class="block text-sm font-semibold text-primary mb-2">Slug *</label>
        <input type="text" id="slug" required placeholder="noorani-qaida" class="w-full px-4 py-3 border border-primary/20 rounded-xl bg-cream">
      </div>
      <div>
        <label class="block text-sm font-semibold text-primary mb-2">Description</label>
        <textarea id="description" rows="3" class="w-full px-4 py-3 border border-primary/20 rounded-xl bg-cream"></textarea>
      </div>

      <div class="bg-secondary/10 border border-secondary/30 rounded-xl p-3">
        <p class="text-xs text-primary font-semibold mb-2">💰 Pricing (fill both for international students)</p>
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-semibold text-primary mb-1">Price (BDT ৳)</label>
            <input type="number" id="priceBdt" value="0" min="0" class="w-full px-4 py-3 border border-primary/20 rounded-xl bg-white">
          </div>
          <div>
            <label class="block text-xs font-semibold text-primary mb-1">Price (USD $)</label>
            <input type="number" id="priceUsd" value="0" min="0" class="w-full px-4 py-3 border border-primary/20 rounded-xl bg-white">
          </div>
        </div>
      </div>

      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="block text-sm font-semibold text-primary mb-2">Duration (months)</label>
          <input type="number" id="duration" value="1" min="1" class="w-full px-4 py-3 border border-primary/20 rounded-xl bg-cream">
        </div>
        <div>
          <label class="block text-sm font-semibold text-primary mb-2">Level</label>
          <select id="level" class="w-full px-4 py-3 border border-primary/20 rounded-xl bg-cream">
            <option value="beginner">Beginner</option>
            <option value="intermediate">Intermediate</option>
            <option value="advanced">Advanced</option>
          </select>
        </div>
      </div>
      <div>
        <label class="block text-sm font-semibold text-primary mb-2">Category</label>
        <select id="category" class="w-full px-4 py-3 border border-primary/20 rounded-xl bg-cream">
          <option value="quran">Quran</option>
          <option value="islamic">Islamic</option>
          <option value="arabic">Arabic</option>
        </select>
      </div>
      <div class="flex items-center gap-4">
        <label class="flex items-center gap-2 text-sm"><input type="checkbox" id="isPopular"> Popular</label>
        <label class="flex items-center gap-2 text-sm"><input type="checkbox" id="isActive" checked> Active</label>
      </div>
      <button type="submit" class="btn-primary w-full py-3.5 rounded-xl font-semibold">Save Course</button>
      <p id="formStatus" class="text-sm text-center hidden"></p>
    </form>
  </div>
</div>

<script src="../assets/js/supabase-config.js"></script>
<script src="../assets/js/notifications.js"></script>
<script src="../assets/js/admin-shell.js"></script>
<script>
(async () => {
  const ctx = await initAdminShell();
  if (!ctx) return;
  const db = ctx.db;
  let allCourses = [];

  window.openCourseModal = (course = null) => {
    document.getElementById('courseModal').classList.remove('hidden');
    document.getElementById('formStatus').classList.add('hidden');
    if (course) {
      document.getElementById('modalTitle').textContent = 'Edit Course';
      document.getElementById('courseId').value = course.id;
      document.getElementById('title').value = course.title || '';
      document.getElementById('slug').value = course.slug || '';
      document.getElementById('description').value = course.description || '';
      document.getElementById('priceBdt').value = course.price_bdt || 0;
      document.getElementById('priceUsd').value = course.price_usd || 0;
      document.getElementById('duration').value = course.duration_months || 1;
      document.getElementById('level').value = course.level || 'beginner';
      document.getElementById('category').value = course.category || 'quran';
      document.getElementById('isPopular').checked = !!course.is_popular;
      document.getElementById('isActive').checked = !!course.is_active;
    } else {
      document.getElementById('modalTitle').textContent = 'New Course';
      document.getElementById('courseForm').reset();
      document.getElementById('courseId').value = '';
      document.getElementById('priceBdt').value = 0;
      document.getElementById('priceUsd').value = 0;
      document.getElementById('duration').value = 1;
      document.getElementById('isActive').checked = true;
    }
  };

  window.closeCourseModal = () => {
    document.getElementById('courseModal').classList.add('hidden');
  };

  function formatPrice(bdt, usd) {
    const parts = [];
    if (bdt && Number(bdt) > 0) parts.push('৳' + bdt);
    if (usd && Number(usd) > 0) parts.push('$' + usd);
    return parts.length ? parts.join(' / ') : 'Free';
  }

  async function loadCourses() {
    document.getElementById('loading').classList.remove('hidden');
    const { data } = await db.from('courses').select('*').order('sort_order', { ascending: true });
    allCourses = data || [];
    renderCourses();
    document.getElementById('loading').classList.add('hidden');
  }

  function renderCourses() {
    const grid = document.getElementById('coursesGrid');
    if (!allCourses.length) {
      grid.innerHTML = '<div class="col-span-full bg-white rounded-2xl p-10 text-center border border-primary/5 text-charcoal/60 text-sm">No courses yet. Click "New Course" to add.</div>';
      return;
    }
    grid.innerHTML = allCourses.map(c => `
      <div class="bg-white rounded-2xl p-5 border border-primary/5 card-hover">
        <div class="flex items-start justify-between mb-3">
          <div class="w-12 h-12 bg-primary rounded-xl flex items-center justify-center text-secondary font-bold">${c.title.charAt(0).toUpperCase()}</div>
          <div class="flex gap-1">
            ${c.is_popular ? '<span class="text-xs bg-secondary/20 text-primary px-2 py-0.5 rounded-full font-semibold">Popular</span>' : ''}
            <span class="text-xs px-2 py-0.5 rounded-full font-semibold ${c.is_active ? 'bg-green-100 text-green-700' : 'bg-gray-100 text-gray-600'}">${c.is_active ? 'Active' : 'Off'}</span>
          </div>
        </div>
        <h3 class="font-bold text-primary mb-1">${c.title}</h3>
        <p class="text-xs text-charcoal/60 mb-3 line-clamp-2">${c.description || 'No description'}</p>
        <div class="flex items-center justify-between text-xs mb-3">
          <span class="text-charcoal/60">${c.level || 'beginner'} • ${c.duration_months || 1}M</span>
          <span class="font-bold text-primary">${formatPrice(c.price_bdt, c.price_usd)}</span>
        </div>
        <div class="flex gap-2 pt-3 border-t border-primary/10">
          <button onclick='openCourseModal(${JSON.stringify(c).replace(/'/g, "\\'")})' class="flex-1 text-xs bg-primary/10 text-primary px-3 py-2 rounded-full font-semibold">Edit</button>
          <button onclick="deleteCourse('${c.id}')" class="text-xs bg-red-50 text-red-600 px-3 py-2 rounded-full font-semibold">Delete</button>
        </div>
      </div>
    `).join('');
  }

  window.deleteCourse = async (id) => {
    if (!confirm('Delete this course? This cannot be undone.')) return;
    const { error } = await db.from('courses').delete().eq('id', id);
    if (error) { alert('Error: ' + error.message); return; }
    loadCourses();
  };

  document.getElementById('courseForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = e.target.querySelector('button[type="submit"]');
    const status = document.getElementById('formStatus');
    btn.disabled = true;
    btn.textContent = 'Saving...';

    const id = document.getElementById('courseId').value;
    const payload = {
      title: document.getElementById('title').value.trim(),
      slug: document.getElementById('slug').value.trim().toLowerCase().replace(/\s+/g, '-'),
      description: document.getElementById('description').value.trim(),
      price_bdt: Number(document.getElementById('priceBdt').value) || 0,
      price_usd: Number(document.getElementById('priceUsd').value) || 0,
      duration_months: Number(document.getElementById('duration').value) || 1,
      level: document.getElementById('level').value,
      category: document.getElementById('category').value,
      is_popular: document.getElementById('isPopular').checked,
      is_active: document.getElementById('isActive').checked
    };

    let error;
    if (id) {
      ({ error } = await db.from('courses').update(payload).eq('id', id));
    } else {
      ({ error } = await db.from('courses').insert(payload));
    }

    if (error) {
      status.textContent = 'Error: ' + error.message;
      status.className = 'text-sm text-center text-red-600';
      status.classList.remove('hidden');
      btn.disabled = false;
      btn.textContent = 'Save Course';
      return;
    }
    status.textContent = '✓ Saved!';
    status.className = 'text-sm text-center text-green-600';
    status.classList.remove('hidden');
    setTimeout(() => {
      closeCourseModal();
      btn.disabled = false;
      btn.textContent = 'Save Course';
      loadCourses();
    }, 800);
  });

  loadCourses();
})();
</script>

</body>
</html>
