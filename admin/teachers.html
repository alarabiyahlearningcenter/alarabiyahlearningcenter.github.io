<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Teachers | Admin Panel</title>
<meta name="theme-color" content="#0A3622">
<link rel="manifest" href="../manifest.json">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body{font-family:'Inter',sans-serif;background:#F9F7F2}
h1,h2,h3,h4{font-family:'Playfair Display',serif}
.btn-primary{background:#0A3622;color:white;transition:.2s}
.btn-primary:hover{background:#062218}
.btn-approve{background:#16a34a;color:white}
.btn-approve:hover{background:#15803d}
.btn-reject{background:#dc2626;color:white}
.btn-reject:hover{background:#b91c1c}
.sidebar-link{transition:all .2s}
.sidebar-link:hover,.sidebar-link.active{background:rgba(212,175,55,0.15);color:#0A3622;border-left:3px solid #D4AF37}
.card-hover{transition:.3s}
.card-hover:hover{box-shadow:0 12px 24px rgba(10,54,34,.1)}
</style>
</head>
<body class="bg-cream text-charcoal min-h-screen">

<div id="admin-shell"></div>

<div id="page-content" class="hidden">
  <div class="mb-6">
    <h1 class="text-2xl md:text-3xl font-bold text-primary mb-1">Teachers</h1>
    <p class="text-charcoal/60 text-sm">Approve and manage teachers</p>
  </div>

  <div id="pendingSection" class="mb-8 hidden">
    <h2 class="text-lg font-bold text-primary mb-3 flex items-center gap-2">
      <span class="w-2 h-2 bg-yellow-500 rounded-full animate-pulse"></span>
      Pending Approval (<span id="pendingCount">0</span>)
    </h2>
    <div id="pendingTeachers" class="grid sm:grid-cols-2 lg:grid-cols-3 gap-4"></div>
  </div>

  <div>
    <h2 class="text-lg font-bold text-primary mb-3">All Teachers</h2>
    <div id="loading" class="text-center py-10">
      <div class="inline-block animate-spin rounded-full h-8 w-8 border-4 border-primary/20 border-t-primary"></div>
    </div>
    <div id="allTeachers" class="grid sm:grid-cols-2 lg:grid-cols-3 gap-4"></div>
  </div>
</div>

<script src="../assets/js/supabase-config.js"></script>
<script src="../assets/js/notifications.js"></script>
<script src="../assets/js/admin-shell.js"></script>
<script>
(async () => {
  const ctx = await initAdminShell();
  if (!ctx) return;
  const db = ctx.db;

  function teacherCard(t, isPending) {
    const name = t.name || 'Teacher';
    const exp = t.experience_years || 0;
    const spec = (t.specialities && t.specialities.length) ? t.specialities.join(', ') : 'N/A';
    const joined = t.created_at ? new Date(t.created_at).toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' }) : 'N/A';
    return `
      <div class="bg-white rounded-2xl p-5 border ${isPending ? 'border-yellow-300' : 'border-primary/5'} card-hover">
        <div class="flex items-center gap-3 mb-3">
          <div class="w-12 h-12 rounded-full bg-primary flex items-center justify-center text-secondary font-bold text-lg flex-shrink-0">${name.charAt(0).toUpperCase()}</div>
          <div class="min-w-0 flex-1">
            <p class="font-bold text-primary text-sm truncate">${name}</p>
            <p class="text-xs text-charcoal/60">${exp}+ years experience</p>
          </div>
          <span class="text-xs px-2 py-1 rounded-full font-semibold ${isPending ? 'bg-yellow-100 text-yellow-700' : 'bg-green-100 text-green-700'}">${isPending ? 'Pending' : 'Active'}</span>
        </div>
        ${t.bio ? `<p class="text-xs text-charcoal/70 mb-3 line-clamp-2">${t.bio}</p>` : ''}
        <div class="text-xs text-charcoal/60 mb-3 space-y-1">
          <p><span class="font-semibold text-primary">Specialities:</span> ${spec}</p>
          <p><span class="font-semibold text-primary">Joined:</span> ${joined}</p>
        </div>
        <div class="flex gap-2 pt-3 border-t border-primary/10">
          ${isPending ? `
            <button onclick="approveTeacher('${t.id}', '${name.replace(/'/g, "\\'")}')" class="btn-approve flex-1 text-xs px-3 py-2 rounded-full font-semibold">✓ Approve</button>
            <button onclick="rejectTeacher('${t.id}', '${name.replace(/'/g, "\\'")}')" class="btn-reject text-xs px-3 py-2 rounded-full font-semibold">✕ Reject</button>
          ` : `
            <button onclick="toggleActive('${t.id}', ${t.is_active})" class="flex-1 text-xs px-3 py-2 rounded-full font-semibold ${t.is_active ? 'bg-yellow-100 text-yellow-700' : 'bg-green-100 text-green-700'}">
              ${t.is_active ? 'Deactivate' : 'Activate'}
            </button>
            <button onclick="deleteTeacher('${t.id}', '${name.replace(/'/g, "\\'")}')" class="text-xs bg-red-50 text-red-600 px-3 py-2 rounded-full font-semibold">Delete</button>
          `}
        </div>
      </div>
    `;
  }

  async function loadTeachers() {
    document.getElementById('loading').classList.remove('hidden');

    const { data: all } = await db.from('teachers').select('*').order('created_at', { ascending: false });
    const teachers = all || [];
    const pending = teachers.filter(t => !t.is_active);
    const active = teachers.filter(t => t.is_active);

    if (pending.length > 0) {
      document.getElementById('pendingSection').classList.remove('hidden');
      document.getElementById('pendingCount').textContent = pending.length;
      document.getElementById('pendingTeachers').innerHTML = pending.map(t => teacherCard(t, true)).join('');
    } else {
      document.getElementById('pendingSection').classList.add('hidden');
    }

    document.getElementById('loading').classList.add('hidden');
    if (active.length === 0) {
      document.getElementById('allTeachers').innerHTML = '<div class="col-span-full bg-white rounded-2xl p-8 text-center border border-primary/5 text-charcoal/60 text-sm">No active teachers yet</div>';
    } else {
      document.getElementById('allTeachers').innerHTML = active.map(t => teacherCard(t, false)).join('');
    }
  }

  window.approveTeacher = async (id, name) => {
    if (!confirm(`Approve "${name}" as a teacher?`)) return;
    const { error } = await db.from('teachers').update({ is_active: true }).eq('id', id);
    if (error) { alert('Error: ' + error.message); return; }

    // Send notification to the teacher
    const { data: teacher } = await db.from('teachers').select('profile_id').eq('id', id).single();
    if (teacher?.profile_id) {
      await Notif.send(
        teacher.profile_id,
        'Welcome to the Team! 🎉',
        'Your teacher account has been approved. You can now access the Teacher Panel.',
        'success',
        '/teacher/dashboard.html'
      );
    }

    alert('✓ Teacher approved!');
    loadTeachers();
  };

  window.rejectTeacher = async (id, name) => {
    if (!confirm(`Reject and delete "${name}"\'s teacher application?`)) return;
    const { error } = await db.from('teachers').delete().eq('id', id);
    if (error) { alert('Error: ' + error.message); return; }
    alert('Teacher application rejected.');
    loadTeachers();
  };

  window.toggleActive = async (id, currentStatus) => {
    const { error } = await db.from('teachers').update({ is_active: !currentStatus }).eq('id', id);
    if (error) { alert('Error: ' + error.message); return; }
    loadTeachers();
  };

  window.deleteTeacher = async (id, name) => {
    if (!confirm(`Delete "${name}"? This cannot be undone.`)) return;
    const { error } = await db.from('teachers').delete().eq('id', id);
    if (error) { alert('Error: ' + error.message); return; }
    loadTeachers();
  };

  loadTeachers();
})();
</script>

</body>
</html>
