<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Dashboard | Al-Arabiyah Learning Center</title>
<meta name="theme-color" content="#0A3622">
<link rel="manifest" href="../manifest.json">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body{font-family:'Inter',sans-serif;background:#F9F7F2}
h1,h2,h3,h4{font-family:'Playfair Display',serif}
.btn-primary{background:#0A3622;color:white;transition:.2s}
.btn-primary:hover{background:#062218}
.sidebar-link{transition:all .2s}
.sidebar-link:hover,.sidebar-link.active{background:rgba(212,175,55,0.15);color:#0A3622;border-left:3px solid #D4AF37}
.card-hover{transition:.3s}
.card-hover:hover{transform:translateY(-3px);box-shadow:0 12px 24px rgba(10,54,34,.1)}
</style>
</head>
<body class="bg-cream text-charcoal min-h-screen">

<div id="admin-shell"></div>

<div id="page-content" class="hidden">
  <div class="mb-6">
    <h1 class="text-2xl md:text-3xl font-bold text-primary mb-1">Admin Dashboard</h1>
    <p class="text-charcoal/60 text-sm">Overview of your platform</p>
  </div>

  <div class="grid grid-cols-2 lg:grid-cols-4 gap-4 mb-6">
    <div class="bg-white rounded-2xl p-5 card-hover border border-primary/5">
      <div class="w-10 h-10 bg-blue-100 rounded-xl flex items-center justify-center mb-3">
        <svg class="w-5 h-5 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"/></svg>
      </div>
      <p id="statStudents" class="text-2xl font-bold text-primary">0</p>
      <p class="text-xs text-charcoal/60 mt-1">Total Students</p>
    </div>
    <div class="bg-white rounded-2xl p-5 card-hover border border-primary/5">
      <div class="w-10 h-10 bg-secondary/15 rounded-xl flex items-center justify-center mb-3">
        <svg class="w-5 h-5 text-secondary" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
      </div>
      <p id="statTeachers" class="text-2xl font-bold text-primary">0</p>
      <p class="text-xs text-charcoal/60 mt-1">Total Teachers</p>
    </div>
    <div class="bg-white rounded-2xl p-5 card-hover border border-primary/5">
      <div class="w-10 h-10 bg-green-100 rounded-xl flex items-center justify-center mb-3">
        <svg class="w-5 h-5 text-green-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
      </div>
      <p id="statRevenue" class="text-2xl font-bold text-primary">৳0</p>
      <p class="text-xs text-charcoal/60 mt-1">Total Revenue</p>
    </div>
    <div class="bg-white rounded-2xl p-5 card-hover border border-primary/5">
      <div class="w-10 h-10 bg-yellow-100 rounded-xl flex items-center justify-center mb-3">
        <svg class="w-5 h-5 text-yellow-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/></svg>
      </div>
      <p id="statPending" class="text-2xl font-bold text-primary">0</p>
      <p class="text-xs text-charcoal/60 mt-1">Pending Actions</p>
    </div>
  </div>

  <div class="grid lg:grid-cols-2 gap-6">
    <div class="bg-white rounded-2xl p-6 border border-primary/5">
      <div class="flex items-center justify-between mb-4">
        <h3 class="text-lg font-bold text-primary">Pending Payments</h3>
        <a href="payments.html" class="text-xs text-secondary font-semibold hover:underline">View All</a>
      </div>
      <div id="pendingPaymentsList">
        <p class="text-charcoal/60 text-sm text-center py-6">Loading...</p>
      </div>
    </div>

    <div class="bg-white rounded-2xl p-6 border border-primary/5">
      <div class="flex items-center justify-between mb-4">
        <h3 class="text-lg font-bold text-primary">Recent Users</h3>
        <a href="students.html" class="text-xs text-secondary font-semibold hover:underline">View All</a>
      </div>
      <div id="recentUsersList">
        <p class="text-charcoal/60 text-sm text-center py-6">Loading...</p>
      </div>
    </div>
  </div>
</div>

<script src="../assets/js/supabase-config.js"></script>
<script src="../assets/js/notifications.js"></script>
<script src="../assets/js/push-notifications.js"></script>
<script src="../assets/js/admin-shell.js"></script>
<script>
(async () => {
  const ctx = await initAdminShell();
  if (!ctx) return;
  const db = ctx.db;

  // Stats
  const { count: studentCount } = await db.from('profiles').select('*', { count: 'exact', head: true }).eq('role', 'student');
  const { count: teacherCount } = await db.from('profiles').select('*', { count: 'exact', head: true }).eq('role', 'teacher');
  const { data: payments } = await db.from('payments').select('amount, status');
  const totalRevenue = (payments || []).filter(p => p.status === 'verified').reduce((s, p) => s + Number(p.amount || 0), 0);
  const pendingPayments = (payments || []).filter(p => p.status === 'pending').length;
  const { count: pendingTeachers } = await db.from('teachers').select('*', { count: 'exact', head: true }).eq('is_active', false);

  document.getElementById('statStudents').textContent = studentCount || 0;
  document.getElementById('statTeachers').textContent = teacherCount || 0;
  document.getElementById('statRevenue').textContent = '৳' + totalRevenue;
  document.getElementById('statPending').textContent = pendingPayments + (pendingTeachers || 0);

  // Pending Payments
  const { data: pendingData } = await db.from('payments').select('*').eq('status', 'pending').order('created_at', { ascending: false }).limit(5);
  const pendingBox = document.getElementById('pendingPaymentsList');

  if (!pendingData || pendingData.length === 0) {
    pendingBox.innerHTML = '<p class="text-charcoal/60 text-sm text-center py-6">No pending payments</p>';
  } else {
    const studentIds = pendingData.map(p => p.student_id).filter(Boolean);
    const { data: students } = await db.from('profiles').select('id, full_name, email').in('id', studentIds);
    const studentMap = {};
    (students || []).forEach(s => studentMap[s.id] = s);

    pendingBox.innerHTML = pendingData.map(p => {
      const student = studentMap[p.student_id];
      const sName = student?.full_name || student?.email?.split('@')[0] || 'Unknown';
      const date = new Date(p.created_at).toLocaleDateString('en-GB', { day: '2-digit', month: 'short' });
      return `
        <div class="flex items-center justify-between py-3 border-b border-primary/10 last:border-0">
          <div>
            <p class="font-semibold text-primary text-sm">${sName}</p>
            <p class="text-xs text-charcoal/60">${p.method?.toUpperCase() || 'N/A'} • ${date}</p>
          </div>
          <div class="text-right">
            <p class="font-bold text-primary text-sm">৳${p.amount}</p>
            <a href="payments.html" class="text-xs text-secondary font-semibold">Verify →</a>
          </div>
        </div>
      `;
    }).join('');
  }

  // Recent Users
  const { data: recentUsers } = await db.from('profiles').select('*').order('created_at', { ascending: false }).limit(5);
  const usersBox = document.getElementById('recentUsersList');

  if (!recentUsers || recentUsers.length === 0) {
    usersBox.innerHTML = '<p class="text-charcoal/60 text-sm text-center py-6">No users yet</p>';
  } else {
    usersBox.innerHTML = recentUsers.map(u => {
      const name = u.full_name || u.email?.split('@')[0] || 'User';
      const roleColor = u.role === 'super_admin' ? 'background:#D4AF37;color:#0A3622' : u.role === 'admin' ? 'background:rgba(10,54,34,.15);color:#0A3622' : u.role === 'teacher' ? 'background:rgba(212,175,55,.25);color:#0A3622' : 'background:#dbeafe;color:#1e40af';
      const roleLabel = u.role === 'super_admin' ? '👑 Super' : u.role === 'admin' ? 'Admin' : u.role === 'teacher' ? 'Teacher' : 'Student';
      return `
        <div class="flex items-center gap-3 py-3 border-b border-primary/10 last:border-0">
          <div class="w-9 h-9 rounded-full bg-primary flex items-center justify-center text-secondary font-bold text-sm flex-shrink-0">${name.charAt(0).toUpperCase()}</div>
          <div class="flex-1 min-w-0">
            <p class="font-semibold text-primary text-sm truncate">${name}</p>
            <p class="text-xs text-charcoal/60 truncate">${u.email || ''}</p>
          </div>
          <span class="text-xs px-2 py-0.5 rounded-full font-semibold" style="${roleColor}">${roleLabel}</span>
        </div>
      `;
    }).join('');
  }
})();

// ===== Push Notification Subscribe =====
(async () => {
  const card = document.getElementById('pushSubscribeCard');
  const btn = document.getElementById('subscribeBtn');
  if (!card || !btn || !window.PushManager) return;
  if (!window.PushManager.isSupported()) return;

  const perm = window.PushManager.getPermission();
  if (perm === 'denied') return;

  const subscribed = await window.PushManager.isSubscribed();
  if (subscribed) {
    card.innerHTML = `
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 bg-green-500 rounded-full flex items-center justify-center flex-shrink-0">
          <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"/></svg>
        </div>
        <div>
          <p class="font-bold text-sm">Notifications Enabled</p>
          <p class="text-xs text-white/70 mt-0.5">You'll receive class reminders</p>
        </div>
      </div>
    `;
    return;
  }
  card.classList.remove('hidden');
  btn.addEventListener('click', async () => {
    btn.disabled = true;
    btn.textContent = 'Enabling...';
    try {
      const { data: { session } } = await db.auth.getSession();
      if (!session) { alert('Please login first'); return; }
      await window.PushManager.subscribe(session.user.id);
      card.innerHTML = `
        <div class="flex items-center gap-3">
          <div class="w-10 h-10 bg-green-500 rounded-full flex items-center justify-center flex-shrink-0">
            <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"/></svg>
          </div>
          <div>
            <p class="font-bold text-sm">✓ Notifications Enabled!</p>
            <p class="text-xs text-white/70 mt-0.5">You'll get reminders before class</p>
          </div>
        </div>
      `;
    } catch (err) {
      btn.disabled = false;
      btn.textContent = 'Enable Now';
      alert('Could not enable: ' + err.message);
    }
  });
})();

</script>

</body>
</html>
