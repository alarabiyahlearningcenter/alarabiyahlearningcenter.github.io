<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Profile — Al-Arabiyah</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  body { font-family: 'Segoe UI', system-ui, sans-serif; background: #faf8f2; color: #1a3a2a; }
  .card { background: #fff; border-radius: 16px; padding: 20px; box-shadow: 0 4px 20px rgba(10,54,34,.06); }
  .avatar-lg { width: 80px; height: 80px; border-radius: 50%; background: #0A3622; color: #D4AF37; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 30px; }
  .avatar-sm { width: 52px; height: 52px; border-radius: 50%; background: #0A3622; color: #D4AF37; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 18px; }
  .teacher-card { display: flex; gap: 14px; padding: 16px; border-radius: 14px; background: #fff; border: 1px solid #e5e7eb; transition: all .2s; }
  .teacher-card:hover { border-color: #D4AF37; box-shadow: 0 6px 20px rgba(212,175,55,.15); }
  .badge { display: inline-block; padding: 3px 10px; border-radius: 999px; font-size: 11px; font-weight: 700; }
  .badge-green { background: #dcfce7; color: #15803d; }
  .badge-gold { background: #fef3c7; color: #92400e; }
</style>
</head>
<body>

<header style="background:#0A3622;padding:16px 20px;position:sticky;top:0;z-index:50">
  <div style="max-width:800px;margin:0 auto;display:flex;justify-content:space-between;align-items:center">
    <h1 style="color:#D4AF37;font-weight:700;font-size:18px">My Profile</h1>
    <a href="index.html" style="color:#fff;font-size:13px;text-decoration:none">← Home</a>
  </div>
</header>

<main style="max-width:800px;margin:0 auto;padding:20px">

  <!-- Profile card -->
  <div class="card" style="display:flex;gap:18px;align-items:center;margin-bottom:20px">
    <div id="myAvatar" class="avatar-lg">?</div>
    <div style="flex:1">
      <h2 id="myName" style="font-size:22px;font-weight:800;color:#0A3622">Loading...</h2>
      <p id="myEmail" style="font-size:13px;color:#6b7280;margin-top:2px"></p>
      <span id="myRole" class="badge badge-gold" style="margin-top:6px">Student</span>
    </div>
  </div>

  <!-- Assigned Teachers -->
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
    <h3 style="font-size:18px;font-weight:700;color:#0A3622">👨‍🏫 My Teachers</h3>
    <button onclick="loadTeachers()" style="background:#fff;border:2px solid #0A3622;color:#0A3622;padding:6px 14px;border-radius:999px;font-weight:600;font-size:12px">🔄 Refresh</button>
  </div>

  <div id="teachersList" style="display:flex;flex-direction:column;gap:12px"></div>

</main>

<script>
const SUPABASE_URL = 'https://vgsgisyneymtszuslftb.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZnc2dpc3luZXltdHN6dXNsZnRiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA0NTg0NjQsImV4cCI6MjEwNjAzNDQ2NH0.HaYptmVnZCbGiOCg1NyYkcdHQDqjXlAHeq_i_bTC6Yk';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let currentUser = null;

async function init() {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) { window.location.href = 'auth/login.html'; return; }
  currentUser = session.user;

  const { data: profile } = await sb.from('profiles').select('*').eq('id', currentUser.id).single();
  const name = profile?.full_name || currentUser.email;
  document.getElementById('myName').textContent = name;
  document.getElementById('myEmail').textContent = currentUser.email;
  document.getElementById('myAvatar').textContent = name[0].toUpperCase();
  document.getElementById('myRole').textContent = (profile?.role || 'student').toUpperCase();

  await loadTeachers();
}

async function loadTeachers() {
  const box = document.getElementById('teachersList');
  box.innerHTML = '<p style="text-align:center;padding:20px;color:#6b7280">Loading...</p>';

  const { data, error } = await sb
    .from('teacher_students')
    .select(`
      id, subjects, schedule, status, assigned_at,
      teacher:profiles!teacher_students_teacher_id_fkey (id, full_name, email, avatar_url, bio)
    `)
    .eq('student_id', currentUser.id)
    .eq('status', 'active');

  if (error) {
    box.innerHTML = '<p style="text-align:center;padding:20px;color:#dc2626">Failed to load: ' + error.message + '</p>';
    return;
  }

  if (!data || !data.length) {
    box.innerHTML = '<div class="card" style="text-align:center;padding:40px"><p style="font-size:14px;color:#6b7280">You have not been assigned to any teacher yet.</p><p style="font-size:12px;color:#9ca3af;margin-top:6px">Please wait for admin to assign you.</p></div>';
    return;
  }

  box.innerHTML = data.map(row => {
    const t = row.teacher;
    if (!t) return '';
    const initial = (t.full_name || t.email || '?')[0].toUpperCase();
    const subjects = (row.subjects || []).join(', ') || 'General';
    const schedule = row.schedule || 'Not set';
    return `
      <div class="teacher-card">
        <div class="avatar-sm">${initial}</div>
        <div style="flex:1;min-width:0">
          <p style="font-weight:700;color:#0A3622;font-size:15px">${escapeHtml(t.full_name || 'Teacher')}</p>
          <p style="font-size:12px;color:#6b7280">${escapeHtml(t.email || '')}</p>
          <p style="font-size:12px;color:#0A3622;margin-top:6px">📚 <b>${escapeHtml(subjects)}</b></p>
          <p style="font-size:12px;color:#0A3622;margin-top:2px">🕐 ${escapeHtml(schedule)}</p>
          ${t.bio ? '<p style="font-size:12px;color:#6b7280;margin-top:6px;font-style:italic">' + escapeHtml(t.bio) + '</p>' : ''}
        </div>
        <div>
          <span class="badge badge-green">${row.status}</span>
        </div>
      </div>
    `;
  }).join('');
}

function escapeHtml(t) {
  const d = document.createElement('div');
  d.textContent = t || '';
  return d.innerHTML;
}

init();
</script>

</body>
</html>
