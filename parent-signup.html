<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Parent Signup | Al-Arabiyah Learning Center</title>
<meta name="theme-color" content="#0A3622">
<link rel="manifest" href="manifest.json">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body{font-family:'Inter',sans-serif;background:#F9F7F2}
h1,h2,h3{font-family:'Playfair Display',serif}
.islamic-pattern{background-image:radial-gradient(circle at 20% 30%,rgba(212,175,55,0.08) 0%,transparent 50%),radial-gradient(circle at 80% 70%,rgba(10,54,34,0.05) 0%,transparent 50%)}
.btn-primary{background:#0A3622;color:white;transition:.2s}
.btn-primary:hover{background:#062218}
.btn-primary:disabled{opacity:.6;cursor:not-allowed}
input:focus{outline:none;border-color:#0A3622;box-shadow:0 0 0 3px rgba(10,54,34,.1)}
.code-input{font-family:'Courier New',monospace;font-size:24px;font-weight:700;letter-spacing:6px;text-align:center;text-transform:uppercase}
.student-card{background:linear-gradient(135deg,#F9F7F2,#F0EBD8);border:2px solid #D4AF37;border-radius:16px;padding:16px}
</style>
</head>
<body class="bg-cream min-h-screen flex flex-col islamic-pattern">

<header class="bg-cream border-b border-primary/10">
  <div class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between">
    <a href="index.html" class="flex items-center gap-3">
      <img src="assets/images/logo.png" alt="Al-Arabiyah" class="w-12 h-12 rounded-full border-2 border-secondary object-cover">
      <div class="hidden sm:block">
        <div class="font-heading font-bold text-primary text-base leading-tight">Al-Arabiyah</div>
        <div class="text-xs text-primary/70">Learning Center</div>
      </div>
    </a>
    <a href="index.html" class="text-primary font-medium text-sm hover:text-secondary">Back to Home</a>
  </div>
</header>

<main class="flex-1 flex items-center justify-center py-12 px-4">
  <div class="w-full max-w-md">
    <div class="bg-white rounded-3xl shadow-xl border border-primary/5 p-8">
      <div class="text-center mb-6">
        <div class="w-16 h-16 bg-primary/10 rounded-2xl flex items-center justify-center mx-auto mb-3">
          <svg class="w-8 h-8 text-primary" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
        </div>
        <h1 class="text-3xl font-bold text-primary mb-2">Parent Signup</h1>
        <p class="text-charcoal/60 text-sm">Monitor your child's learning journey</p>
      </div>

      <!-- Step 1: Enter Code -->
      <div id="step1">
        <div class="bg-blue-50 border border-blue-200 rounded-xl p-4 mb-5">
          <p class="text-xs text-blue-800">💡 Ask your child to generate an invite code from their dashboard → "Parent Access"</p>
        </div>

        <form id="codeForm" class="space-y-4">
          <div>
            <label class="block text-sm font-semibold text-primary mb-2">Invite Code *</label>
            <input type="text" id="inviteCode" required maxlength="6" placeholder="ABC123" class="code-input w-full px-4 py-4 border-2 border-primary/20 rounded-xl bg-cream">
          </div>
          <button type="submit" id="verifyBtn" class="btn-primary w-full py-3.5 rounded-xl font-semibold">Verify Code</button>
          <p id="codeStatus" class="text-sm text-center hidden"></p>
        </form>
      </div>

      <!-- Step 2: Student Confirmed -->
      <div id="step2" class="hidden">
        <div id="studentCard" class="student-card mb-5"></div>

        <form id="signupForm" class="space-y-4">
          <div>
            <label class="block text-sm font-semibold text-primary mb-2">Your Full Name *</label>
            <input type="text" id="parentName" required class="w-full px-4 py-3 border border-primary/20 rounded-xl bg-cream">
          </div>
          <div>
            <label class="block text-sm font-semibold text-primary mb-2">Email *</label>
            <input type="email" id="parentEmail" required class="w-full px-4 py-3 border border-primary/20 rounded-xl bg-cream">
          </div>
          <div>
            <label class="block text-sm font-semibold text-primary mb-2">Phone / WhatsApp *</label>
            <input type="tel" id="parentPhone" required class="w-full px-4 py-3 border border-primary/20 rounded-xl bg-cream">
          </div>
          <div>
            <label class="block text-sm font-semibold text-primary mb-2">Password *</label>
            <div class="relative">
              <input type="password" id="parentPassword" required minlength="6" class="w-full px-4 py-3 border border-primary/20 rounded-xl bg-cream pr-12">
              <button type="button" id="togglePw" class="absolute right-3 top-1/2 -translate-y-1/2 text-charcoal/50">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/></svg>
              </button>
            </div>
          </div>
          <div class="flex items-start gap-2">
            <input type="checkbox" id="terms" required class="mt-1">
            <label for="terms" class="text-xs text-charcoal/60">
              I agree to the <a href="terms.html" class="text-primary underline">Terms</a> & <a href="privacy-policy.html" class="text-primary underline">Privacy Policy</a>
            </label>
          </div>
          <button type="submit" id="signupBtn" class="btn-primary w-full py-3.5 rounded-xl font-semibold">Create Parent Account</button>
          <p id="signupStatus" class="text-sm text-center hidden"></p>
        </form>

        <button onclick="resetSteps()" class="w-full text-xs text-charcoal/60 hover:text-primary mt-4">← Change code</button>
      </div>

      <div class="mt-6 text-center text-sm text-charcoal/60">
        Already have an account? <a href="auth/login.html" class="text-primary font-semibold hover:text-secondary">Login</a>
      </div>
    </div>
  </div>
</main>

<script>
const SUPABASE_URL = 'https://vgsgisyneymtszuslftb.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZnc2dpc3luZXltdHN6dXNsZnRiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA0NTg0NjQsImV4cCI6MjEwNjAzNDQ2NH0.HaYptmVnZCbGiOCg1NyYkcdHQDqjXlAHeq_i_bTC6Yk';
const { createClient } = supabase;
const db = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let verifiedLink = null;
let verifiedStudent = null;

// Auto-fill code from URL
const urlParams = new URLSearchParams(window.location.search);
const refCode = urlParams.get('code');
if (refCode) {
  document.getElementById('inviteCode').value = refCode.toUpperCase();
}

// Toggle password
document.getElementById('togglePw').addEventListener('click', () => {
  const pw = document.getElementById('parentPassword');
  pw.type = pw.type === 'password' ? 'text' : 'password';
});

// Code input — only uppercase alphanumeric
document.getElementById('inviteCode').addEventListener('input', (e) => {
  e.target.value = e.target.value.toUpperCase().replace(/[^A-Z0-9]/g, '');
});

// Step 1: Verify code
document.getElementById('codeForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = document.getElementById('verifyBtn');
  const status = document.getElementById('codeStatus');
  const code = document.getElementById('inviteCode').value.trim();

  if (code.length !== 6) {
    status.textContent = '❌ Code must be 6 characters';
    status.className = 'text-sm text-center text-red-600';
    status.classList.remove('hidden');
    return;
  }

  btn.disabled = true;
  btn.textContent = 'Verifying...';
  status.classList.add('hidden');

  const { data: link, error } = await db.from('parent_links')
    .select('*')
    .eq('link_code', code)
    .eq('status', 'pending')
    .maybeSingle();

  if (error || !link) {
    status.textContent = '❌ Invalid or already used code';
    status.className = 'text-sm text-center text-red-600';
    status.classList.remove('hidden');
    btn.disabled = false;
    btn.textContent = 'Verify Code';
    return;
  }

  // Get student info
  const { data: student } = await db.from('profiles').select('id, full_name, email, avatar_url, country').eq('id', link.student_id).single();

  if (!student) {
    status.textContent = '❌ Student account not found';
    status.className = 'text-sm text-center text-red-600';
    status.classList.remove('hidden');
    btn.disabled = false;
    btn.textContent = 'Verify Code';
    return;
  }

  verifiedLink = link;
  verifiedStudent = student;

  // Show student card
  const initials = (student.full_name || student.email || 'S').charAt(0).toUpperCase();
  document.getElementById('studentCard').innerHTML = `
    <div class="flex items-center gap-3">
      <div class="w-14 h-14 rounded-full bg-primary flex items-center justify-center text-secondary font-bold text-xl flex-shrink-0 overflow-hidden">
        ${student.avatar_url ? '<img src="' + student.avatar_url + '" class="w-full h-full object-cover">' : initials}
      </div>
      <div class="min-w-0">
        <p class="text-xs text-charcoal/60 mb-1">You are linking to:</p>
        <p class="font-bold text-primary">${student.full_name || 'Student'}</p>
        <p class="text-xs text-charcoal/60">${student.email || ''}</p>
        ${student.country ? `<p class="text-xs text-charcoal/50">📍 ${student.country}</p>` : ''}
      </div>
    </div>
  `;

  document.getElementById('step1').classList.add('hidden');
  document.getElementById('step2').classList.remove('hidden');
});

// Reset to step 1
window.resetSteps = () => {
  document.getElementById('step1').classList.remove('hidden');
  document.getElementById('step2').classList.add('hidden');
  document.getElementById('verifyBtn').disabled = false;
  document.getElementById('verifyBtn').textContent = 'Verify Code';
  verifiedLink = null;
  verifiedStudent = null;
};

// Step 2: Create parent account
document.getElementById('signupForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = document.getElementById('signupBtn');
  const status = document.getElementById('signupStatus');

  if (!verifiedLink || !verifiedStudent) {
    status.textContent = '❌ Please verify code again';
    status.className = 'text-sm text-center text-red-600';
    status.classList.remove('hidden');
    return;
  }

  btn.disabled = true;
  btn.textContent = 'Creating account...';
  status.classList.add('hidden');

  const email = document.getElementById('parentEmail').value.trim();
  const password = document.getElementById('parentPassword').value;
  const fullName = document.getElementById('parentName').value.trim();
  const phone = document.getElementById('parentPhone').value.trim();

  // Create auth user
  const { data, error } = await db.auth.signUp({
    email,
    password,
    options: { data: { full_name: fullName } }
  });

  if (error) {
    status.textContent = '❌ ' + error.message;
    status.className = 'text-sm text-center text-red-600';
    status.classList.remove('hidden');
    btn.disabled = false;
    btn.textContent = 'Create Parent Account';
    return;
  }

  if (!data.user) {
    status.textContent = '⚠️ Check email to confirm your account';
    status.className = 'text-sm text-center text-blue-600';
    status.classList.remove('hidden');
    btn.disabled = false;
    btn.textContent = 'Create Parent Account';
    return;
  }

  // Update profile to 'parent' role
  await db.from('profiles').update({
    phone,
    full_name: fullName,
    role: 'parent'
  }).eq('id', data.user.id);

  // Update parent_links to active
  await db.from('parent_links').update({
    parent_id: data.user.id,
    status: 'active',
    accepted_at: new Date().toISOString()
  }).eq('id', verifiedLink.id);

  // Notify student
  if (window.db && verifiedStudent) {
    await db.from('notifications').insert({
      user_id: verifiedStudent.id,
      title: 'Parent Account Linked 👨‍👩‍👧',
      message: fullName + ' has been linked to your account.',
      type: 'success',
      link: '/student/parent-access.html'
    }).catch(() => {});
  }

  status.textContent = '✓ Account created! Redirecting to dashboard...';
  status.className = 'text-sm text-center text-green-600';
  status.classList.remove('hidden');
  btn.textContent = '✓ Success!';

  setTimeout(() => {
    window.location.href = 'parent/dashboard.html';
  }, 1500);
});
</script>

<script src="assets/js/site-loader.js"></script>

</body>
</html>
