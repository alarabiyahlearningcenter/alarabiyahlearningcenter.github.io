<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Certificates | Parent Portal</title>
<meta name="theme-color" content="#0A3622">
<link rel="manifest" href="../manifest.json">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body{font-family:'Inter',sans-serif;background:#F9F7F2}
h1,h2,h3,h4{font-family:'Playfair Display',serif}
.btn-primary{background:#0A3622;color:white;transition:.2s}
.btn-primary:hover{background:#062218}
.sidebar-link{transition:all .2s}
.sidebar-link:hover,.sidebar-link.active{background:rgba(212,175,55,0.15);color:#0A3622;border-left:3px solid #D4AF37}
.cert-card{background:linear-gradient(135deg,#0A3622,#062218);border:3px solid #D4AF37;border-radius:20px;padding:24px;color:white;position:relative;overflow:hidden}
input:focus,select:focus{outline:none;border-color:#0A3622;box-shadow:0 0 0 3px rgba(10,54,34,.1)}
</style>
</head>
<body class="bg-cream text-charcoal min-h-screen">

<header class="sticky top-0 z-40 bg-white border-b border-primary/10">
  <div class="px-4 py-3 flex items-center justify-between">
    <div class="flex items-center gap-3">
      <button id="sidebarToggle" class="lg:hidden p-2 text-primary">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/></svg>
      </button>
      <a href="../index.html" class="flex items-center gap-2">
        <img src="../assets/images/logo.png" alt="Al-Arabiyah" class="w-10 h-10 rounded-full border-2 border-secondary object-cover">
        <div class="hidden sm:block">
          <div class="font-heading font-bold text-primary text-sm leading-tight">Al-Arabiyah</div>
          <div class="text-xs text-primary/70">Parent Portal</div>
        </div>
      </a>
    </div>
    <div class="flex items-center gap-3">
      <a href="dashboard.html" class="text-sm text-primary font-medium hover:text-secondary">← Dashboard</a>
      <div id="notifBellContainer"></div>
    </div>
  </div>
</header>

<div class="flex">
  <aside id="sidebar" class="fixed lg:sticky top-0 lg:top-[60px] left-0 z-30 w-64 h-screen lg:h-[calc(100vh-60px)] bg-white border-r border-primary/10 transform -translate-x-full lg:translate-x-0 transition-transform overflow-y-auto">
    <div class="p-4">
      <div class="lg:hidden flex justify-end mb-2">
        <button id="sidebarClose" class="p-1 text-charcoal/50">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
        </button>
      </div>
      <nav class="space-y-1">
        <a href="dashboard.html" class="sidebar-link flex items-center gap-3 px-4 py-3 rounded-lg text-charcoal/70">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
          Dashboard
        </a>
        <a href="children.html" class="sidebar-link flex items-center gap-3 px-4 py-3 rounded-lg text-charcoal/70">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"/></svg>
          My Children
        </a>
        <a href="attendance.html" class="sidebar-link flex items-center gap-3 px-4 py-3 rounded-lg text-charcoal/70">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
          Attendance
        </a>
        <a href="payments.html" class="sidebar-link flex items-center gap-3 px-4 py-3 rounded-lg text-charcoal/70">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 10h18M7 15h1m4 0h1m-7 4h12a3 3 0 003-3V8a3 3 0 00-3-3H6a3 3 0 00-3 3v8a3 3 0 003 3z"/></svg>
          Payments
        </a>
        <a href="certificates.html" class="sidebar-link active flex items-center gap-3 px-4 py-3 rounded-lg text-primary font-medium">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4M7.835 4.697a3.42 3.42 0 001.946-.806 3.42 3.42 0 014.438 0 3.42 3.42 0 001.946.806 3.42 3.42 0 013.138 3.138 3.42 3.42 0 00.806 1.946 3.42 3.42 0 010 4.438 3.42 3.42 0 00-.806 1.946 3.42 3.42 0 01-3.138 3.138 3.42 3.42 0 00-1.946.806 3.42 3.42 0 01-4.438 0 3.42 3.42 0 00-1.946-.806 3.42 3.42 0 01-3.138-3.138 3.42 3.42 0 00-.806-1.946 3.42 3.42 0 010-4.438 3.42 3.42 0 00.806-1.946 3.42 3.42 0 013.138-3.138z"/></svg>
          Certificates
        </a>
        <a href="profile.html" class="sidebar-link flex items-center gap-3 px-4 py-3 rounded-lg text-charcoal/70">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
          My Profile
        </a>
      </nav>
    </div>
  </aside>

  <div id="sidebarOverlay" class="hidden lg:hidden fixed inset-0 bg-black/50 z-20"></div>

  <main class="flex-1 min-w-0 p-4 md:p-6 lg:p-8">
    <div class="mb-6">
      <h1 class="text-2xl md:text-3xl font-bold text-primary mb-1">Certificates</h1>
      <p class="text-charcoal/60 text-sm">Certificates earned by your children</p>
    </div>

    <div id="loading" class="text-center py-20">
      <div class="inline-block animate-spin rounded-full h-8 w-8 border-4 border-primary/20 border-t-primary"></div>
    </div>

    <div id="content" class="hidden">
      <div class="bg-white rounded-2xl p-4 border border-primary/5 mb-6">
        <label class="block text-xs font-semibold text-primary mb-1">Select Child</label>
        <select id="childFilter" class="w-full sm:max-w-xs px-3 py-2.5 border border-primary/20 rounded-xl bg-cream text-sm"></select>
      </div>

      <div id="certificatesList" class="space-y-6"></div>
    </div>

    <div id="emptyState" class="hidden bg-white rounded-2xl p-10 text-center border border-primary/5">
      <div class="w-20 h-20 bg-primary/10 rounded-full flex items-center justify-center mx-auto mb-4">
        <svg class="w-10 h-10 text-primary" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4M7.835 4.697a3.42 3.42 0 001.946-.806 3.42 3.42 0 014.438 0 3.42 3.42 0 001.946.806 3.42 3.42 0 013.138 3.138 3.42 3.42 0 00.806 1.946 3.42 3.42 0 010 4.438 3.42 3.42 0 00-.806 1.946 3.42 3.42 0 01-3.138 3.138 3.42 3.42 0 00-1.946.806 3.42 3.42 0 01-4.438 0 3.42 3.42 0 00-1.946-.806 3.42 3.42 0 01-3.138-3.138 3.42 3.42 0 00-.806-1.946 3.42 3.42 0 010-4.438 3.42 3.42 0 00.806-1.946 3.42 3.42 0 013.138-3.138z"/></svg>
      </div>
      <h3 class="text-xl font-bold text-primary mb-2">No Certificates Yet</h3>
      <p class="text-charcoal/60 text-sm">Your child hasn't earned any certificates yet.</p>
    </div>
  </main>
</div>

<script src="../assets/js/supabase-config.js"></script>
<script src="../assets/js/notifications.js"></script>
<script src="../assets/js/inject-bell.js"></script>
<script>
(async () => {
  let tries = 0;
  while (!window.db && tries < 50) { await new Promise(r => setTimeout(r, 100)); tries++; }
  if (!window.db) return;
  const db = window.db;

  document.getElementById('sidebarToggle').addEventListener('click', () => {
    document.getElementById('sidebar').classList.remove('-translate-x-full');
    document.getElementById('sidebarOverlay').classList.remove('hidden');
  });
  document.getElementById('sidebarClose').addEventListener('click', () => {
    document.getElementById('sidebar').classList.add('-translate-x-full');
    document.getElementById('sidebarOverlay').classList.add('hidden');
  });
  document.getElementById('sidebarOverlay').addEventListener('click', () => {
    document.getElementById('sidebar').classList.add('-translate-x-full');
    document.getElementById('sidebarOverlay').classList.add('hidden');
  });

  const { data: { session } } = await db.auth.getSession();
  if (!session) { window.location.href = '../auth/login.html'; return; }
  const user = session.user;

  let children = [];

  async function loadChildren() {
    const { data: links } = await db.from('parent_links').select('*').eq('parent_id', user.id).eq('status', 'active');
    const studentIds = (links || []).map(l => l.student_id).filter(Boolean);
    if (!studentIds.length) {
      document.getElementById('loading').classList.add('hidden');
      document.getElementById('emptyState').classList.remove('hidden');
      return;
    }
    const { data: students } = await db.from('profiles').select('id, full_name, email').in('id', studentIds);
    children = students || [];
    document.getElementById('childFilter').innerHTML = children.map(c => `<option value="${c.id}">${c.full_name || c.email || 'Student'}</option>`).join('');
    if (children.length) loadCerts(children[0].id);
  }

  async function loadCerts(childId) {
    document.getElementById('loading').classList.remove('hidden');
    document.getElementById('content').classList.add('hidden');
    document.getElementById('emptyState').classList.add('hidden');

    const { data: certs } = await db.from('certificates').select('*').eq('student_id', childId).order('issued_at', { ascending: false });
    const certificates = certs || [];

    document.getElementById('loading').classList.add('hidden');

    if (!certificates.length) {
      document.getElementById('emptyState').classList.remove('hidden');
      return;
    }

    const box = document.getElementById('certificatesList');
    box.innerHTML = certificates.map(cert => {
      const date = new Date(cert.issued_at).toLocaleDateString('en-GB', { day: '2-digit', month: 'long', year: 'numeric' });
      return `
        <div class="cert-card relative">
          <div class="absolute inset-0 opacity-5">
            <div class="absolute top-0 left-0 w-64 h-64 bg-secondary rounded-full blur-3xl"></div>
            <div class="absolute bottom-0 right-0 w-64 h-64 bg-secondary rounded-full blur-3xl"></div>
          </div>
          <div class="relative">
            <div class="flex justify-between items-start mb-6 flex-wrap gap-3">
              <div class="flex items-center gap-3">
                <img src="../assets/images/logo.png" class="w-14 h-14 rounded-full border-2 border-secondary">
                <div>
                  <p class="text-secondary text-xs tracking-wider">AL-ARABIYAH LEARNING CENTER</p>
                  <p class="text-white/60 text-xs">Certificate of Completion</p>
                </div>
              </div>
              <span class="text-xs bg-secondary text-primary px-3 py-1 rounded-full font-bold">✓ VERIFIED</span>
            </div>
            <div class="text-center mb-6">
              <p class="text-white/70 text-xs mb-2">This is to certify that</p>
              <p class="text-2xl md:text-3xl font-bold text-secondary mb-3" style="font-family:'Playfair Display',serif;">${cert.student_name}</p>
              <p class="text-white/70 text-xs mb-2">has successfully completed the course</p>
              <p class="text-lg md:text-xl font-semibold text-white">${cert.course_name}</p>
            </div>
            <div class="flex justify-between text-xs text-white/60 pt-5 border-t border-white/20 flex-wrap gap-3">
              <div>
                <p>Certificate ID</p>
                <p class="text-secondary font-semibold font-mono">${cert.certificate_id}</p>
              </div>
              <div class="text-center">
                <div class="w-10 h-10 bg-secondary rounded-full flex items-center justify-center mx-auto mb-1">
                  <svg class="w-5 h-5 text-primary" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                </div>
                <p>Verified</p>
              </div>
              <div class="text-right">
                <p>Issued Date</p>
                <p class="text-secondary font-semibold">${date}</p>
              </div>
            </div>
            <div class="flex gap-2 mt-5 pt-5 border-t border-white/20">
              <a href="../certificate-verification.html?id=${cert.certificate_id}" target="_blank" class="bg-secondary text-primary px-5 py-2 rounded-full font-semibold text-xs">Verify Online</a>
              <button onclick="window.print()" class="border-2 border-white text-white px-5 py-2 rounded-full font-semibold text-xs">Download / Print</button>
            </div>
          </div>
        </div>
      `;
    }).join('');

    document.getElementById('content').classList.remove('hidden');
  }

  document.getElementById('childFilter').addEventListener('change', (e) => loadCerts(e.target.value));

  await loadChildren();
})();
</script>

</body>
</html>
