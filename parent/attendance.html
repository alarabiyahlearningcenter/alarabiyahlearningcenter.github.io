<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Attendance | Parent Portal</title>
<meta name="theme-color" content="#0A3622">
<link rel="manifest" href="../manifest.json">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body{font-family:'Inter',sans-serif;background:#F9F7F2}
h1,h2,h3,h4{font-family:'Playfair Display',serif}
.btn-primary{background:#0A3622;color:white;transition:.2s}
.btn-primary:hover{background:#062218}
.sidebar-link{transition:all .2s}
.sidebar-link:hover,.sidebar-link.active{background:rgba(212,175,55,0.15);color:#0A3622;border-left:3px solid #D4AF37}
.stat-card{background:white;border-radius:16px;padding:20px;border:1px solid rgba(10,54,34,.05)}
.att-row{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;background:white;border-radius:12px;border:1px solid rgba(10,54,34,.05);margin-bottom:8px}
input:focus,select:focus{outline:none;border-color:#0A3622;box-shadow:0 0 0 3px rgba(10,54,34,.1)}
@media print{.no-print{display:none!important}body{background:white!important}}
</style>
</head>
<body class="bg-cream text-charcoal min-h-screen">

<header class="sticky top-0 z-40 bg-white border-b border-primary/10 no-print">
  <div class="px-4 py-3 flex items-center justify-between">
    <div class="flex items-center gap-3">
      <button id="sidebarToggle" class="lg:hidden p-2 text-primary">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/></svg>
      </button>
      <a href="../index.html" class="flex items-center gap-2">
        <img src="../assets/images/logo.png" alt="Al-Arabiyah" class="w-10 h-10 rounded-full border-2 border-secondary object-cover">
        <div class="hidden sm:block">
          <div class="font-heading font-bold text-primary text-sm leading-tight">Al-Arabiyah</div>
          <div class="text-xs text-primary/70">Parent Portal</div>
        </div>
      </a>
    </div>
    <div class="flex items-center gap-3">
      <a href="dashboard.html" class="text-sm text-primary font-medium hover:text-secondary">← Dashboard</a>
      <div id="notifBellContainer"></div>
    </div>
  </div>
</header>

<div class="flex">
  <aside id="sidebar" class="fixed lg:sticky top-0 lg:top-[60px] left-0 z-30 w-64 h-screen lg:h-[calc(100vh-60px)] bg-white border-r border-primary/10 transform -translate-x-full lg:translate-x-0 transition-transform overflow-y-auto no-print">
    <div class="p-4">
      <div class="lg:hidden flex justify-end mb-2">
        <button id="sidebarClose" class="p-1 text-charcoal/50">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
        </button>
      </div>
      <nav class="space-y-1">
        <a href="dashboard.html" class="sidebar-link flex items-center gap-3 px-4 py-3 rounded-lg text-charcoal/70">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
          Dashboard
        </a>
        <a href="children.html" class="sidebar-link flex items-center gap-3 px-4 py-3 rounded-lg text-charcoal/70">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"/></svg>
          My Children
        </a>
        <a href="attendance.html" class="sidebar-link active flex items-center gap-3 px-4 py-3 rounded-lg text-primary font-medium">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
          Attendance
        </a>
        <a href="payments.html" class="sidebar-link flex items-center gap-3 px-4 py-3 rounded-lg text-charcoal/70">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 10h18M7 15h1m4 0h1m-7 4h12a3 3 0 003-3V8a3 3 0 00-3-3H6a3 3 0 00-3 3v8a3 3 0 003 3z"/></svg>
          Payments
        </a>
        <a href="certificates.html" class="sidebar-link flex items-center gap-3 px-4 py-3 rounded-lg text-charcoal/70">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4M7.835 4.697a3.42 3.42 0 001.946-.806 3.42 3.42 0 014.438 0 3.42 3.42 0 001.946.806 3.42 3.42 0 013.138 3.138 3.42 3.42 0 00.806 1.946 3.42 3.42 0 010 4.438 3.42 3.42 0 00-.806 1.946 3.42 3.42 0 01-3.138 3.138 3.42 3.42 0 00-1.946.806 3.42 3.42 0 01-4.438 0 3.42 3.42 0 00-1.946-.806 3.42 3.42 0 01-3.138-3.138 3.42 3.42 0 00-.806-1.946 3.42 3.42 0 010-4.438 3.42 3.42 0 00.806-1.946 3.42 3.42 0 013.138-3.138z"/></svg>
          Certificates
        </a>
        <a href="notification-preferences.html" class="sidebar-link flex items-center gap-3 px-4 py-3 rounded-lg text-charcoal/70">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"/></svg>
          Notifications
        </a>
        
      </nav>
    </div>
  </aside>

  <div id="sidebarOverlay" class="hidden lg:hidden fixed inset-0 bg-black/50 z-20 no-print"></div>

  <main class="flex-1 min-w-0 p-4 md:p-6 lg:p-8">
    <div class="mb-6 no-print flex flex-col sm:flex-row sm:items-center justify-between gap-3">
      <div>
        <h1 class="text-2xl md:text-3xl font-bold text-primary mb-1">Attendance Report</h1>
        <p class="text-charcoal/60 text-sm">Track your child's class attendance</p>
      </div>
      <button onclick="window.print()" class="bg-primary text-white px-5 py-2.5 rounded-full font-semibold text-sm inline-flex items-center gap-2 justify-center">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 002-2v-4a2 2 0 00-2-2H9a2 2 0 00-2 2v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 00-2 2v4h10z"/></svg>
        Print
      </button>
    </div>

    <div id="loading" class="text-center py-20">
      <div class="inline-block animate-spin rounded-full h-8 w-8 border-4 border-primary/20 border-t-primary"></div>
    </div>

    <div id="content" class="hidden">
      <!-- Child Filter -->
      <div class="bg-white rounded-2xl p-4 border border-primary/5 mb-6 no-print">
        <div class="grid sm:grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-semibold text-primary mb-1">Select Child</label>
            <select id="childFilter" class="w-full px-3 py-2.5 border border-primary/20 rounded-xl bg-cream text-sm">
              <option value="">Loading...</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-semibold text-primary mb-1">Filter by Status</label>
            <select id="statusFilter" class="w-full px-3 py-2.5 border border-primary/20 rounded-xl bg-cream text-sm">
              <option value="">All Status</option>
              <option value="present">Present</option>
              <option value="absent">Absent</option>
              <option value="late">Late</option>
            </select>
          </div>
        </div>
      </div>

      <!-- Summary -->
      <div class="grid grid-cols-2 lg:grid-cols-4 gap-4 mb-6">
        <div class="stat-card">
          <p class="text-xs text-charcoal/60 mb-1">Total</p>
          <p id="statTotal" class="text-3xl font-bold text-primary">0</p>
        </div>
        <div class="stat-card">
          <p class="text-xs text-charcoal/60 mb-1">Present</p>
          <p id="statPresent" class="text-3xl font-bold text-green-600">0</p>
        </div>
        <div class="stat-card">
          <p class="text-xs text-charcoal/60 mb-1">Absent</p>
          <p id="statAbsent" class="text-3xl font-bold text-red-600">0</p>
        </div>
        <div class="stat-card">
          <p class="text-xs text-charcoal/60 mb-1">Attendance %</p>
          <p id="statPercent" class="text-3xl font-bold text-secondary">0%</p>
        </div>
      </div>

      <!-- Progress Bar -->
      <div class="bg-white rounded-2xl p-5 border border-primary/5 mb-6">
        <div class="flex items-center justify-between mb-3">
          <p class="text-sm font-semibold text-primary">Attendance Rate</p>
          <p id="progressLabel" class="text-sm font-bold text-primary">0%</p>
        </div>
        <div class="w-full bg-cream rounded-full h-3">
          <div id="progressBar" class="bg-secondary h-3 rounded-full transition-all" style="width: 0%"></div>
        </div>
      </div>

      <!-- Detailed List -->
      <div class="bg-white rounded-2xl p-6 border border-primary/5">
        <h3 class="font-bold text-primary mb-4">Attendance History</h3>
        <div id="attendanceList"></div>
      </div>
    </div>

    <div id="emptyState" class="hidden bg-white rounded-2xl p-10 text-center border border-primary/5">
      <h3 class="text-xl font-bold text-primary mb-2">No Data</h3>
      <p class="text-charcoal/60 text-sm">No attendance records found.</p>
    </div>
  </main>
</div>

<script src="../assets/js/supabase-config.js"></script>
<script src="../assets/js/notifications.js"></script>
<script src="../assets/js/inject-bell.js"></script>
<script>
(async () => {
  let tries = 0;
  while (!window.db && tries < 50) { await new Promise(r => setTimeout(r, 100)); tries++; }
  if (!window.db) return;
  const db = window.db;

  document.getElementById('sidebarToggle').addEventListener('click', () => {
    document.getElementById('sidebar').classList.remove('-translate-x-full');
    document.getElementById('sidebarOverlay').classList.remove('hidden');
  });
  document.getElementById('sidebarClose').addEventListener('click', () => {
    document.getElementById('sidebar').classList.add('-translate-x-full');
    document.getElementById('sidebarOverlay').classList.add('hidden');
  });
  document.getElementById('sidebarOverlay').addEventListener('click', () => {
    document.getElementById('sidebar').classList.add('-translate-x-full');
    document.getElementById('sidebarOverlay').classList.add('hidden');
  });

  const { data: { session } } = await db.auth.getSession();
  if (!session) { window.location.href = '../auth/login.html'; return; }
  const user = session.user;

  let children = [];
  let allAttendance = [];
  let classMap = {};
  let teacherMap = {};

  async function loadChildren() {
    const { data: links } = await db.from('parent_links').select('*').eq('parent_id', user.id).eq('status', 'active');
    const studentIds = (links || []).map(l => l.student_id).filter(Boolean);
    if (!studentIds.length) {
      document.getElementById('loading').classList.add('hidden');
      document.getElementById('emptyState').classList.remove('hidden');
      return;
    }
    const { data: students } = await db.from('profiles').select('id, full_name, email').in('id', studentIds);
    children = students || [];

    const sel = document.getElementById('childFilter');
    sel.innerHTML = children.map(c => `<option value="${c.id}">${c.full_name || c.email || 'Student'}</option>`).join('');

    // Auto-load first child
    if (children.length) loadAttendance(children[0].id);
  }

  async function loadAttendance(childId) {
    document.getElementById('loading').classList.remove('hidden');
    document.getElementById('content').classList.add('hidden');
    document.getElementById('emptyState').classList.add('hidden');

    const { data: att } = await db.from('attendance').select('*').eq('student_id', childId).order('marked_at', { ascending: false });
    allAttendance = att || [];

    // Load classes
    const classIds = [...new Set(allAttendance.map(a => a.class_id).filter(Boolean))];
    classMap = {};
    teacherMap = {};
    if (classIds.length) {
      const { data: classes } = await db.from('classes').select('id, title, scheduled_at, duration_min, teacher_id, is_external, external_method').in('id', classIds);
      (classes || []).forEach(c => classMap[c.id] = c);

      const teacherIds = [...new Set((classes || []).map(c => c.teacher_id).filter(Boolean))];
      if (teacherIds.length) {
        const { data: teachers } = await db.from('teachers').select('id, name').in('id', teacherIds);
        (teachers || []).forEach(t => teacherMap[t.id] = t.name);
      }
    }

    document.getElementById('loading').classList.add('hidden');

    if (!allAttendance.length) {
      document.getElementById('emptyState').classList.remove('hidden');
      return;
    }

    applyFilters();
    document.getElementById('content').classList.remove('hidden');
  }

  function applyFilters() {
    const statusF = document.getElementById('statusFilter').value;
    let filtered = allAttendance;
    if (statusF) filtered = filtered.filter(a => a.status === statusF);
    renderList(filtered);
    updateStats(allAttendance);
  }

  function updateStats(list) {
    const total = list.length;
    const present = list.filter(a => a.status === 'present').length;
    const absent = list.filter(a => a.status === 'absent').length;
    const late = list.filter(a => a.status === 'late').length;
    const pct = total > 0 ? Math.round(((present + late) / total) * 100) : 0;

    document.getElementById('statTotal').textContent = total;
    document.getElementById('statPresent').textContent = present;
    document.getElementById('statAbsent').textContent = absent;
    document.getElementById('statPercent').textContent = pct + '%';
    document.getElementById('progressBar').style.width = pct + '%';
    document.getElementById('progressLabel').textContent = pct + '%';
  }

  function renderList(list) {
    const box = document.getElementById('attendanceList');
    if (!list.length) {
      box.innerHTML = '<p class="text-charcoal/60 text-sm text-center py-6">No records match filter</p>';
      return;
    }
    box.innerHTML = list.slice(0, 100).map(a => {
      const cls = classMap[a.class_id] || {};
      const teacherName = teacherMap[cls.teacher_id] || '';
      const d = new Date(a.marked_at);
      const dateStr = d.toLocaleDateString('en-GB', { weekday: 'short', day: '2-digit', month: 'short', year: 'numeric' });
      const timeStr = d.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' });

      let badge = '';
      if (a.status === 'present') badge = '<span class="text-xs bg-green-100 text-green-700 px-3 py-1 rounded-full font-semibold">✓ Present</span>';
      else if (a.status === 'absent') badge = '<span class="text-xs bg-red-100 text-red-700 px-3 py-1 rounded-full font-semibold">✕ Absent</span>';
      else if (a.status === 'late') badge = '<span class="text-xs bg-yellow-100 text-yellow-700 px-3 py-1 rounded-full font-semibold">⏱ Late</span>';
      else badge = '<span class="text-xs bg-gray-100 text-gray-700 px-3 py-1 rounded-full font-semibold">Cancelled</span>';

      const method = cls.is_external ? ` • <span class="text-secondary font-semibold">${(cls.external_method || 'External').toUpperCase()}</span>` : '';

      return `
        <div class="att-row">
          <div class="flex items-center gap-3 min-w-0">
            <div class="w-10 h-10 rounded-xl bg-primary/10 flex items-center justify-center flex-shrink-0">
              <span class="text-xs font-bold text-primary">${d.getDate()}</span>
            </div>
            <div class="min-w-0">
              <p class="font-semibold text-primary text-sm truncate">${cls.title || 'Class'}${method}</p>
              <p class="text-xs text-charcoal/60 truncate">${dateStr} • ${timeStr}${teacherName ? ' • ' + teacherName : ''}</p>
              ${a.notes ? `<p class="text-xs text-charcoal/50 italic truncate">📝 ${a.notes}</p>` : ''}
            </div>
          </div>
          ${badge}
        </div>
      `;
    }).join('');
  }

  document.getElementById('childFilter').addEventListener('change', (e) => loadAttendance(e.target.value));
  document.getElementById('statusFilter').addEventListener('change', applyFilters);

  await loadChildren();
})();
</script>

</body>
</html>
