<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Children | Parent Portal</title>
<meta name="theme-color" content="#0A3622">
<link rel="manifest" href="../manifest.json">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body{font-family:'Inter',sans-serif;background:#F9F7F2}
h1,h2,h3,h4{font-family:'Playfair Display',serif}
.btn-primary{background:#0A3622;color:white;transition:.2s}
.btn-primary:hover{background:#062218}
.sidebar-link{transition:all .2s}
.sidebar-link:hover,.sidebar-link.active{background:rgba(212,175,55,0.15);color:#0A3622;border-left:3px solid #D4AF37}
.child-card{background:white;border-radius:20px;padding:20px;border:1px solid rgba(10,54,34,.05);margin-bottom:20px;transition:.3s}
.child-card:hover{box-shadow:0 12px 24px rgba(10,54,34,.1)}
.stat-mini{background:#F9F7F2;border-radius:12px;padding:14px;border:1px solid rgba(10,54,34,.05);text-align:center}
.course-pill{background:rgba(10,54,34,.08);color:#0A3622;padding:4px 12px;border-radius:999px;font-size:12px;font-weight:600;display:inline-block;margin:3px}
</style>
</head>
<body class="bg-cream text-charcoal min-h-screen">

<header class="sticky top-0 z-40 bg-white border-b border-primary/10">
  <div class="px-4 py-3 flex items-center justify-between">
    <div class="flex items-center gap-3">
      <button id="sidebarToggle" class="lg:hidden p-2 text-primary">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/></svg>
      </button>
      <a href="../index.html" class="flex items-center gap-2">
        <img src="../assets/images/logo.png" alt="Al-Arabiyah" class="w-10 h-10 rounded-full border-2 border-secondary object-cover">
        <div class="hidden sm:block">
          <div class="font-heading font-bold text-primary text-sm leading-tight">Al-Arabiyah</div>
          <div class="text-xs text-primary/70">Parent Portal</div>
        </div>
      </a>
    </div>
    <div class="flex items-center gap-3">
      <a href="dashboard.html" class="text-sm text-primary font-medium hover:text-secondary">← Dashboard</a>
      <div id="notifBellContainer"></div>
    </div>
  </div>
</header>

<div class="flex">
  <aside id="sidebar" class="fixed lg:sticky top-0 lg:top-[60px] left-0 z-30 w-64 h-screen lg:h-[calc(100vh-60px)] bg-white border-r border-primary/10 transform -translate-x-full lg:translate-x-0 transition-transform overflow-y-auto">
    <div class="p-4">
      <div class="lg:hidden flex justify-end mb-2">
        <button id="sidebarClose" class="p-1 text-charcoal/50">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
        </button>
      </div>
      <nav class="space-y-1">
        <a href="dashboard.html" class="sidebar-link flex items-center gap-3 px-4 py-3 rounded-lg text-charcoal/70">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
          Dashboard
        </a>
        <a href="children.html" class="sidebar-link active flex items-center gap-3 px-4 py-3 rounded-lg text-primary font-medium">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"/></svg>
          My Children
        </a>
        <a href="attendance.html" class="sidebar-link flex items-center gap-3 px-4 py-3 rounded-lg text-charcoal/70">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
          Attendance
        </a>
        <a href="payments.html" class="sidebar-link flex items-center gap-3 px-4 py-3 rounded-lg text-charcoal/70">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 10h18M7 15h1m4 0h1m-7 4h12a3 3 0 003-3V8a3 3 0 00-3-3H6a3 3 0 00-3 3v8a3 3 0 003 3z"/></svg>
          Payments
        </a>
        <a href="certificates.html" class="sidebar-link flex items-center gap-3 px-4 py-3 rounded-lg text-charcoal/70">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4M7.835 4.697a3.42 3.42 0 001.946-.806 3.42 3.42 0 014.438 0 3.42 3.42 0 001.946.806 3.42 3.42 0 013.138 3.138 3.42 3.42 0 00.806 1.946 3.42 3.42 0 010 4.438 3.42 3.42 0 00-.806 1.946 3.42 3.42 0 01-3.138 3.138 3.42 3.42 0 00-1.946.806 3.42 3.42 0 01-4.438 0 3.42 3.42 0 00-1.946-.806 3.42 3.42 0 01-3.138-3.138 3.42 3.42 0 00-.806-1.946 3.42 3.42 0 010-4.438 3.42 3.42 0 00.806-1.946 3.42 3.42 0 013.138-3.138z"/></svg>
          Certificates
        </a>
        <a href="profile.html" class="sidebar-link flex items-center gap-3 px-4 py-3 rounded-lg text-charcoal/70">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
          My Profile
        </a>
        <a href="notification-preferences.html" class="sidebar-link flex items-center gap-3 px-4 py-3 rounded-lg text-charcoal/70">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"/></svg>
          Notifications
        </a>
      </nav>
    </div>
  </aside>

  <div id="sidebarOverlay" class="hidden lg:hidden fixed inset-0 bg-black/50 z-20"></div>

  <main class="flex-1 min-w-0 p-4 md:p-6 lg:p-8">
    <div class="mb-6">
      <h1 class="text-2xl md:text-3xl font-bold text-primary mb-1">My Children</h1>
      <p class="text-charcoal/60 text-sm">Detailed overview of each child's learning</p>
    </div>

    <div id="loading" class="text-center py-20">
      <div class="inline-block animate-spin rounded-full h-8 w-8 border-4 border-primary/20 border-t-primary"></div>
    </div>

    <div id="childrenGrid" class="grid lg:grid-cols-2 gap-6"></div>

    <div id="emptyState" class="hidden bg-white rounded-2xl p-10 text-center border border-primary/5">
      <h3 class="text-xl font-bold text-primary mb-2">No Children Linked</h3>
      <p class="text-charcoal/60 text-sm">Your child needs to generate an invite code from their dashboard.</p>
    </div>
  </main>
</div>

<script src="../assets/js/supabase-config.js"></script>
<script src="../assets/js/notifications.js"></script>
<script src="../assets/js/inject-bell.js"></script>
<script>
(async () => {
  let tries = 0;
  while (!window.db && tries < 50) { await new Promise(r => setTimeout(r, 100)); tries++; }
  if (!window.db) return;
  const db = window.db;

  document.getElementById('sidebarToggle').addEventListener('click', () => {
    document.getElementById('sidebar').classList.remove('-translate-x-full');
    document.getElementById('sidebarOverlay').classList.remove('hidden');
  });
  document.getElementById('sidebarClose').addEventListener('click', () => {
    document.getElementById('sidebar').classList.add('-translate-x-full');
    document.getElementById('sidebarOverlay').classList.add('hidden');
  });
  document.getElementById('sidebarOverlay').addEventListener('click', () => {
    document.getElementById('sidebar').classList.add('-translate-x-full');
    document.getElementById('sidebarOverlay').classList.add('hidden');
  });

  const { data: { session } } = await db.auth.getSession();
  if (!session) { window.location.href = '../auth/login.html'; return; }
  const user = session.user;

  async function loadChildren() {
    document.getElementById('loading').classList.remove('hidden');

    const { data: links } = await db.from('parent_links').select('*').eq('parent_id', user.id).eq('status', 'active');
    const studentIds = (links || []).map(l => l.student_id).filter(Boolean);

    document.getElementById('loading').classList.add('hidden');

    if (!studentIds.length) {
      document.getElementById('emptyState').classList.remove('hidden');
      return;
    }

    const { data: children } = await db.from('profiles').select('id, full_name, email, avatar_url, country, age, created_at').in('id', studentIds);

    if (!children || !children.length) {
      document.getElementById('emptyState').classList.remove('hidden');
      return;
    }

    // Load details for each child
    const grid = document.getElementById('childrenGrid');
    const childCards = [];

    for (const child of children) {
      const card = await buildChildCard(child);
      childCards.push(card);
    }

    grid.innerHTML = childCards.join('');
  }

  async function buildChildCard(child) {
    const name = child.full_name || child.email?.split('@')[0] || 'Student';
    const initials = name.charAt(0).toUpperCase();
    const link = await db.from('parent_links').select('relationship').eq('parent_id', user.id).eq('student_id', child.id).maybeSingle();
    const relationship = link?.data?.relationship || 'child';

    // Stats in parallel
    const [classesRes, attRes, enrollRes, progRes] = await Promise.all([
      db.from('classes').select('*').eq('student_id', child.id),
      db.from('attendance').select('*').eq('student_id', child.id),
      db.from('enrollments').select('course_id').eq('student_id', child.id).eq('status', 'active'),
      db.from('progress').select('id').eq('student_id', child.id).eq('is_completed', true)
    ]);

    const classes = classesRes.data || [];
    const attendance = attRes.data || [];
    const enrollments = enrollRes.data || [];
    const progress = progRes.data || [];

    const now = new Date();
    const completedClasses = classes.filter(c => c.status === 'completed' || new Date(c.scheduled_at) < now).length;
    const presentCount = attendance.filter(a => a.status === 'present' || a.status === 'late').length;
    const attPct = attendance.length > 0 ? Math.round((presentCount / attendance.length) * 100) : 0;
    const attColor = attPct >= 75 ? 'text-green-600' : attPct >= 50 ? 'text-yellow-600' : 'text-red-600';

    // Courses
    const courseIds = enrollments.map(e => e.course_id).filter(Boolean);
    let coursePills = '<p class="text-xs text-charcoal/50">No active courses</p>';
    if (courseIds.length) {
      const { data: courses } = await db.from('courses').select('id, title').in('id', courseIds);
      coursePills = (courses || []).map(c => `<span class="course-pill">${c.title}</span>`).join('');
    }

    // Progress %
    let totalLessons = 0;
    if (courseIds.length) {
      const { data: mods } = await db.from('modules').select('id, lessons(id)').in('course_id', courseIds);
      (mods || []).forEach(m => { totalLessons += (m.lessons || []).length; });
    }
    const progressPct = totalLessons > 0 ? Math.round((progress.length / totalLessons) * 100) : 0;

    // Recent 3 classes
    const recent = classes
      .filter(c => new Date(c.scheduled_at) < now || c.status === 'completed')
      .sort((a, b) => new Date(b.scheduled_at) - new Date(a.scheduled_at))
      .slice(0, 3);

    let recentHtml = '<p class="text-xs text-charcoal/50 text-center py-3">No recent classes</p>';
    if (recent.length) {
      recentHtml = recent.map(c => {
        const d = new Date(c.scheduled_at);
        const dateStr = d.toLocaleDateString('en-GB', { day: '2-digit', month: 'short' });
        const timeStr = d.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' });
        const attRec = attendance.find(a => a.class_id === c.id);
        const badge = attRec 
          ? (attRec.status === 'present' ? 'bg-green-100 text-green-700' : attRec.status === 'absent' ? 'bg-red-100 text-red-700' : 'bg-yellow-100 text-yellow-700')
          : 'bg-gray-100 text-gray-600';
        const label = attRec ? attRec.status : 'completed';
        return `
          <div class="flex items-center justify-between py-2 border-b border-primary/5 last:border-0">
            <div class="min-w-0 flex-1">
              <p class="text-xs font-semibold text-primary truncate">${c.title || 'Class'}</p>
              <p class="text-xs text-charcoal/50">${dateStr} • ${timeStr}</p>
            </div>
            <span class="text-xs px-2 py-0.5 rounded-full ${badge} font-semibold ml-2">${label}</span>
          </div>
        `;
      }).join('');
    }

    return `
      <div class="child-card">
        <!-- Header -->
        <div class="flex items-start gap-4 mb-5">
          <div class="w-16 h-16 rounded-full bg-primary flex items-center justify-center text-secondary font-bold text-2xl flex-shrink-0 overflow-hidden">
            ${child.avatar_url ? `<img src="${child.avatar_url}" class="w-full h-full object-cover">` : initials}
          </div>
          <div class="flex-1 min-w-0">
            <div class="flex items-center gap-2 mb-1">
              <p class="font-bold text-primary text-lg truncate">${name}</p>
              <span class="text-xs bg-secondary/20 text-primary px-2 py-0.5 rounded-full font-semibold">${relationship.charAt(0).toUpperCase() + relationship.slice(1)}</span>
            </div>
            <p class="text-xs text-charcoal/60 truncate">${child.email || ''}</p>
            <div class="flex gap-3 mt-1 text-xs text-charcoal/50">
              ${child.age ? `<span>🎂 Age: ${child.age}</span>` : ''}
              ${child.country ? `<span>📍 ${child.country}</span>` : ''}
            </div>
          </div>
        </div>

        <!-- Stats -->
        <div class="grid grid-cols-4 gap-2 mb-4">
          <div class="stat-mini">
            <p class="text-xs text-charcoal/60 mb-1">Classes</p>
            <p class="text-lg font-bold text-primary">${completedClasses}</p>
          </div>
          <div class="stat-mini">
            <p class="text-xs text-charcoal/60 mb-1">Attendance</p>
            <p class="text-lg font-bold ${attColor}">${attPct}%</p>
          </div>
          <div class="stat-mini">
            <p class="text-xs text-charcoal/60 mb-1">Courses</p>
            <p class="text-lg font-bold text-primary">${courseIds.length}</p>
          </div>
          <div class="stat-mini">
            <p class="text-xs text-charcoal/60 mb-1">Progress</p>
            <p class="text-lg font-bold text-secondary">${progressPct}%</p>
          </div>
        </div>

        <!-- Enrolled Courses -->
        <div class="mb-4">
          <p class="text-xs font-semibold text-primary mb-2">Enrolled Courses</p>
          <div>${coursePills}</div>
        </div>

        <!-- Recent Classes -->
        <div>
          <p class="text-xs font-semibold text-primary mb-2">Recent Classes</p>
          <div>${recentHtml}</div>
        </div>

        <!-- Actions -->
        <div class="mt-4 pt-4 border-t border-primary/10 flex gap-2 flex-wrap">
          <a href="attendance.html" class="text-xs bg-primary/10 text-primary px-4 py-2 rounded-full font-semibold">View Attendance</a>
          <a href="payments.html" class="text-xs bg-primary/10 text-primary px-4 py-2 rounded-full font-semibold">View Payments</a>
          <a href="certificates.html" class="text-xs bg-secondary/20 text-primary px-4 py-2 rounded-full font-semibold">Certificates</a>
        </div>
      </div>
    `;
  }

  await loadChildren();
})();
</script>

</body>
</html>
