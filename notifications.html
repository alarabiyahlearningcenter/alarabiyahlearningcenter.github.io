<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Notifications | Al-Arabiyah Learning Center</title>
<meta name="theme-color" content="#0A3622">
<link rel="manifest" href="manifest.json">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body{font-family:'Inter',sans-serif;background:#F9F7F2}
h1,h2,h3,h4{font-family:'Playfair Display',serif}
.btn-primary{background:#0A3622;color:white;transition:.2s}
.btn-primary:hover{background:#062218}
.card-hover{transition:.3s}
.card-hover:hover{box-shadow:0 8px 16px rgba(10,54,34,.1)}
.notif-unread{background:rgba(212,175,55,.08);border-left:3px solid #D4AF37}
</style>
</head>
<body class="bg-cream text-charcoal min-h-screen">

<header class="sticky top-0 z-40 bg-white border-b border-primary/10">
  <div class="max-w-4xl mx-auto px-4 py-3 flex items-center justify-between">
    <div class="flex items-center gap-3">
      <a href="javascript:history.back()" class="p-2 rounded-full hover:bg-primary/5">
        <svg class="w-5 h-5 text-primary" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"/></svg>
      </a>
      <a href="index.html" class="flex items-center gap-2">
        <img src="assets/images/logo.png" alt="Al-Arabiyah" class="w-10 h-10 rounded-full border-2 border-secondary object-cover">
        <div class="hidden sm:block">
          <div class="font-heading font-bold text-primary text-sm leading-tight">Al-Arabiyah</div>
          <div class="text-xs text-primary/70">Notifications</div>
        </div>
      </a>
    </div>
    <button id="markAllBtn" class="text-xs text-secondary font-semibold hover:underline">Mark all read</button>
  </div>
</header>

<main class="max-w-4xl mx-auto px-4 py-6">
  <div class="mb-6 flex items-center justify-between">
    <div>
      <h1 class="text-2xl md:text-3xl font-bold text-primary mb-1">Notifications</h1>
      <p class="text-charcoal/60 text-sm"><span id="unreadCount">0</span> unread</p>
    </div>
    <div class="flex gap-2">
      <select id="filterFilter" class="px-4 py-2 border border-primary/20 rounded-full bg-white text-sm">
        <option value="">All</option>
        <option value="unread">Unread</option>
        <option value="read">Read</option>
      </select>
    </div>
  </div>

  <div id="loading" class="text-center py-20">
    <div class="inline-block animate-spin rounded-full h-8 w-8 border-4 border-primary/20 border-t-primary"></div>
  </div>

  <div id="notifList" class="space-y-2"></div>
</main>

<div id="emptyState" class="hidden max-w-4xl mx-auto px-4 py-20 text-center">
  <div class="w-20 h-20 bg-primary/10 rounded-full flex items-center justify-center mx-auto mb-4">
    <svg class="w-10 h-10 text-primary" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"/></svg>
  </div>
  <h3 class="text-xl font-bold text-primary mb-2">No Notifications</h3>
  <p class="text-charcoal/60 text-sm">You're all caught up!</p>
</div>

<script src="assets/js/notifications.js"></script>

<script>
const SUPABASE_URL = 'https://vgsgisyneymtszuslftb.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZnc2dpc3luZXltdHN6dXNsZnRiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA0NTg0NjQsImV4cCI6MjEwNjAzNDQ2NH0.HaYptmVnZCbGiOCg1NyYkcdHQDqjXlAHeq_i_bTC6Yk';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
window.db = sb;
window.Notif = window.Notif || {};

const TYPE_ICONS = {
  info:        'M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z',
  success:     'M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z',
  warning:     'M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z',
  error:       'M10 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2m7-2a9 9 0 11-18 0 9 9 0 0118 0z',
  payment:     'M3 10h18M7 15h1m4 0h1m-7 4h12a3 3 0 003-3V8a3 3 0 00-3-3H6a3 3 0 00-3 3v8a3 3 0 003 3z',
  class:       'M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z',
  certificate: 'M9 12l2 2 4-4M7.835 4.697a3.42 3.42 0 001.946-.806 3.42 3.42 0 014.438 0 3.42 3.42 0 001.946.806 3.42 3.42 0 013.138 3.138 3.42 3.42 0 00.806 1.946 3.42 3.42 0 010 4.438 3.42 3.42 0 00-.806 1.946 3.42 3.42 0 01-3.138 3.138 3.42 3.42 0 00-1.946.806 3.42 3.42 0 01-4.438 0 3.42 3.42 0 00-1.946-.806 3.42 3.42 0 01-3.138-3.138 3.42 3.42 0 00-.806-1.946 3.42 3.42 0 010-4.438 3.42 3.42 0 00.806-1.946 3.42 3.42 0 013.138-3.138z',
  review:      'M11.049 2.927c.3-.921 1.603-.921 1.902 0l1.519 4.674a1 1 0 00.95.69h4.915c.969 0 1.371 1.24.588 1.81l-3.976 2.888a1 1 0 00-.363 1.118l1.518 4.674c.3.922-.755 1.688-1.538 1.118l-3.976-2.888a1 1 0 00-1.176 0l-3.976 2.888c-.783.57-1.838-.197-1.538-1.118l1.518-4.674a1 1 0 00-.363-1.118l-3.976-2.888c-.784-.57-.38-1.81.588-1.81h4.914a1 1 0 00.951-.69l1.519-4.674z',
  signup:      'M18 9v3m0 0v3m0-3h3m-3 0h-3m-2-5a4 4 0 11-8 0 4 4 0 018 0zM3 20a6 6 0 0112 0v1H3v-1z'
};

const TYPE_COLORS = {
  info: '#3b82f6', success: '#16a34a', warning: '#eab308',
  error: '#dc2626', payment: '#0A3622', class: '#3b82f6',
  certificate: '#D4AF37', review: '#D4AF37', signup: '#7c3aed'
};

let allNotifs = [];
let currentUserId = null;

function timeAgo(date) {
  const diff = Math.floor((new Date() - date) / 1000);
  if (diff < 60) return 'Just now';
  if (diff < 3600) return Math.floor(diff / 60) + ' min ago';
  if (diff < 86400) return Math.floor(diff / 3600) + ' hr ago';
  if (diff < 604800) return Math.floor(diff / 86400) + ' days ago';
  return date.toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' });
}

function render(list) {
  const box = document.getElementById('notifList');
  const empty = document.getElementById('emptyState');
  
  if (!list.length) {
    box.innerHTML = '';
    empty.classList.remove('hidden');
    return;
  }
  empty.classList.add('hidden');
  
  box.innerHTML = list.map(n => {
    const icon = TYPE_ICONS[n.type] || TYPE_ICONS.info;
    const color = TYPE_COLORS[n.type] || '#3b82f6';
    const ago = timeAgo(new Date(n.created_at));
    return `
      <div class="notif-unread-reset bg-white rounded-2xl p-4 border border-primary/5 card-hover flex items-start gap-3 ${!n.is_read ? 'notif-unread' : ''}" data-id="${n.id}" data-link="${n.link || ''}">
        <div class="w-10 h-10 rounded-xl flex items-center justify-center flex-shrink-0" style="background:${color}20;color:${color}">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="${icon}"/></svg>
        </div>
        <div class="flex-1 min-w-0">
          <div class="flex items-start justify-between gap-2">
            <p class="font-semibold text-primary text-sm">${n.title}</p>
            ${!n.is_read ? '<span class="w-2 h-2 bg-red-500 rounded-full flex-shrink-0 mt-1"></span>' : ''}
          </div>
          <p class="text-xs text-charcoal/70 mt-1">${n.message || ''}</p>
          <p class="text-xs text-charcoal/40 mt-2">${ago}</p>
        </div>
        <button class="notif-delete text-charcoal/30 hover:text-red-500 flex-shrink-0 p-1" data-id="${n.id}">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
        </button>
      </div>
    `;
  }).join('');

  // Click handlers
  box.querySelectorAll('.notif-unread-reset').forEach(el => {
    el.addEventListener('click', async (e) => {
      if (e.target.closest('.notif-delete')) return;
      const id = el.dataset.id;
      const link = el.dataset.link;
      await sb.from('notifications').update({ is_read: true }).eq('id', id);
      if (link) window.location.href = link.replace(/^\//, '');
      else el.classList.remove('notif-unread');
    });
  });

  box.querySelectorAll('.notif-delete').forEach(btn => {
    btn.addEventListener('click', async (e) => {
      e.stopPropagation();
      if (!confirm('Delete this notification?')) return;
      await sb.from('notifications').delete().eq('id', btn.dataset.id);
      loadAll();
    });
  });
}

function applyFilter() {
  const f = document.getElementById('filterFilter').value;
  let list = allNotifs;
  if (f === 'unread') list = list.filter(n => !n.is_read);
  if (f === 'read') list = list.filter(n => n.is_read);
  render(list);
}

async function loadAll() {
  document.getElementById('loading').classList.remove('hidden');
  const { data: { session } } = await sb.auth.getSession();
  if (!session) { window.location.href = 'auth/login.html'; return; }
  currentUserId = session.user.id;

  const { data } = await sb.from('notifications').select('*').eq('user_id', currentUserId).order('created_at', { ascending: false }).limit(100);
  allNotifs = data || [];

  const unread = allNotifs.filter(n => !n.is_read).length;
  document.getElementById('unreadCount').textContent = unread;

  document.getElementById('loading').classList.add('hidden');
  applyFilter();
}

document.getElementById('filterFilter').addEventListener('change', applyFilter);

document.getElementById('markAllBtn').addEventListener('click', async () => {
  if (!currentUserId) return;
  await sb.from('notifications').update({ is_read: true }).eq('user_id', currentUserId).eq('is_read', false);
  loadAll();
});

loadAll();
</script>

</body>
</html>
