<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Debug Notification Bell</title>
<style>
body { font-family: -apple-system, monospace; padding: 16px; background: #0a0a0a; color: #0f0; font-size: 13px; line-height: 1.5; }
h1 { color: #0ff; font-size: 16px; margin: 0 0 12px; }
.box { background: #1a1a1a; padding: 10px; margin: 6px 0; border-radius: 6px; border-left: 4px solid #0f0; word-break: break-all; }
.err { border-left-color: #f00; color: #f88; }
.warn { border-left-color: #fa0; color: #fb8; }
.ok { border-left-color: #0f0; }
a { color: #0ff; }
</style>
</head>
<body>
<h1>🔍 Notification Bell Debug</h1>
<div id="output">Loading scripts...</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/js/supabase-config.js"></script>
<script src="assets/js/notifications.js"></script>
<script>
(async function() {
  var out = document.getElementById('output');
  var lines = [];
  function log(label, val, cls) {
    lines.push('<div class="box ' + (cls||'') + '"><b>' + label + '</b><br>' + val + '</div>');
  }
  function render() { out.innerHTML = lines.join(''); }

  log('Page URL', window.location.href);
  log('window.db', window.db ? 'EXISTS' : 'MISSING', window.db ? 'ok' : 'err');
  log('window.Notif', window.Notif ? 'EXISTS' : 'MISSING', window.Notif ? 'ok' : 'err');
  log('window.NotifBell', window.NotifBell ? 'EXISTS' : 'MISSING', window.NotifBell ? 'ok' : 'err');
  render();

  if (!window.db) {
    log('RESULT', 'supabase-config.js did not load. Check path.', 'err');
    render(); return;
  }

  try {
    var res = await window.db.auth.getSession();
    var session = res && res.data ? res.data.session : null;
    if (!session) {
      log('Session', 'NOT LOGGED IN<br><br>Please visit <a href="student/dashboard.html">student/dashboard.html</a>, login, then return here.', 'err');
      render(); return;
    }
    log('Logged in as', session.user.email + ' / ID: ' + session.user.id, 'ok');
    render();

    if (!window.Notif) {
      log('RESULT', 'window.Notif missing', 'err');
      render(); return;
    }
    if (typeof window.Notif.unreadCount !== 'function') {
      log('unreadCount type', typeof window.Notif.unreadCount, 'err');
      render(); return;
    }

    var count = await window.Notif.unreadCount(session.user.id);
    log('unreadCount() result', String(count) + (count > 0 ? ' (badge SHOULD show this)' : ' (no unread - badge hidden is correct)'), count > 0 ? 'ok' : 'warn');
    render();

    if (typeof window.Notif.recent === 'function') {
      var items = await window.Notif.recent(session.user.id, 5);
      log('recent() items', (items ? items.length : 0) + ' items');
      if (items && items.length) {
        var f = items[0];
        log('Latest notification', 'Title: ' + (f.title||'') + '<br>Type: ' + (f.type||'') + '<br>is_read: ' + f.is_read);
      }
    }
    render();

    log('CONCLUSION', 'If unreadCount > 0 and this page works, but dashboard has no badge, the issue is elsewhere (inject-bell.js override, cache, or DOM rendering). Screenshot this page!', 'warn');
    render();
  } catch (e) {
    log('EXCEPTION', e.message + '<br>' + (e.stack || ''), 'err');
    render();
    console.error(e);
  }
})();
</script>
<br>
<p><a href="student/dashboard.html">→ Go to Dashboard</a></p>
</body>
</html>
