document.getElementById('sidebarToggle').addEventListener('click', () => {

});
document.getElementById('sidebarClose').addEventListener('click', () => {

  document.getElementById('sidebarOverlay').classList.add('hidden');
});

document.getElementById('logoutBtn').addEventListener('click', async () => {
  await db.auth.signOut();

});

(async () => {
  const { data: { session } } = await db.auth.getSession();
  if (!session) { window.location.href = '../auth/login.html'; return; }
  const user = session.user;

  const { data: profile } = await db.from('profiles').select('*').eq('id', user.id).single();
  if (!profile || (profile.role !== 'teacher' && profile.role !== 'admin' && profile.role !== 'super_admin')) {
    alert('Access Denied');
    window.location.href = '../auth/login.html';
    return;
  }

  const fullName = profile.full_name || user.email.split('@')[0];
  document.getElementById('userName').textContent = fullName;
  document.getElementById('userEmail').textContent = user.email;
  document.getElementById('avatar').textContent = fullName.charAt(0).toUpperCase();

  const { data: teacherRecord } = await db.from('teachers').select('*').eq('profile_id', user.id).maybeSingle();
  const teacherId = teacherRecord?.id;

  const grid = document.getElementById('studentsGrid');
  document.getElementById('loading').classList.add('hidden');

  if (!teacherId) {
    grid.innerHTML = '<div class="col-span-full bg-white rounded-3xl p-12 text-center border border-primary/5"><h3 class="text-xl font-bold text-primary mb-2">Teacher Profile Not Set Up</h3><p class="text-charcoal/60 text-sm">Ask admin to create your teacher profile.</p></div>';
    return;
  }

  // Get unique student ids from classes and enrollments
  const { data: classes } = await db.from('classes').select('student_id').eq('teacher_id', teacherId);
  const { data: enrollments } = await db.from('enrollments').select('student_id, course_id').eq('teacher_id', teacherId);

  const studentIds = [...new Set([
    ...(classes || []).map(c => c.student_id),
    ...(enrollments || []).map(e => e.student_id)
  ].filter(Boolean))];

  if (studentIds.length === 0) {
    grid.innerHTML = '<div class="col-span-full bg-white rounded-3xl p-12 text-center border border-primary/5"><h3 class="text-xl font-bold text-primary mb-2">No Students Yet</h3><p class="text-charcoal/60 text-sm mb-4">You don\'t have students assigned. Schedule a class to add students.</p><a href="my-classes.html" class="btn-primary inline-block px-6 py-3 rounded-full font-semibold">Schedule Class</a></div>';
    return;
  }

  const { data: profiles } = await db.from('profiles').select('*').in('id', studentIds);
  const { data: courses } = await db.from('courses').select('id, title');

  grid.innerHTML = (profiles || []).map(s => {
    const sName = s.full_name || s.email?.split('@')[0] || 'Student';
    const sClasses = (classes || []).filter(c => c.student_id === s.id).length;
    const sEnrollments = (enrollments || []).filter(e => e.student_id === s.id);
    const courseTitles = sEnrollments.map(e => (courses || []).find(c => c.id === e.course_id)?.title).filter(Boolean);

    return `
      <div class="bg-white rounded-2xl p-5 border border-primary/5 card-hover">
        <div class="flex items-center gap-3 mb-4">
          <div class="w-12 h-12 rounded-full bg-primary flex items-center justify-center text-secondary font-bold text-lg">${sName.charAt(0).toUpperCase()}</div>
          <div class="min-w-0 flex-1">
            <p class="font-bold text-primary text-sm truncate">${sName}</p>
            <p class="text-xs text-charcoal/60 truncate">${s.email || 'No email'}</p>
          </div>
        </div>
        <div class="space-y-2 text-xs">
          <div class="flex items-center justify-between">
            <span class="text-charcoal/60">Classes Taken</span>
            <span class="font-semibold text-primary">${sClasses}</span>
          </div>
          <div class="flex items-center justify-between">
            <span class="text-charcoal/60">Phone</span>
            <span class="font-semibold text-primary">${s.phone || 'N/A'}</span>
          </div>
          <div class="flex items-center justify-between">
            <span class="text-charcoal/60">Country</span>
            <span class="font-semibold text-primary">${s.country || 'N/A'}</span>
          </div>
        </div>
        ${courseTitles.length ? `<div class="mt-3 pt-3 border-t border-primary/10"><p class="text-xs text-charcoal/60 mb-1">Courses:</p><div class="flex flex-wrap gap-1">${courseTitles.map(t => `<span class="text-xs bg-primary/10 text-primary px-2 py-0.5 rounded-full">${t}</span>`).join('')}</div></div>` : ''}
        <div class="mt-4 flex gap-2">
          <a href="https://wa.me/${(s.phone || '').replace(/[^0-9]/g, '') || '8801737326555'}" target="_blank" class="flex-1 text-center text-xs bg-green-600 text-white px-3 py-2 rounded-full font-semibold hover:bg-green-700">WhatsApp</a>
        </div>
      </div>
    `;
  }).join('');
})();
</script>

<script src="../assets/js/notifications.js"></script>
<script src="../assets/js/inject-bell.js"></script>
