<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chat | Teacher Panel</title>
<meta name="theme-color" content="#0A3622">
<link rel="manifest" href="../manifest.json">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body{font-family:'Inter',sans-serif;background:#F9F7F2}
h1,h2,h3,h4{font-family:'Playfair Display',serif}
.btn-primary{background:#0A3622;color:white;transition:.2s}
.btn-primary:hover{background:#062218}
.sidebar-link{transition:all .2s}
.sidebar-link:hover,.sidebar-link.active{background:rgba(212,175,55,0.15);color:#0A3622;border-left:3px solid #D4AF37}
.msg-bubble{max-width:75%;padding:10px 14px;border-radius:16px;word-wrap:break-word}
.msg-out{background:#0A3622;color:white;border-bottom-right-radius:4px}
.msg-in{background:white;color:#1A1A1A;border-bottom-left-radius:4px}
.thread-item{cursor:pointer;transition:.2s}
.thread-item:hover{background:rgba(10,54,34,.05)}
.thread-item.active{background:rgba(212,175,55,.15);border-left:3px solid #D4AF37}
input:focus{outline:none}
</style>
</head>
<body class="bg-cream text-charcoal min-h-screen">

<header class="sticky top-0 z-40 bg-white border-b border-primary/10">
  <div class="px-4 py-3 flex items-center justify-between">
    <div class="flex items-center gap-3">
      <button id="sidebarToggle" class="lg:hidden p-2 text-primary">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/></svg>
      </button>
      <a href="../index.html" class="flex items-center gap-2">
        <img src="../assets/images/logo.png" alt="Logo" class="w-10 h-10 rounded-full border-2 border-secondary object-cover">
        <div class="hidden sm:block">
          <div class="font-heading font-bold text-primary text-sm leading-tight">Al-Arabiyah</div>
          <div class="text-xs text-primary/70">Teacher Panel</div>
        </div>
      </a>
    </div>
    <div class="flex items-center gap-3">
      <a href="dashboard.html" class="text-sm text-primary font-medium hover:text-secondary">← Dashboard</a>
      <div id="notifBellContainer"></div>
    </div>
  </div>
</header>

<div class="flex">
  <aside id="sidebar" class="fixed lg:sticky top-0 lg:top-[60px] left-0 z-30 w-64 h-screen lg:h-[calc(100vh-60px)] bg-white border-r border-primary/10 transform -translate-x-full lg:translate-x-0 transition-transform overflow-y-auto">
    <div class="p-4">
      <div class="lg:hidden flex justify-end mb-2">
        <button id="sidebarClose" class="p-1 text-charcoal/50">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
        </button>
      </div>
      <nav class="space-y-1">
        <a href="dashboard.html" class="sidebar-link flex items-center gap-3 px-4 py-3 rounded-lg text-charcoal/70">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
          Dashboard
        </a>
        <a href="my-classes.html" class="sidebar-link flex items-center gap-3 px-4 py-3 rounded-lg text-charcoal/70">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
          My Classes
        </a>
        <a href="chat.html" class="sidebar-link active flex items-center gap-3 px-4 py-3 rounded-lg text-primary font-medium">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"/></svg>
          Chat
        </a>
        <a href="log-external-class.html" class="sidebar-link flex items-center gap-3 px-4 py-3 rounded-lg text-charcoal/70">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>
          Log External Class
        </a>
        <a href="mark-attendance.html" class="sidebar-link flex items-center gap-3 px-4 py-3 rounded-lg text-charcoal/70">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
          Mark Attendance
        </a>
        <a href="my-students.html" class="sidebar-link flex items-center gap-3 px-4 py-3 rounded-lg text-charcoal/70">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
          My Students
        </a>
        <a href="kyc.html" class="sidebar-link flex items-center gap-3 px-4 py-3 rounded-lg text-charcoal/70">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"/></svg>
          KYC Verification
        </a>
      </nav>
    </div>
  </aside>

  <div id="sidebarOverlay" class="hidden lg:hidden fixed inset-0 bg-black/50 z-20"></div>

  <main class="flex-1 min-w-0 p-4 md:p-6 lg:p-8">
    <div class="mb-6">
      <h1 class="text-2xl md:text-3xl font-bold text-primary mb-1">Chat</h1>
      <p class="text-charcoal/60 text-sm">Message your students</p>
    </div>

    <div id="loading" class="text-center py-20">
      <div class="inline-block animate-spin rounded-full h-8 w-8 border-4 border-primary/20 border-t-primary"></div>
    </div>

    <div id="chatLayout" class="hidden bg-white rounded-2xl border border-primary/5 overflow-hidden" style="height: calc(100vh - 250px); min-height: 500px;">
      <div class="grid grid-cols-1 md:grid-cols-3 h-full">
        <div class="border-r border-primary/10 overflow-y-auto" id="threadsPanel">
          <div class="p-4 border-b border-primary/10 sticky top-0 bg-white">
            <p class="font-bold text-primary text-sm">Students</p>
          </div>
          <div id="threadsList"></div>
        </div>
        <div class="md:col-span-2 flex flex-col" id="chatPanel">
          <div class="p-4 border-b border-primary/10 bg-cream" id="chatHeader">
            <p class="text-charcoal/50 text-sm text-center py-4">Select a student to start</p>
          </div>
          <div class="flex-1 overflow-y-auto p-4 space-y-3" id="messagesBox" style="background:#F9F7F2"></div>
          <div class="p-3 border-t border-primary/10 bg-white" id="inputArea">
            <div class="flex gap-2">
              <input type="text" id="messageInput" placeholder="Type a message..." class="flex-1 px-4 py-3 border border-primary/20 rounded-full bg-cream text-sm" disabled>
              <button id="sendBtn" class="btn-primary w-12 h-12 rounded-full flex items-center justify-center" disabled>
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"/></svg>
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>
</div>

<script src="../assets/js/supabase-config.js"></script>
<script src="../assets/js/notifications.js"></script>
<script src="../assets/js/inject-bell.js"></script>
<script>
(async () => {
  let tries = 0;
  while (!window.db && tries < 50) { await new Promise(r => setTimeout(r, 100)); tries++; }
  if (!window.db) return;
  const db = window.db;

  document.getElementById('sidebarToggle').addEventListener('click', () => {
    document.getElementById('sidebar').classList.remove('-translate-x-full');
    document.getElementById('sidebarOverlay').classList.remove('hidden');
  });
  document.getElementById('sidebarClose').addEventListener('click', () => {
    document.getElementById('sidebar').classList.add('-translate-x-full');
    document.getElementById('sidebarOverlay').classList.add('hidden');
  });
  document.getElementById('sidebarOverlay').addEventListener('click', () => {
    document.getElementById('sidebar').classList.add('-translate-x-full');
    document.getElementById('sidebarOverlay').classList.add('hidden');
  });

  const { data: { session } } = await db.auth.getSession();
  if (!session) { window.location.href = '../auth/login.html'; return; }
  const user = session.user;

  const { data: profile } = await db.from('profiles').select('*').eq('id', user.id).single();
  if (!profile || profile.role !== 'teacher') { alert('Access Denied'); window.location.href = '../auth/login.html'; return; }

  const { data: teacherRec } = await db.from('teachers').select('*').eq('profile_id', user.id).maybeSingle();
  if (!teacherRec) { alert('Teacher profile not found'); return; }

  let currentThreadId = null;
  let currentStudentName = null;
  let threadsMap = {};
  let realtimeChannel = null;

  async function loadThreads() {
    document.getElementById('loading').classList.remove('hidden');

    // Get threads where this teacher is involved
    const { data: threads } = await db.from('chat_threads')
      .select('*')
      .eq('teacher_id', user.id)
      .order('last_message_at', { ascending: false });

    let list = threads || [];

    // If no threads, get all assigned students and create threads
    if (!list.length) {
      const { data: classes } = await db.from('classes').select('student_id').eq('teacher_id', teacherRec.id);
      const { data: enrollments } = await db.from('enrollments').select('student_id').eq('teacher_id', teacherRec.id);
      const studentIds = [...new Set([
        ...(classes || []).map(c => c.student_id),
        ...(enrollments || []).map(e => e.student_id)
      ].filter(Boolean))];

      if (studentIds.length) {
        const newThreads = studentIds.map(sid => ({
          student_id: sid,
          teacher_id: user.id,
          last_message: null,
          last_message_at: new Date().toISOString()
        }));
        await db.from('chat_threads').insert(newThreads);
        const { data: newList } = await db.from('chat_threads')
          .select('*')
          .eq('teacher_id', user.id)
          .order('last_message_at', { ascending: false });
        list = newList || [];
      }
    }

    threadsMap = {};
    list.forEach(t => threadsMap[t.id] = t);

    // Load student profiles
    const studentIds = list.map(t => t.student_id).filter(Boolean);
    let studentMap = {};
    if (studentIds.length) {
      const { data: students } = await db.from('profiles').select('id, full_name, email, avatar_url').in('id', studentIds);
      (students || []).forEach(s => studentMap[s.id] = s);
    }

    const box = document.getElementById('threadsList');
    document.getElementById('loading').classList.add('hidden');
    document.getElementById('chatLayout').classList.remove('hidden');

    if (!list.length) {
      box.innerHTML = '<p class="p-4 text-center text-charcoal/60 text-sm">No students assigned yet.</p>';
      return;
    }

    box.innerHTML = list.map(t => {
      const student = studentMap[t.student_id] || {};
      const name = student.full_name || student.email?.split('@')[0] || 'Student';
      const initials = name.charAt(0).toUpperCase();
      const unread = t.teacher_unread || 0;
      const time = t.last_message_at ? new Date(t.last_message_at).toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' }) : '';
      return `
        <div class="thread-item p-4 border-b border-primary/5" data-tid="${t.id}" data-student-name="${name.replace(/"/g, '&quot;')}">
          <div class="flex items-center gap-3">
            <div class="w-10 h-10 rounded-full bg-primary flex items-center justify-center text-secondary font-bold flex-shrink-0">${initials}</div>
            <div class="flex-1 min-w-0">
              <div class="flex items-center justify-between gap-2">
                <p class="font-semibold text-primary text-sm truncate">${name}</p>
                <span class="text-xs text-charcoal/40 flex-shrink-0">${time}</span>
              </div>
              <p class="text-xs text-charcoal/60 truncate">${t.last_message || 'No messages yet'}</p>
            </div>
            ${unread > 0 ? `<span class="bg-red-500 text-white text-xs font-bold rounded-full w-5 h-5 flex items-center justify-center flex-shrink-0">${unread}</span>` : ''}
          </div>
        </div>
      `;
    }).join('');

    box.querySelectorAll('.thread-item').forEach(el => {
      el.addEventListener('click', () => openThread(el.dataset.tid, el.dataset.studentName));
    });
  }

  async function openThread(threadId, studentName) {
    currentThreadId = threadId;
    currentStudentName = studentName;

    document.querySelectorAll('.thread-item').forEach(el => el.classList.remove('active'));
    const threadEl = document.querySelector(`.thread-item[data-tid="${threadId}"]`);
    if (threadEl) threadEl.classList.add('active');

    document.getElementById('chatHeader').innerHTML = `
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-full bg-primary flex items-center justify-center text-secondary font-bold">${studentName.charAt(0).toUpperCase()}</div>
        <div>
          <p class="font-bold text-primary text-sm">${studentName}</p>
          <p class="text-xs text-green-600">● Student</p>
        </div>
      </div>
    `;

    document.getElementById('messageInput').disabled = false;
    document.getElementById('sendBtn').disabled = false;
    document.getElementById('messageInput').focus();

    await db.from('chat_threads').update({ teacher_unread: 0 }).eq('id', threadId);
    const tEl = document.querySelector(`.thread-item[data-tid="${threadId}"]`);
    if (tEl) {
      const badge = tEl.querySelector('.bg-red-500');
      if (badge) badge.remove();
    }

    await loadMessages();
    subscribeToMessages();
  }

  async function loadMessages() {
    if (!currentThreadId) return;
    const { data: messages } = await db.from('chat_messages')
      .select('*')
      .eq('thread_id', currentThreadId)
      .order('created_at', { ascending: true });

    renderMessages(messages || []);
  }

  function renderMessages(messages) {
    const box = document.getElementById('messagesBox');
    if (!messages.length) {
      box.innerHTML = '<p class="text-center text-charcoal/40 text-sm py-8">No messages yet. Send a greeting 👋</p>';
      return;
    }
    box.innerHTML = messages.map(m => {
      const isOut = m.sender_id === user.id;
      const time = new Date(m.created_at).toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' });
      return `
        <div class="flex ${isOut ? 'justify-end' : 'justify-start'}">
          <div class="msg-bubble ${isOut ? 'msg-out' : 'msg-in'}">
            <p class="text-sm whitespace-pre-line">${escapeHtml(m.message)}</p>
            <p class="text-xs opacity-60 mt-1 ${isOut ? 'text-right' : ''}">${time}</p>
          </div>
        </div>
      `;
    }).join('');
    box.scrollTop = box.scrollHeight;
  }

  function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
  }

  function subscribeToMessages() {
    if (realtimeChannel) db.removeChannel(realtimeChannel);
    realtimeChannel = db.channel('teacher_chat_' + currentThreadId)
      .on('postgres_changes', {
        event: 'INSERT',
        schema: 'public',
        table: 'chat_messages',
        filter: 'thread_id=eq.' + currentThreadId
      }, (payload) => {
        const msg = payload.new;
        if (msg.sender_id === user.id) return;
        const box = document.getElementById('messagesBox');
        const time = new Date(msg.created_at).toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' });
        const div = document.createElement('div');
        div.className = 'flex justify-start';
        div.innerHTML = `
          <div class="msg-bubble msg-in">
            <p class="text-sm whitespace-pre-line">${escapeHtml(msg.message)}</p>
            <p class="text-xs opacity-60 mt-1">${time}</p>
          </div>
        `;
        box.appendChild(div);
        box.scrollTop = box.scrollHeight;
        db.from('chat_messages').update({ is_read: true }).eq('id', msg.id).then(() => {});
      })
      .subscribe();
  }

  async function sendMessage() {
    const input = document.getElementById('messageInput');
    const text = input.value.trim();
    if (!text || !currentThreadId) return;

    input.value = '';
    input.disabled = true;

    const { error } = await db.from('chat_messages').insert({
      thread_id: currentThreadId,
      sender_id: user.id,
      message: text
    });

    if (error) {
      alert('Failed to send: ' + error.message);
      input.disabled = false;
      return;
    }

    await db.from('chat_threads').update({
      last_message: text.length > 60 ? text.substring(0, 60) + '...' : text,
      last_message_at: new Date().toISOString(),
      student_unread: (threadsMap[currentThreadId]?.student_unread || 0) + 1
    }).eq('id', currentThreadId);

    input.disabled = false;
    input.focus();
    await loadMessages();

    const thread = threadsMap[currentThreadId];
    if (thread && window.Notif) {
      await Notif.send(thread.student_id, 'New Message from Teacher 💬', text.substring(0, 50), 'info', '/student/chat.html').catch(() => {});
    }
  }

  document.getElementById('sendBtn').addEventListener('click', sendMessage);
  document.getElementById('messageInput').addEventListener('keypress', (e) => {
    if (e.key === 'Enter') sendMessage();
  });

  loadThreads();
})();
</script>

</body>
</html>
