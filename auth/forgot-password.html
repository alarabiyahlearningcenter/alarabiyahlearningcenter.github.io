<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forgot Password | Al-Arabiyah Learning Center</title>
<link rel="manifest" href="../manifest.json">
<meta name="theme-color" content="#0A3622">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Inter:wght@300;400;500;600;700&family=Amiri&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = { theme: { extend: {
  colors: { primary: '#0A3622', 'primary-dark': '#062218', secondary: '#D4AF37', cream: '#F9F7F2', charcoal: '#1A1A1A' },
  fontFamily: { heading: ['Playfair Display', 'serif'], body: ['Inter', 'sans-serif'], arabic: ['Amiri', 'serif'] }
}}}
</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body { font-family: 'Inter', sans-serif; background: #F9F7F2; }
h1, h2, h3 { font-family: 'Playfair Display', serif; }
.islamic-pattern { background-image: radial-gradient(circle at 20% 30%, rgba(212,175,55,0.08) 0%, transparent 50%), radial-gradient(circle at 80% 70%, rgba(10,54,34,0.05) 0%, transparent 50%); }
.btn-primary { background: #0A3622; color: white; transition: all 0.3s; }
.btn-primary:hover { background: #062218; }
.btn-primary:disabled { opacity: 0.6; cursor: not-allowed; }
input:focus { outline: none; border-color: #0A3622; box-shadow: 0 0 0 3px rgba(10,54,34,0.1); }
</style>
</head>
<body class="bg-cream min-h-screen flex flex-col islamic-pattern">

<header class="bg-cream border-b border-primary/10">
  <div class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between">
    <a href="../index.html" class="flex items-center gap-3">
      <img src="../assets/images/logo.png" alt="Al-Arabiyah" class="w-12 h-12 rounded-full border-2 border-secondary object-cover">
      <div class="hidden sm:block">
        <div class="font-heading font-bold text-primary text-base leading-tight">Al-Arabiyah</div>
        <div class="text-xs text-primary/70">Learning Center</div>
      </div>
    </a>
    <a href="../index.html" class="text-primary font-medium text-sm hover:text-secondary">Back to Home</a>
  </div>
</header>

<main class="flex-1 flex items-center justify-center py-12 px-4">
  <div class="w-full max-w-md">
    <div class="bg-white rounded-3xl shadow-xl border border-primary/5 p-8">
      <div class="text-center mb-8">
        <div class="w-16 h-16 bg-primary/10 rounded-2xl flex items-center justify-center mx-auto mb-4">
          <svg class="w-8 h-8 text-primary" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 7a2 2 0 012 2m4 0a6 6 0 01-7.743 5.743L11 17H9v2H7v2H4a1 1 0 01-1-1v-2.586a1 1 0 01.293-.707l5.964-5.964A6 6 0 1121 9z"/></svg>
        </div>
        <h1 class="text-3xl font-bold text-primary mb-2">Reset Password</h1>
        <p class="text-charcoal/60 text-sm">Enter your email to receive a reset link</p>
      </div>

      <form id="resetForm" class="space-y-5">
        <div>
          <label class="block text-sm font-semibold text-primary mb-2">Email</label>
          <input type="email" id="email" required placeholder="your@email.com" class="w-full px-4 py-3 border border-primary/20 rounded-xl bg-cream">
        </div>
        <button type="submit" id="submitBtn" class="btn-primary w-full py-3.5 rounded-xl font-semibold">Send Reset Link</button>
        <p id="status" class="text-sm text-center hidden"></p>
      </form>

      <div class="mt-6 text-center text-sm text-charcoal/60">
        Remember your password? <a href="login.html" class="text-primary font-semibold hover:text-secondary">Back to Login</a>
      </div>
    </div>
  </div>
</main>

<script>
const SUPABASE_URL = 'https://vgsgisyneymtszuslftb.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZnc2dpc3luZXltdHN6dXNsZnRiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA0NTg0NjQsImV4cCI6MjEwNjAzNDQ2NH0.HaYptmVnZCbGiOCg1NyYkcdHQDqjXlAheq_i_bTC6Yk';
const { createClient } = supabase;
const db = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

document.getElementById('resetForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = document.getElementById('submitBtn');
  const status = document.getElementById('status');
  const email = document.getElementById('email').value.trim();

  btn.disabled = true;
  btn.textContent = 'Sending...';
  status.classList.add('hidden');

  const { error } = await db.auth.resetPasswordForEmail(email, {
    redirectTo: window.location.origin + '/auth/login.html'
  });

  if (error) {
    status.textContent = error.message;
    status.className = 'text-sm text-center text-red-600';
    status.classList.remove('hidden');
    btn.disabled = false;
    btn.textContent = 'Send Reset Link';
    return;
  }

  status.textContent = 'Reset link sent! Check your email.';
  status.className = 'text-sm text-center text-green-600';
  status.classList.remove('hidden');
  btn.textContent = 'Sent!';
});
</script>

</body>
</html>
