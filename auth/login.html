<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login | Al-Arabiyah Learning Center</title>
<meta name="description" content="Login to your Al-Arabiyah Learning Center account.">
<link rel="manifest" href="../manifest.json">
<meta name="theme-color" content="#0A3622">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Inter:wght@300;400;500;600;700&family=Amiri&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = { theme: { extend: {
  colors: { primary: '#0A3622', 'primary-dark': '#062218', secondary: '#D4AF37', cream: '#F9F7F2', charcoal: '#1A1A1A' },
  fontFamily: { heading: ['Playfair Display', 'serif'], body: ['Inter', 'sans-serif'], arabic: ['Amiri', 'serif'] }
}}}
</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body { font-family: 'Inter', sans-serif; background: #F9F7F2; }
h1, h2, h3 { font-family: 'Playfair Display', serif; }
.islamic-pattern { background-image: radial-gradient(circle at 20% 30%, rgba(212,175,55,0.08) 0%, transparent 50%), radial-gradient(circle at 80% 70%, rgba(10,54,34,0.05) 0%, transparent 50%); }
.btn-primary { background: #0A3622; color: white; transition: all 0.3s; }
.btn-primary:hover { background: #062218; }
.btn-primary:disabled { opacity: 0.6; cursor: not-allowed; }
input:focus { outline: none; border-color: #0A3622; box-shadow: 0 0 0 3px rgba(10,54,34,0.1); }
</style>
</head>
<body class="bg-cream min-h-screen flex flex-col islamic-pattern">

<header class="bg-cream border-b border-primary/10">
  <div class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between">
    <a href="../index.html" class="flex items-center gap-3">
      <img src="../assets/images/logo.png" alt="Al-Arabiyah" class="w-12 h-12 rounded-full border-2 border-secondary object-cover">
      <div class="hidden sm:block">
        <div class="font-heading font-bold text-primary text-base leading-tight">Al-Arabiyah</div>
        <div class="text-xs text-primary/70">Learning Center</div>
      </div>
    </a>
    <a href="../index.html" class="text-primary font-medium text-sm hover:text-secondary">Back to Home</a>
  </div>
</header>

<main class="flex-1 flex items-center justify-center py-12 px-4">
  <div class="w-full max-w-md">
    <div class="bg-white rounded-3xl shadow-xl border border-primary/5 p-8">
      <div class="text-center mb-8">
        <h1 class="text-3xl font-bold text-primary mb-2">Welcome Back</h1>
        <p class="text-charcoal/60 text-sm">Login to your account</p>
      </div>

      <form id="loginForm" class="space-y-5">
        <div>
          <label class="block text-sm font-semibold text-primary mb-2">Email</label>
          <input type="email" id="email" required placeholder="your@email.com" class="w-full px-4 py-3 border border-primary/20 rounded-xl bg-cream">
        </div>

        <div>
          <div class="flex items-center justify-between mb-2">
            <label class="block text-sm font-semibold text-primary">Password</label>
            <a href="forgot-password.html" class="text-xs text-secondary font-medium hover:underline">Forgot?</a>
          </div>
          <div class="relative">
            <input type="password" id="password" required placeholder="Your password" class="w-full px-4 py-3 border border-primary/20 rounded-xl bg-cream pr-12">
            <button type="button" id="togglePw" class="absolute right-3 top-1/2 -translate-y-1/2 text-charcoal/50">
              <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/></svg>
            </button>
          </div>
        </div>

        <button type="submit" id="submitBtn" class="btn-primary w-full py-3.5 rounded-xl font-semibold">Login</button>

        <p id="status" class="text-sm text-center hidden"></p>
      </form>

      <div class="mt-6 text-center text-sm text-charcoal/60">
        Don't have an account? <a href="signup.html" class="text-primary font-semibold hover:text-secondary">Sign up</a>
          <span class="text-charcoal/40 mx-1">•</span>
          <a href="../parent-signup.html" class="text-secondary font-semibold hover:underline">Parent Signup</a>
      </div>
    </div>

    <p class="text-center text-xs text-charcoal/50 mt-6">
      By logging in, you agree to our 
      <a href="../terms.html" class="underline">Terms</a> & 
      <a href="../privacy-policy.html" class="underline">Privacy Policy</a>
    </p>
  </div>
</main>

<script>
const SUPABASE_URL = 'https://vgsgisyneymtszuslftb.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZnc2dpc3luZXltdHN6dXNsZnRiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA0NTg0NjQsImV4cCI6MjEwNjAzNDQ2NH0.HaYptmVnZCbGiOCg1NyYkcdHQDqjXlAHeq_i_bTC6Yk';
const { createClient } = supabase;
const db = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

// Toggle password visibility
document.getElementById('togglePw').addEventListener('click', () => {
  const pw = document.getElementById('password');
  pw.type = pw.type === 'password' ? 'text' : 'password';
});

// Login form
document.getElementById('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = document.getElementById('submitBtn');
  const status = document.getElementById('status');
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;

  btn.disabled = true;
  btn.textContent = 'Logging in...';
  status.classList.add('hidden');

  const { data, error } = await db.auth.signInWithPassword({ email, password });

  if (error) {
    status.textContent = error.message;
    status.className = 'text-sm text-center text-red-600';
    status.classList.remove('hidden');
    btn.disabled = false;
    btn.textContent = 'Login';
    return;
  }

  // Check user role
  const { data: profile } = await db.from('profiles').select('role').eq('id', data.user.id).single();
  const role = profile?.role || 'student';

  status.textContent = 'Login successful! Redirecting...';
  status.className = 'text-sm text-center text-green-600';
  status.classList.remove('hidden');

  setTimeout(() => {
    if (role === 'super_admin' || role === 'admin') {
      window.location.href = '../super-admin/dashboard.html';
    } else if (role === 'teacher') {
      window.location.href = '../teacher/dashboard.html';
    } else if (role === 'parent') {
      window.location.href = '../parent/dashboard.html';
    } else {
      window.location.href = '../student/dashboard.html';
    }
  }, 800);
});

// Check if already logged in
(async () => {
  const { data: { session } } = await db.auth.getSession();
  if (session) {
    const { data: profile } = await db.from('profiles').select('role').eq('id', session.user.id).single();
    const role = profile?.role || 'student';
    if (role === 'super_admin' || role === 'admin') {
      window.location.href = '../super-admin/dashboard.html';
    } else if (role === 'teacher') {
      window.location.href = '../teacher/dashboard.html';
    } else if (role === 'parent') {
      window.location.href = '../parent/dashboard.html';
    } else {
      window.location.href = '../student/dashboard.html';
    }
  }
})();
</script>

</body>
</html>
