  <div id="sidebarOverlay" class="hidden lg:hidden fixed inset-0 bg-black/50 z-20"></div>

  <main class="flex-1 min-w-0 p-4 md:p-6 lg:p-8">
    <div class="mb-6">
      <h1 class="text-2xl md:text-3xl font-bold text-primary mb-1">Quizzes</h1>
      <p class="text-charcoal/60 text-sm">Test your knowledge with course quizzes</p>
    </div>

    <div id="loading" class="text-center py-20">
      <div class="inline-block animate-spin rounded-full h-8 w-8 border-4 border-primary/20 border-t-primary"></div>
    </div>

    <div id="quizzesList" class="grid sm:grid-cols-2 lg:grid-cols-3 gap-4"></div>

<script src="../assets/js/supabase-config.js"></script>
<script src="../assets/js/notifications.js"></script>
<script src="../assets/js/inject-bell.js"></script>
<script>
(async () => {
  let tries = 0;
  while (!window.db && tries < 50) { await new Promise(r => setTimeout(r, 100)); tries++; }
  if (!window.db) return;
  const db = window.db;

  document.getElementById('sidebarToggle').addEventListener('click', () => {
    document.getElementById('sidebar').classList.remove('-translate-x-full');
    document.getElementById('sidebarOverlay').classList.remove('hidden');
  });
  document.getElementById('sidebarClose').addEventListener('click', () => {
    document.getElementById('sidebar').classList.add('-translate-x-full');
    document.getElementById('sidebarOverlay').classList.add('hidden');
  });
  document.getElementById('sidebarOverlay').addEventListener('click', () => {
    document.getElementById('sidebar').classList.add('-translate-x-full');
    document.getElementById('sidebarOverlay').classList.add('hidden');
  });

  const { data: { session } } = await db.auth.getSession();
  if (!session) { window.location.href = '../auth/login.html'; return; }
  const user = session.user;

  async function loadQuizzes() {
    document.getElementById('loading').classList.remove('hidden');
    const { data: quizzes } = await db.from('quizzes').select('*, courses(title)').eq('is_active', true).order('created_at', { ascending: false });
    const list = quizzes || [];

    let attemptsMap = {};
    if (list.length) {
      const ids = list.map(q => q.id);
      const { data: attempts } = await db.from('quiz_attempts').select('*').eq('student_id', user.id).in('quiz_id', ids).order('completed_at', { ascending: false });
      (attempts || []).forEach(a => { if (!attemptsMap[a.quiz_id]) attemptsMap[a.quiz_id] = a; });
    }

    // Question counts
    let countMap = {};
    if (list.length) {
      const ids = list.map(q => q.id);
      const { data: counts } = await db.from('quiz_questions').select('quiz_id').in('quiz_id', ids);
      (counts || []).forEach(c => { countMap[c.quiz_id] = (countMap[c.quiz_id] || 0) + 1; });
    }

    const box = document.getElementById('quizzesList');
    document.getElementById('loading').classList.add('hidden');

    if (!list.length) {
      box.innerHTML = '<div class="col-span-full bg-white rounded-2xl p-10 text-center border border-primary/5 text-charcoal/60 text-sm">No quizzes available yet</div>';
      return;
    }

    box.innerHTML = list.map(q => {
      const attempt = attemptsMap[q.id];
      const questionCount = countMap[q.id] || 0;
      const statusColor = attempt ? (attempt.passed ? 'bg-green-100 text-green-700' : 'bg-red-100 text-red-700') : 'bg-blue-100 text-blue-700';
      const statusLabel = attempt ? (attempt.passed ? '✓ Passed' : '✕ Failed') : 'Not Attempted';

      return `
        <div class="bg-white rounded-2xl p-5 border border-primary/5 card-hover">
          <div class="flex items-start justify-between mb-3">
            <div class="w-12 h-12 bg-primary rounded-xl flex items-center justify-center">
              <svg class="w-6 h-6 text-secondary" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8.228 9c.549-1.165 2.03-2 3.772-2 2.21 0 4 1.343 4 3 0 1.4-1.278 2.575-3.006 2.907-.542.104-.994.54-.994 1.093m0 3h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
            </div>
            <span class="text-xs px-2 py-1 rounded-full font-semibold ${statusColor}">${statusLabel}</span>
          </div>
          <h3 class="font-bold text-primary mb-1">${q.title}</h3>
          <p class="text-xs text-charcoal/60 mb-3">${q.courses?.title || 'No course'} • ${questionCount} questions</p>
          ${attempt ? `<p class="text-xs text-charcoal/70 mb-3">Last score: <strong>${attempt.percentage}%</strong></p>` : ''}
          <div class="flex gap-2 pt-3 border-t border-primary/10">
            <button onclick="startQuiz('${q.id}')" class="flex-1 btn-primary text-xs px-3 py-2 rounded-full font-semibold">${attempt ? 'Retake' : 'Start Quiz'}</button>
          </div>
        </div>
      `;
    }).join('');
  }

  window.startQuiz = async (quizId) => {
    const { data: quiz } = await db.from('quizzes').select('*').eq('id', quizId).single();
    const { data: questions } = await db.from('quiz_questions').select('*').eq('quiz_id', quizId).order('sort_order');
    
    if (!questions || !questions.length) {
      alert('This quiz has no questions yet');
      return;
    }

    const modal = document.createElement('div');
    modal.id = 'quizPlayModal';
    modal.className = 'fixed inset-0 z-[100] bg-black/70 flex items-center justify-center p-4 overflow-y-auto';
    modal.innerHTML = `
      <div class="bg-white rounded-2xl max-w-2xl w-full my-8">
        <div class="bg-primary text-white px-6 py-4 rounded-t-2xl flex items-center justify-between">
          <div>
            <h3 class="font-bold">${quiz.title}</h3>
            <p class="text-xs text-white/70">${questions.length} questions</p>
          </div>
          <button onclick="document.getElementById('quizPlayModal').remove()" class="text-white/80 hover:text-white text-2xl">&times;</button>
        </div>
        <div class="p-6" id="quizQuestionsBox"></div>
        <div class="px-6 pb-6">
          <button id="submitQuizBtn" class="btn-primary w-full py-3.5 rounded-xl font-semibold">Submit Quiz</button>
        </div>
      </div>
    `;
    document.body.appendChild(modal);

    const qBox = document.getElementById('quizQuestionsBox');
    qBox.innerHTML = questions.map((q, i) => `
      <div class="mb-5 pb-5 border-b border-primary/10 last:border-0" data-qid="${q.id}">
        <p class="font-semibold text-primary mb-3">${i + 1}. ${q.question}</p>
        <div class="space-y-2">
          ${(q.options || []).map((opt, j) => `
            <label class="flex items-center gap-3 p-3 border-2 border-primary/10 rounded-xl cursor-pointer hover:border-primary/30 transition">
              <input type="radio" name="q_${q.id}" value="${j}" class="accent-green-600">
              <span class="text-sm text-charcoal/80">${opt}</span>
            </label>
          `).join('')}
        </div>
      </div>
    `).join('');

    document.getElementById('submitQuizBtn').addEventListener('click', async () => {
      const answers = {};
      let answered = 0;
      questions.forEach(q => {
        const sel = document.querySelector(`input[name="q_${q.id}"]:checked`);
        if (sel) {
          answers[q.id] = Number(sel.value);
          answered++;
        }
      });

      if (answered < questions.length) {
        if (!confirm(`${questions.length - answered} questions not answered. Submit anyway?`)) return;
      }

      let correct = 0;
      questions.forEach(q => {
        if (answers[q.id] === q.correct_answer) correct++;
      });

      const percentage = Math.round((correct / questions.length) * 100);
      const passed = percentage >= (quiz.pass_score || 70);

      const { error } = await db.from('quiz_attempts').insert({
        quiz_id: quiz.id,
        student_id: user.id,
        answers: answers,
        score: correct,
        total: questions.length,
        percentage: percentage,
        passed: passed
      });

      if (error) { alert('Error saving result: ' + error.message); return; }

      // If passed and quiz has a lesson_id, mark that lesson complete
      if (passed && quiz.lesson_id && quiz.course_id) {
        await db.from('progress').upsert({
          student_id: user.id,
          lesson_id: quiz.lesson_id,
          course_id: quiz.course_id,
          is_completed: true,
          completed_at: new Date().toISOString()
        }, { onConflict: 'student_id,lesson_id' }).catch(() => {});
      }

      // Notify student if passed
      if (passed && window.Notif) {
        await Notif.send(user.id, 'Quiz Passed! 🎉', 'You scored ' + percentage + '% on "' + quiz.title + '"', 'success', '/student/quizzes.html').catch(() => {});
      }

      // Show result
      document.getElementById('quizPlayModal').remove();
      showResult(correct, questions.length, percentage, passed, quiz);
    });
  };

  function showResult(correct, total, pct, passed, quiz) {
    const modal = document.createElement('div');
    modal.className = 'fixed inset-0 z-[100] bg-black/70 flex items-center justify-center p-4';
    modal.innerHTML = `
      <div class="bg-white rounded-3xl max-w-md w-full p-8 text-center">
        <div class="w-24 h-24 mx-auto rounded-full flex items-center justify-center mb-4" style="background:${passed ? '#dcfce7' : '#fee2e2'}">
          <svg class="w-12 h-12" style="color:${passed ? '#16a34a' : '#dc2626'}" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="${passed ? 'M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z' : 'M10 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2m7-2a9 9 0 11-18 0 9 9 0 0118 0z'}"/></svg>
        </div>
        <h2 class="text-3xl font-bold mb-2" style="color:${passed ? '#16a34a' : '#dc2626'}">${passed ? 'Passed!' : 'Not Passed'}</h2>
        <p class="text-charcoal/70 text-sm mb-6">${quiz.title}</p>
        <div class="bg-cream rounded-2xl p-5 mb-6">
          <p class="text-5xl font-bold" style="color:${passed ? '#16a34a' : '#dc2626'}">${pct}%</p>
          <p class="text-sm text-charcoal/60 mt-2">${correct} of ${total} correct</p>
        </div>
        <button onclick="this.closest('.fixed').remove(); loadQuizzes();" class="btn-primary w-full py-3.5 rounded-xl font-semibold">Back to Quizzes</button>
      </div>
    `;
    document.body.appendChild(modal);
  }

  loadQuizzes();
})();
</script>

</body>
