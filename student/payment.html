          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>

        <a href="live-class.html" class="sidebar-link flex items-center gap-3 px-4 py-3 rounded-lg text-charcoal/70">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"/></svg>

        <a href="payment.html" class="sidebar-link active flex items-center gap-3 px-4 py-3 rounded-lg text-primary font-medium">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 10h18M7 15h1m4 0h1m-7 4h12a3 3 0 003-3V8a3 3 0 00-3-3H6a3 3 0 00-3 3v8a3 3 0 003 3z"/></svg>

        <a href="certificate.html" class="sidebar-link flex items-center gap-3 px-4 py-3 rounded-lg text-charcoal/70">

          Certificates
        </a>
        <a href="profile.html" class="sidebar-link flex items-center gap-3 px-4 py-3 rounded-lg text-charcoal/70">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
          My Profile

        <a href="change-password.html" class="flex items-center gap-3 px-4 py-3 rounded-lg text-charcoal/70 hover:bg-secondary/10">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/></svg>
          Change Password

      </nav>
    </div>
  </aside>

  <div id="sidebarOverlay" class="hidden lg:hidden fixed inset-0 bg-black/50 z-20"></div>

  <main class="flex-1 min-w-0 p-4 md:p-6 lg:p-8">
    <div class="mb-6">
      <h1 class="text-2xl md:text-3xl font-bold text-primary mb-1">Payments</h1>
      <p class="text-charcoal/60 text-sm">Make payments and view history</p>
    </div>

    <div id="paymentContainer"></div>
  </main>
</div>

<script>
const SUPABASE_URL = 'https://vgsgisyneymtszuslftb.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZnc2dpc3luZXltdHN6dXNsZnRiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA0NTg0NjQsImV4cCI6MjEwNjAzNDQ2NH0.HaYptmVnZCbGiOCg1NyYkcdHQDqjXlAHeq_i_bTC6Yk';
const { createClient } = supabase;
const db = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

document.getElementById('sidebarToggle').addEventListener('click', () => {
  document.getElementById('sidebar').classList.remove('-translate-x-full');
  document.getElementById('sidebarOverlay').classList.remove('hidden');
});
document.getElementById('sidebarClose').addEventListener('click', () => {
  document.getElementById('sidebar').classList.add('-translate-x-full');
  document.getElementById('sidebarOverlay').classList.add('hidden');
});
document.getElementById('sidebarOverlay').addEventListener('click', () => {
  document.getElementById('sidebar').classList.add('-translate-x-full');
  document.getElementById('sidebarOverlay').classList.add('hidden');
});
document.getElementById('userMenuBtn').addEventListener('click', (e) => {
  e.stopPropagation();
  document.getElementById('userMenu').classList.toggle('hidden');
});
document.addEventListener('click', () => document.getElementById('userMenu').classList.add('hidden'));
document.getElementById('logoutBtn').addEventListener('click', async () => {
  await db.auth.signOut();
  window.location.href = '../auth/login.html';
});

(async () => {
  const { data: { session } } = await db.auth.getSession();
  if (!session) { window.location.href = '../auth/login.html'; return; }
  const user = session.user;

  const { data: profile } = await db.from('profiles').select('*').eq('id', user.id).single();
  const fullName = profile?.full_name || user.email.split('@')[0];
  document.getElementById('userName').textContent = fullName;
  document.getElementById('userEmail').textContent = user.email;
  document.getElementById('avatar').textContent = fullName.charAt(0).toUpperCase();

  // Load pending payments
  const { data: payments } = await db.from('payments').select('*').eq('student_id', user.id).order('created_at', { ascending: false });
  const { data: courses } = await db.from('courses').select('id, title, price_bdt').eq('is_active', true);

  const container = document.getElementById('paymentContainer');
  
  const pendingCount = (payments || []).filter(p => p.status === 'pending').length;
  const verifiedCount = (payments || []).filter(p => p.status === 'verified').length;

  container.innerHTML = `
    <!-- Stats -->
    <div class="grid grid-cols-3 gap-4 mb-6">
      <div class="bg-white rounded-2xl p-4 border border-primary/5">
        <p class="text-xs text-charcoal/60 mb-1">Total Paid</p>
        <p class="text-xl font-bold text-primary">৳${(payments || []).filter(p => p.status === 'verified').reduce((sum, p) => sum + Number(p.amount || 0), 0)}</p>
      </div>
      <div class="bg-white rounded-2xl p-4 border border-primary/5">
        <p class="text-xs text-charcoal/60 mb-1">Pending</p>
        <p class="text-xl font-bold text-yellow-600">${pendingCount}</p>
      </div>
      <div class="bg-white rounded-2xl p-4 border border-primary/5">
        <p class="text-xs text-charcoal/60 mb-1">Verified</p>
        <p class="text-xl font-bold text-green-600">${verifiedCount}</p>
      </div>
    </div>

    <!-- New Payment Form -->
    <div class="bg-white rounded-2xl p-6 border border-primary/5 mb-6">
      <h3 class="text-lg font-bold text-primary mb-4">Make a Payment</h3>
      
      <div class="bg-secondary/10 border border-secondary/30 rounded-xl p-4 mb-5">
        <p class="text-sm font-semibold text-primary mb-2">Payment Methods:</p>
        <div class="grid grid-cols-2 gap-3 text-sm">
          <div class="bg-white rounded-lg p-3">
            <p class="font-bold text-primary">bKash</p>
            <p class="text-charcoal/70 text-xs mt-1">Send Money</p>
            <p class="text-primary font-bold mt-2">01737326555</p>
          </div>
          <div class="bg-white rounded-lg p-3">
            <p class="font-bold text-primary">Nagad</p>
            <p class="text-charcoal/70 text-xs mt-1">Send Money</p>
            <p class="text-primary font-bold mt-2">01737326555</p>
          </div>
        </div>
        <p class="text-xs text-charcoal/60 mt-3">💡 After sending money, fill the form below with the Transaction ID.</p>
      </div>

      <form id="paymentForm" class="space-y-4">
        <div>
          <label class="block text-sm font-semibold text-primary mb-2">Select Course *</label>
          <select id="courseSelect" required class="w-full px-4 py-3 border border-primary/20 rounded-xl bg-cream">
            <option value="">Choose a course</option>
            ${(courses || []).map(c => `<option value="${c.id}" data-price="${c.price_bdt}">${c.title} - ৳${c.price_bdt}</option>`).join('')}
          </select>
        </div>
        <div class="grid sm:grid-cols-2 gap-4">
          <div>
            <label class="block text-sm font-semibold text-primary mb-2">Amount (BDT) *</label>
            <input type="number" id="amount" required placeholder="2000" class="w-full px-4 py-3 border border-primary/20 rounded-xl bg-cream">
          </div>
          <div>
            <label class="block text-sm font-semibold text-primary mb-2">Method *</label>
            <select id="method" required class="w-full px-4 py-3 border border-primary/20 rounded-xl bg-cream">
              <option value="">Select</option>
              <option value="bkash">bKash</option>
              <option value="nagad">Nagad</option>
              <option value="rocket">Rocket</option>
              <option value="bank">Bank Transfer</option>
            </select>
          </div>
        </div>
        <div>
          <label class="block text-sm font-semibold text-primary mb-2">Transaction ID *</label>
          <input type="text" id="transactionId" required placeholder="e.g. 8N7A2B3C4D" class="w-full px-4 py-3 border border-primary/20 rounded-xl bg-cream uppercase">
        </div>
        <div>
          <label class="block text-sm font-semibold text-primary mb-2">Payment Screenshot (optional)</label>
          <input type="file" id="screenshotInput" accept="image/*" class="w-full px-4 py-3 border border-primary/20 rounded-xl bg-cream text-sm">
          <p class="text-xs text-charcoal/50 mt-1">Upload bKash/Nagad payment screenshot</p>
        </div>
        <button type="submit" class="btn-primary w-full py-3.5 rounded-xl font-semibold">Submit Payment</button>
        <p id="formStatus" class="text-sm text-center hidden"></p>
      </form>
    </div>

    <!-- Payment History -->
    <div class="bg-white rounded-2xl p-6 border border-primary/5">
      <h3 class="text-lg font-bold text-primary mb-4">Payment History</h3>
      <div id="historyList">
        ${(!payments || payments.length === 0) ? '<p class="text-charcoal/60 text-sm text-center py-6">No payments yet</p>' : payments.map(p => {
          const course = (courses || []).find(c => c.id === p.course_id);
          const date = new Date(p.created_at).toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' });
          const statusColor = p.status === 'verified' ? 'bg-green-100 text-green-700' : p.status === 'pending' ? 'bg-yellow-100 text-yellow-700' : 'bg-red-100 text-red-700';
          return `
            <div class="flex items-center justify-between py-4 border-b border-primary/10 last:border-0">
              <div>
                <p class="font-semibold text-primary text-sm">${course?.title || 'Course Payment'}</p>
                <p class="text-xs text-charcoal/60 mt-1">${p.method?.toUpperCase() || 'N/A'} • ${p.transaction_id || 'N/A'} • ${date}</p>
              </div>
              <div class="text-right">
                <p class="font-bold text-primary">৳${p.amount}</p>
                <span class="inline-block text-xs px-2 py-0.5 rounded-full ${statusColor} mt-1">${p.status}</span>
              </div>
            </div>
          `;
        }).join('')}
      </div>
    </div>
  `;

  // Course select change → autofill amount
  document.getElementById('courseSelect').addEventListener('change', (e) => {
    const price = e.target.selectedOptions[0]?.dataset.price;
    if (price) document.getElementById('amount').value = price;
  });

  // Form submit
  document.getElementById('paymentForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = e.target.querySelector('button[type="submit"]');
    const status = document.getElementById('formStatus');
    btn.disabled = true;
    btn.textContent = 'Submitting...';

    let screenshotUrl = null;
    const screenshotFile = document.getElementById('screenshotInput')?.files[0];
    if (screenshotFile) {
      const ext = screenshotFile.name.split('.').pop().toLowerCase();
      const path = user.id + '/' + Date.now() + '.' + ext;
      const { error: upErr } = await db.storage.from('payments').upload(path, screenshotFile);
      if (!upErr) {
        const { data: urlData } = db.storage.from('payments').getPublicUrl(path);
        screenshotUrl = urlData.publicUrl;
      }
    }

    const payload = {
      student_id: user.id,
      screenshot_url: screenshotUrl,
      course_id: document.getElementById('courseSelect').value,
      amount: Number(document.getElementById('amount').value),
      method: document.getElementById('method').value,
      transaction_id: document.getElementById('transactionId').value.trim().toUpperCase(),
      status: 'pending'
    };

    const { error } = await db.from('payments').insert(payload);

    if (window.Notif) {
      window.Notif.toAdmins(
        'New Payment Submitted',
        fullName + ' submitted ' + payload.amount + ' via ' + payload.method.toUpperCase(),
        'payment',
        '/admin/payments.html'
      ).catch(() => {});
    }

    if (error) {
      status.textContent = 'Error: ' + error.message;
      status.className = 'text-sm text-center text-red-600';
      status.classList.remove('hidden');
      btn.disabled = false;
      btn.textContent = 'Submit Payment';
      return;
    }

    status.textContent = '✓ Payment submitted! Admin will verify soon.';
    status.className = 'text-sm text-center text-green-600';
    status.classList.remove('hidden');
    btn.textContent = 'Submitted!';
    setTimeout(() => location.reload(), 2000);
  });
  // Auto-load plan from signup
  const signupPlanId = localStorage.getItem('selectedPlanId');
  if (signupPlanId) {
    const { data: signupPlan } = await db.from('pricing_plans').select('*').eq('id', signupPlanId).single();
    if (signupPlan) {
      document.getElementById('amount').value = signupPlan.price_bdt;
    }
  }
})();
</script>

<script src="../assets/js/notifications.js"></script>
<script src="../assets/js/inject-bell.js"></script>
</body>
</html>
