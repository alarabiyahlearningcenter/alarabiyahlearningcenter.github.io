<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Plan | Al-Arabiyah Learning Center</title>
<meta name="theme-color" content="#0A3622">
<link rel="manifest" href="../manifest.json">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body{font-family:'Inter',sans-serif;background:#F9F7F2}
h1,h2,h3,h4{font-family:'Playfair Display',serif}
.btn-primary{background:#0A3622;color:white;transition:.2s}
.btn-primary:hover{background:#062218}
.btn-green{background:#16a34a;color:white}
.btn-green:hover{background:#15803d}
.card-hover{transition:.3s}
.card-hover:hover{box-shadow:0 12px 24px rgba(10,54,34,.1)}
.plan-active{background:linear-gradient(135deg,#0A3622 0%,#062218 100%);color:white;border:3px solid #D4AF37}
.badge{font-size:11px;font-weight:600;padding:3px 10px;border-radius:999px}
</style>
</head>
<body class="bg-cream text-charcoal min-h-screen">

<header class="sticky top-0 z-40 bg-white border-b border-primary/10">
  <div class="px-4 py-3 flex items-center justify-between">
    <div class="flex items-center gap-3">
      <button id="sidebarToggle" class="lg:hidden p-2 text-primary">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/></svg>
      </button>
      <a href="../index.html" class="flex items-center gap-2">
        <img src="../assets/images/logo.png" alt="Al-Arabiyah" class="w-10 h-10 rounded-full border-2 border-secondary object-cover">
        <div class="hidden sm:block">
          <div class="font-heading font-bold text-primary text-sm leading-tight">Al-Arabiyah</div>
          <div class="text-xs text-primary/70">Learning Center</div>
        </div>
      </a>
    </div>
    <div class="flex items-center gap-3">
      <a href="dashboard.html" class="text-sm text-primary font-medium hover:text-secondary">← Dashboard</a>
      <div id="notifBellContainer"></div>
      <div class="relative">
        <button id="userMenuBtn" class="flex items-center gap-2 p-1 rounded-full hover:bg-primary/5">
          <div id="avatar" class="w-9 h-9 rounded-full bg-primary flex items-center justify-center text-secondary font-bold">S</div>
        </button>
        <div id="userMenu" class="hidden absolute right-0 mt-2 w-48 bg-white rounded-xl shadow-lg border border-primary/10 py-2">
          <div class="px-4 py-2 border-b border-primary/10">
            <p id="userName" class="text-sm font-semibold text-primary">Student</p>
            <p id="userEmail" class="text-xs text-charcoal/60 truncate">student@email.com</p>
          </div>
          <button id="logoutBtn" class="w-full text-left px-4 py-2 text-sm text-red-600 hover:bg-red-50">Logout</button>
        </div>
      </div>
    </div>
  </div>
</header>

<div class="flex">
  <aside id="sidebar" class="fixed lg:sticky top-0 lg:top-[60px] left-0 z-30 w-64 h-screen lg:h-[calc(100vh-60px)] bg-white border-r border-primary/10 transform -translate-x-full lg:translate-x-0 transition-transform overflow-y-auto">
    <div class="p-4">
      <div class="lg:hidden flex justify-end mb-2">
        <button id="sidebarClose" class="p-1 text-charcoal/50">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
        </button>
      </div>
      <nav class="space-y-1">
        <a href="dashboard.html" class="flex items-center gap-3 px-4 py-3 rounded-lg text-charcoal/70 hover:bg-secondary/10">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
          Dashboard
        </a>
        <a href="my-courses.html" class="flex items-center gap-3 px-4 py-3 rounded-lg text-charcoal/70 hover:bg-secondary/10">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"/></svg>
          My Courses
        </a>
        <a href="my-plan.html" class="flex items-center gap-3 px-4 py-3 rounded-lg bg-secondary/15 text-primary font-medium border-l-3 border-secondary">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4M7.835 4.697a3.42 3.42 0 001.946-.806 3.42 3.42 0 014.438 0 3.42 3.42 0 001.946.806 3.42 3.42 0 013.138 3.138 3.42 3.42 0 00.806 1.946 3.42 3.42 0 010 4.438 3.42 3.42 0 00-.806 1.946 3.42 3.42 0 01-3.138 3.138 3.42 3.42 0 00-1.946.806 3.42 3.42 0 01-4.438 0 3.42 3.42 0 00-1.946-.806 3.42 3.42 0 01-3.138-3.138 3.42 3.42 0 00-.806-1.946 3.42 3.42 0 010-4.438 3.42 3.42 0 00.806-1.946 3.42 3.42 0 013.138-3.138z"/></svg>
          My Plan
        </a>
        <a href="book-class.html" class="flex items-center gap-3 px-4 py-3 rounded-lg text-charcoal/70 hover:bg-secondary/10">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>
          Book a Class
        </a>
        <a href="live-class.html" class="flex items-center gap-3 px-4 py-3 rounded-lg text-charcoal/70 hover:bg-secondary/10">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"/></svg>
          My Live Classes
        </a>
        <a href="payment.html" class="flex items-center gap-3 px-4 py-3 rounded-lg text-charcoal/70 hover:bg-secondary/10">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 10h18M7 15h1m4 0h1m-7 4h12a3 3 0 003-3V8a3 3 0 00-3-3H6a3 3 0 00-3 3v8a3 3 0 003 3z"/></svg>
          Payments
        </a>
        <a href="certificate.html" class="flex items-center gap-3 px-4 py-3 rounded-lg text-charcoal/70 hover:bg-secondary/10">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
          Certificates
        </a>
        <a href="profile.html" class="flex items-center gap-3 px-4 py-3 rounded-lg text-charcoal/70 hover:bg-secondary/10">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
          My Profile
        </a>
      </nav>
    </div>
  </aside>

  <div id="sidebarOverlay" class="hidden lg:hidden fixed inset-0 bg-black/50 z-20"></div>

  <main class="flex-1 min-w-0 p-4 md:p-6 lg:p-8">
    <div class="mb-6">
      <h1 class="text-2xl md:text-3xl font-bold text-primary mb-1">My Plan</h1>
      <p class="text-charcoal/60 text-sm">View and manage your subscription</p>
    </div>

    <div id="loading" class="text-center py-20">
      <div class="inline-block animate-spin rounded-full h-8 w-8 border-4 border-primary/20 border-t-primary"></div>
    </div>

    <div id="planContent" class="hidden"></div>
  </main>
</div>

<script src="../assets/js/supabase-config.js"></script>
<script src="../assets/js/notifications.js"></script>
<script src="../assets/js/inject-bell.js"></script>
<script>
(async () => {
  let tries = 0;
  while (!window.db && tries < 50) { await new Promise(r => setTimeout(r, 100)); tries++; }
  if (!window.db) return;
  const db = window.db;

  // Sidebar
  document.getElementById('sidebarToggle').addEventListener('click', () => {
    document.getElementById('sidebar').classList.remove('-translate-x-full');
    document.getElementById('sidebarOverlay').classList.remove('hidden');
  });
  document.getElementById('sidebarClose').addEventListener('click', () => {
    document.getElementById('sidebar').classList.add('-translate-x-full');
    document.getElementById('sidebarOverlay').classList.add('hidden');
  });
  document.getElementById('sidebarOverlay').addEventListener('click', () => {
    document.getElementById('sidebar').classList.add('-translate-x-full');
    document.getElementById('sidebarOverlay').classList.add('hidden');
  });
  document.getElementById('userMenuBtn').addEventListener('click', (e) => {
    e.stopPropagation();
    document.getElementById('userMenu').classList.toggle('hidden');
  });
  document.addEventListener('click', () => document.getElementById('userMenu').classList.add('hidden'));
  document.getElementById('logoutBtn').addEventListener('click', async () => {
    await db.auth.signOut();
    window.location.href = '../auth/login.html';
  });

  // Auth
  const { data: { session } } = await db.auth.getSession();
  if (!session) { window.location.href = '../auth/login.html'; return; }

  const { data: profile } = await db.from('profiles').select('*').eq('id', session.user.id).single();
  const fullName = profile?.full_name || session.user.email.split('@')[0];
  document.getElementById('userName').textContent = fullName;
  document.getElementById('userEmail').textContent = session.user.email;
  document.getElementById('avatar').textContent = fullName.charAt(0).toUpperCase();

  const loading = document.getElementById('loading');
  const content = document.getElementById('planContent');

  // Fetch active enrollment with plan
  const { data: enrollment } = await db
    .from('enrollments')
    .select('*')
    .eq('student_id', session.user.id)
    .eq('status', 'active')
    .order('started_at', { ascending: false })
    .limit(1)
    .maybeSingle();

  loading.classList.add('hidden');
  content.classList.remove('hidden');

  if (!enrollment) {
    // No active plan — show empty state
    content.innerHTML = `
      <div class="bg-white rounded-3xl p-10 border border-primary/5 text-center">
        <div class="w-20 h-20 bg-primary/10 rounded-full flex items-center justify-center mx-auto mb-4">
          <svg class="w-10 h-10 text-primary" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4M7.835 4.697a3.42 3.42 0 001.946-.806 3.42 3.42 0 014.438 0 3.42 3.42 0 001.946.806 3.42 3.42 0 013.138 3.138 3.42 3.42 0 00.806 1.946 3.42 3.42 0 010 4.438 3.42 3.42 0 00-.806 1.946 3.42 3.42 0 01-3.138 3.138 3.42 3.42 0 00-1.946.806 3.42 3.42 0 01-4.438 0 3.42 3.42 0 00-1.946-.806 3.42 3.42 0 01-3.138-3.138 3.42 3.42 0 00-.806-1.946 3.42 3.42 0 010-4.438 3.42 3.42 0 00.806-1.946 3.42 3.42 0 013.138-3.138z"/></svg>
        </div>
        <h3 class="text-xl font-bold text-primary mb-2">No Active Plan</h3>
        <p class="text-charcoal/60 text-sm mb-6 max-w-md mx-auto">You don't have an active subscription yet. Choose a plan to start your Qur'an learning journey.</p>
        <div class="flex flex-col sm:flex-row gap-3 justify-center">
          <a href="../pricing.html" class="btn-primary px-6 py-3 rounded-full font-semibold">View Plans</a>
          <a href="../free-assessment.html" class="border-2 border-primary text-primary px-6 py-3 rounded-full font-semibold hover:bg-primary hover:text-white transition">Free Trial</a>
        </div>
      </div>
    `;
    return;
  }

  // Load plan details
  let plan = null;
  if (enrollment.plan_id) {
    const { data: p } = await db.from('pricing_plans').select('*').eq('id', enrollment.plan_id).single();
    plan = p;
  }
  const { data: course } = enrollment.course_id
    ? await db.from('courses').select('title').eq('id', enrollment.course_id).single()
    : { data: null };

  const startDate = new Date(enrollment.started_at);
  const nextBilling = new Date(startDate);
  nextBilling.setMonth(nextBilling.getMonth() + 1);
  const daysLeft = Math.max(0, Math.ceil((nextBilling - new Date()) / (1000 * 60 * 60 * 24)));

  const planName = plan?.name || 'Custom Plan';
  const duration = plan?.duration_min || '?';
  const classes = plan?.classes_per_month || 12;
  const priceBdt = plan?.price_bdt || 0;
  const priceUsd = plan?.price_usd || 0;

  content.innerHTML = `
    <div class="max-w-3xl space-y-6">

      <!-- Active Plan Card -->
      <div class="plan-active rounded-3xl p-6 md:p-8 relative overflow-hidden">
        <div class="flex items-start justify-between mb-6 flex-wrap gap-3">
          <div>
            <span class="badge" style="background:#D4AF37;color:#0A3622;">ACTIVE</span>
            <h2 class="text-3xl font-bold mt-3" style="color:#D4AF37;">${planName}</h2>
            <p class="text-white/70 text-sm mt-1">${course?.title || 'General Qur\'an Learning'}</p>
          </div>
          <div class="text-right">
            <p class="text-3xl font-bold" style="color:#D4AF37;">৳${Number(priceBdt).toLocaleString()}</p>
            ${priceUsd ? `<p class="text-white/60 text-sm">$${priceUsd}</p>` : ''}
            <p class="text-white/60 text-xs mt-1">per month</p>
          </div>
        </div>

        <div class="grid grid-cols-3 gap-4 pt-6 border-t border-white/20">
          <div>
            <p class="text-white/60 text-xs mb-1">Duration</p>
            <p class="text-white font-bold">${duration} min</p>
          </div>
          <div>
            <p class="text-white/60 text-xs mb-1">Classes / Month</p>
            <p class="text-white font-bold">${classes}</p>
          </div>
          <div>
            <p class="text-white/60 text-xs mb-1">Started</p>
            <p class="text-white font-bold">${startDate.toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' })}</p>
          </div>
        </div>
      </div>

      <!-- Billing Status -->
      <div class="bg-white rounded-2xl p-6 border border-primary/5">
        <h3 class="font-bold text-primary mb-4">Billing Status</h3>
        <div class="flex items-center justify-between mb-3">
          <p class="text-sm text-charcoal/70">Next billing date</p>
          <p class="text-sm font-semibold text-primary">${nextBilling.toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' })}</p>
        </div>
        <div class="w-full bg-cream rounded-full h-2 mb-2">
          <div class="h-2 rounded-full transition-all ${daysLeft < 7 ? 'bg-red-500' : 'bg-secondary'}" style="width:${Math.min(100, Math.max(0, (30 - daysLeft) / 30 * 100))}%"></div>
        </div>
        <p class="text-xs text-charcoal/60">${daysLeft > 0 ? `${daysLeft} days remaining in current cycle` : 'Renewal due today'}</p>
      </div>

      <!-- Quick Actions -->
      <div class="grid grid-cols-2 md:grid-cols-4 gap-3">
        <a href="book-class.html" class="bg-white p-4 rounded-2xl text-center border border-primary/5 card-hover">
          <svg class="w-6 h-6 text-primary mx-auto mb-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>
          <p class="text-xs font-semibold text-primary">Book Class</p>
        </a>
        <a href="live-class.html" class="bg-white p-4 rounded-2xl text-center border border-primary/5 card-hover">
          <svg class="w-6 h-6 text-primary mx-auto mb-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"/></svg>
          <p class="text-xs font-semibold text-primary">Live Class</p>
        </a>
        <a href="payment.html" class="bg-white p-4 rounded-2xl text-center border border-primary/5 card-hover">
          <svg class="w-6 h-6 text-primary mx-auto mb-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 10h18M7 15h1m4 0h1m-7 4h12a3 3 0 003-3V8a3 3 0 00-3-3H6a3 3 0 00-3 3v8a3 3 0 003 3z"/></svg>
          <p class="text-xs font-semibold text-primary">Pay Now</p>
        </a>
        <a href="../pricing.html" class="bg-white p-4 rounded-2xl text-center border border-primary/5 card-hover">
          <svg class="w-6 h-6 text-primary mx-auto mb-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>
          <p class="text-xs font-semibold text-primary">Upgrade</p>
        </a>
      </div>

      <!-- Change Plan -->
      <div class="bg-gradient-to-br from-primary to-primary-dark rounded-2xl p-6 text-white">
        <h3 class="font-bold mb-2">Want to change your plan?</h3>
        <p class="text-white/70 text-sm mb-4">Upgrade to a longer duration, add more classes, or switch to a custom plan anytime.</p>
        <div class="flex flex-col sm:flex-row gap-3">
          <a href="../pricing.html" class="bg-secondary text-primary px-6 py-2.5 rounded-full font-semibold text-sm text-center">View All Plans</a>
          <a href="../pricing.html#custom" class="border-2 border-white text-white px-6 py-2.5 rounded-full font-semibold text-sm text-center hover:bg-white hover:text-primary transition">Request Custom Plan</a>
        </div>
      </div>
    </div>
  `;
})();
</script>

</body>
</html>
