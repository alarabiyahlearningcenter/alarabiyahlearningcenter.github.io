<!DOCTYPE html>

        .btn-primary:hover { background: #062418; }
        .btn-secondary { background: #d4af37; color: #0A3622; }
        .btn-secondary:hover { background: #b8932e; }
    </style>
</head>
<body class="bg-cream text-charcoal min-h-screen">
  <div id="diagPanel" style="position:fixed;top:0;left:0;right:0;z-index:99999;background:#000;color:#0f0;padding:8px;font-family:monospace;font-size:10px;max-height:30vh;overflow:auto;display:none;"></div>
  <button id="diagToggle" style="position:fixed;bottom:8px;right:8px;z-index:100000;background:#0A3622;color:#0f0;border:1px solid #0f0;padding:4px 8px;font-size:10px;border-radius:4px;opacity:0.3;">DIAG</button>

    <div id="admin-shell"></div>

    <div id="page-content" class="hidden p-4 md:p-6 max-w-6xl mx-auto">
        <div class="mb-6">
            <a href="dashboard.html" class="text-primary text-sm font-semibold hover:underline">← Back to Dashboard</a>
            <h1 class="text-2xl md:text-3xl font-bold text-primary mt-2 mb-1">Select Your Teacher</h1>
            <p class="text-charcoal/60 text-sm">Choose a teacher for each course. Admin will approve your selection.</p>
        </div>

        <div id="loading" class="text-center py-12">
            <div class="inline-block w-8 h-8 border-4 border-primary/30 border-t-primary rounded-full animate-spin"></div>
            <p class="text-charcoal/60 text-sm mt-3">Loading courses...</p>
        </div>

        <div id="coursesContainer" class="space-y-6"></div>
    </div>

    <div id="teacherModal" class="hidden fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl max-w-3xl w-full max-h-[90vh] overflow-y-auto">
            <div class="sticky top-0 bg-white border-b border-primary/10 p-5 flex items-center justify-between">
                <div>
                    <h3 class="text-xl font-bold text-primary">Choose a Teacher</h3>
                    <p class="text-charcoal/60 text-xs mt-1" id="modalCourseName"></p>
                </div>
                <button onclick="closeTeacherModal()" class="text-charcoal/60 hover:text-primary text-2xl">×</button>
            </div>
            <div id="teachersList" class="p-5 space-y-3"></div>
        </div>
    </div>

    <div id="confirmModal" class="hidden fixed inset-0 bg-black/60 z-[60] flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl max-w-md w-full p-6">
            <div class="text-center mb-5">
                <div class="w-16 h-16 rounded-full bg-yellow-100 flex items-center justify-center mx-auto mb-3">
                    <span class="text-3xl">⚠️</span>
                </div>
                <h3 class="text-xl font-bold text-primary mb-2">Confirm Teacher Selection</h3>
                <p class="text-charcoal/70 text-sm">আপনি কি এই teacher কে select করতে চান? Admin approval এর জন্য request যাবে।</p>
            </div>
            <div id="confirmTeacherInfo" class="bg-cream rounded-xl p-4 mb-5"></div>
            <div class="flex gap-3">
                <button onclick="closeConfirmModal()" class="flex-1 py-2.5 rounded-xl border-2 border-primary/20 text-charcoal font-semibold text-sm hover:bg-cream transition">Cancel</button>
                <button id="confirmBtn" onclick="confirmSelection(event)" class="flex-1 py-2.5 rounded-xl btn-primary font-semibold text-sm">✓ Confirm</button>
            </div>
        </div>
    </div>

    <script>
    const SUPABASE_URL = 'https://vgsgisyneymtszuslftb.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZnc2dpc3luZXltdHN6dXNsZnRiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA0NTg0NjQsImV4cCI6MjEwNjAzNDQ2NH0.HaYptmVnZCbGiOCg1NyYkcdHQDqjXlAHeq_i_bTC6Yk';
    const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
window.db = db; // F-017: expose globally for notifications.js

    let currentUser = null;
    let currentCourseForSelection = null;
    let selectedTeacherForConfirm = null;

    async function init() {
      // DEBUG-VAR: dump URL/key lengths and exact URL used
      try {
        var el = document.getElementById('diagPanel');
        if (el) {
          el.innerHTML += '<div>URL length: ' + (SUPABASE_URL ? SUPABASE_URL.length : 'NULL') + '</div>';
          el.innerHTML += '<div>URL chars: ' + JSON.stringify(SUPABASE_URL) + '</div>';
          el.innerHTML += '<div>KEY length: ' + (SUPABASE_ANON_KEY ? SUPABASE_ANON_KEY.length : 'NULL') + '</div>';
          el.innerHTML += '<div>KEY start: ' + (SUPABASE_ANON_KEY ? SUPABASE_ANON_KEY.substring(0, 40) : 'NULL') + '</div>';
          el.innerHTML += '<div>KEY end: ' + (SUPABASE_ANON_KEY ? SUPABASE_ANON_KEY.substring(SUPABASE_ANON_KEY.length - 20) : 'NULL') + '</div>';
          var testUrl = SUPABASE_URL + '/rest/v1/enrollments?select=id&limit=1';
          el.innerHTML += '<div>Test URL: ' + testUrl + '</div>';
          el.innerHTML += '<div>URL byte length: ' + testUrl.length + '</div>';
        }
      } catch (e) { console.log('DEBUG-VAR error', e); }

    // F-036: Robust session detection — localStorage first, then getSession retries
      let user = null;

      // Method 1: localStorage directly (synchronous, most reliable)
      try {
        const raw = localStorage.getItem('sb-vgsgisyneymtszuslftb-auth-token');
        if (raw) {
          const parsed = JSON.parse(raw);
          if (parsed && parsed.user) {
            user = parsed.user;
            console.log('[select-teacher] session from localStorage');
          }
        }
      } catch (e) { console.warn('[select-teacher] localStorage parse failed:', e); }

      // Method 2: supabase getSession (with retries)
      if (!user) {
        for (let i = 0; i < 15; i++) {
          try {
            const res = await db.auth.getSession();
            if (res && res.data && res.data.session && res.data.session.user) {
              user = res.data.session.user;
              console.log('[select-teacher] session from getSession attempt', i + 1);
              break;
            }
          } catch (e) { console.warn('[select-teacher] getSession attempt', i + 1, 'failed:', e); }
          await new Promise(r => setTimeout(r, 250));
        }
      }

      if (!user) {
        console.warn('[select-teacher] No session — redirecting to login');
        window.location.href = '../auth/login.html';
        return;
      }
      currentUser = user;

        document.getElementById('page-content').classList.remove('hidden');
        await loadCoursesAndAssignments();
    }

    function diag(msg) {
      var el = document.getElementById('diagPanel');
      if (el) el.innerHTML += '<div>' + msg + '</div>';
      console.log('[DIAG]', msg);
    }

    async function loadCoursesAndAssignments() {
      diag('BUILD: F-040-v7');
      diag('currentUser.id: ' + (currentUser ? currentUser.id : 'NULL'));
      diag('currentUser.email: ' + (currentUser ? currentUser.email : 'NULL'));

      diag('--- TEST A: apikey only ---');
      try {
        var _k = SUPABASE_ANON_KEY;
        var _r1 = await fetch(SUPABASE_URL + '/rest/v1/enrollments?select=id&limit=1', {
          headers: { 'apikey': _k }
        });
        diag('A status: ' + _r1.status);
        var _b1 = await _r1.text();
        diag('A body: ' + _b1.substring(0, 100));
      } catch (e) { diag('A ERROR: ' + e.message); }

      diag('--- TEST B: apikey + Authorization ---');
      try {
        var _sess = await db.auth.getSession();
        var _tok = _sess && _sess.data && _sess.data.session ? _sess.data.session.access_token : null;
        diag('token present: ' + (!!_tok));
        var _r2 = await fetch(SUPABASE_URL + '/rest/v1/enrollments?select=id&limit=1', {
          headers: { 'apikey': _k, 'Authorization': 'Bearer ' + _tok }
        });
        diag('B status: ' + _r2.status);
        var _b2 = await _r2.text();
        diag('B body: ' + _b2.substring(0, 100));
      } catch (e) { diag('B ERROR: ' + e.message); }
      diag('--- end tests ---');

      // F-036c: raw fetch test — bypass supabase-js entirely
      diag('--- raw fetch test ---');
      try {
        const _url = 'https://vgsgisyneymtszuslftb.supabase.co/rest/v1/enrollments?select=*&student_id=eq.' + currentUser.id;
        diag('fetching: ' + _url.substring(0, 80) + '...');
        const _rawRes = await fetch(_url, {
          headers: { 'apikey': 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZnc2dpc3luZXltdHN6dXNsZnRiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3MzI3OTg3NDUsImV4cCI6MjA0ODM3NDc0NX0.5kI7GvLw6eoDTLTQlvIPc1f5j4DWMVp4v3P6CwFhKB8' }
        });
        diag('raw status: ' + _rawRes.status);
        const _txt = await _rawRes.text();
        diag('raw body len: ' + _txt.length);
        diag('raw body: ' + _txt.substring(0, 150));
      } catch (_e) {
        diag('raw fetch ERROR: ' + _e.message);
      }
      diag('--- end raw test ---');
      console.log('[DIAG] currentUser:', currentUser ? currentUser.id : 'NULL');
      console.log('[DIAG] currentUser email:', currentUser ? currentUser.email : 'NULL');
        document.getElementById('loading').classList.remove('hidden');

        // Fetch student's active enrollments with course info
        const { data: enrollments, error: enrollErr } = await db
            .from('enrollments')
            .select('*')
            .eq('student_id', currentUser.id)
            .order('started_at', { ascending: false });

        console.log('[DIAG] enrollErr:', enrollErr);
      console.log('[DIAG] enrollments:', enrollments);

      diag('enrollErr: ' + JSON.stringify(enrollErr));
      diag('enrollments.length: ' + (enrollments ? enrollments.length : 'null'));
      diag('enrollments: ' + JSON.stringify(enrollments));

            // F-036b: filter status in JS (server-side .in() caused Failed to fetch)
      const _filteredEnrollments = (enrollments || []).filter(function(e) {
        return e.status === 'active' || e.status === 'completed';
      });
      diag('filtered: ' + _filteredEnrollments.length);
      if (enrollments) { enrollments.length = 0; Array.prototype.push.apply(enrollments, _filteredEnrollments); }

      if (enrollErr || !enrollments || enrollments.length === 0) {
            document.getElementById('loading').innerHTML = '<p class="text-center text-charcoal/60 py-12">No enrolled courses yet. <a href="payment.html" class="text-primary font-semibold hover:underline">Make a payment first →</a></p>';
            return;
        }

        // Deduplicate by course_id
        const uniqueCourses = [];
        const seen = new Set();
        for (const e of enrollments) {
            if (!e.course_id || seen.has(e.course_id)) continue;
            seen.add(e.course_id);
            uniqueCourses.push(e);
        }

        // Get course titles
        const courseIds = uniqueCourses.map(e => e.course_id);
        // COURSES-DIAG
      diag('courseIds count: ' + courseIds.length);
      diag('courseIds[0]: ' + courseIds[0]);
      const { data: courses, error: coursesErr } = await db.from('courses').select('id, title, description').in('id', courseIds);
      diag('coursesErr: ' + JSON.stringify(coursesErr));
      diag('courses.length: ' + (courses ? courses.length : 'null'));
        const courseMap = {};
        (courses || []).forEach(c => courseMap[c.id] = c);

        // Get existing teacher assignments
        const { data: assignments } = await db
            .from('student_teacher_assignments')
            .select('id, course_id, teacher_id, status')
            .eq('student_id', currentUser.id)
            .in('course_id', courseIds);

        const assignmentMap = {};
        (assignments || []).forEach(a => assignmentMap[a.course_id] = a);

        // Get teacher names for existing assignments
        const teacherIds = (assignments || []).map(a => a.teacher_id).filter(Boolean);
        let teacherMap = {};
        if (teacherIds.length) {
            const { data: teachers } = await db.from('profiles').select('id, full_name, email').in('id', teacherIds);
            (teachers || []).forEach(t => teacherMap[t.id] = t);
        }

        document.getElementById('loading').classList.add('hidden');
        try {
        diag('--- before renderCourses ---');
        renderCourses(uniqueCourses, courseMap, assignmentMap, teacherMap);
        diag('--- after renderCourses ---');
      } catch (_re) {
        diag('renderCourses EXCEPTION: ' + _re.message);
        diag('stack: ' + (_re.stack || '').substring(0, 200));
      }
    }

    function renderCourses(enrollments, courseMap, assignmentMap, teacherMap) {
    // RENDER-DIAG
    try {
      diag('--- renderCourses called ---');
      diag('enrollments: ' + (enrollments ? enrollments.length : 'null'));
      diag('courseMap keys: ' + Object.keys(courseMap || {}).length);
      diag('assignmentMap keys: ' + Object.keys(assignmentMap || {}).length);
      const _c = document.getElementById('coursesContainer');
      diag('container found: ' + (!!_c));
      diag('container class: ' + (_c ? _c.className : 'N/A'));
    } catch (e) { diag('RENDER-DIAG err: ' + e.message); }
        const container = document.getElementById('coursesContainer');

        container.innerHTML = enrollments.map(e => {
            const course = courseMap[e.course_id] || { title: 'Unknown Course' };
            const assignment = assignmentMap[e.course_id];

            let statusHtml = '';
            let buttonHtml = '';

            if (!assignment) {
                statusHtml = '<span class="text-xs px-3 py-1 rounded-full bg-yellow-100 text-yellow-700 font-semibold">NO TEACHER</span>';
                buttonHtml = `<button onclick="openTeacherModal('${e.course_id}', '${course.title.replace(/'/g, "\\'")}')" class="btn-primary px-5 py-2.5 rounded-xl text-sm font-semibold mt-3 w-full">Choose Teacher →</button>`;
            } else if (assignment.status === 'pending') {
                statusHtml = '<span class="text-xs px-3 py-1 rounded-full bg-blue-100 text-blue-700 font-semibold">PENDING APPROVAL</span>';
                buttonHtml = '<p class="text-xs text-charcoal/60 mt-3 italic">Admin approval এর জন্য অপেক্ষা করছেন</p>';
            } else if (assignment.status === 'active') {
                const teacher = teacherMap[assignment.teacher_id] || {};
                statusHtml = '<span class="text-xs px-3 py-1 rounded-full bg-green-100 text-green-700 font-semibold">✓ ASSIGNED</span>';
                buttonHtml = `<div class="mt-3 bg-cream rounded-xl p-3">
                    <p class="text-xs text-charcoal/60 mb-1">Your Teacher</p>
                    <p class="text-sm font-semibold text-primary">${teacher.full_name || 'Teacher'}</p>
                    <p class="text-xs text-charcoal/60">${teacher.email || ''}</p>
                </div>
                <button onclick="requestChange('${e.course_id}', '${course.title.replace(/'/g, "\\'")}', '${assignment.teacher_id}')" class="mt-3 w-full py-2 rounded-xl border-2 border-red-200 text-red-600 text-sm font-semibold hover:bg-red-50 transition">Request Change</button>`;
            } else if (assignment.status === 'rejected') {
                statusHtml = '<span class="text-xs px-3 py-1 rounded-full bg-red-100 text-red-700 font-semibold">REJECTED</span>';
                buttonHtml = `<button onclick="openTeacherModal('${e.course_id}', '${course.title.replace(/'/g, "\\'")}')" class="btn-primary px-5 py-2.5 rounded-xl text-sm font-semibold mt-3 w-full">Choose Another Teacher →</button>`;
            }

            return `<div class="bg-white rounded-2xl p-5 border border-primary/10 shadow-sm">
                <div class="flex items-start justify-between gap-3 mb-2">
                    <h3 class="text-lg font-bold text-primary">${course.title}</h3>
                    ${statusHtml}
                </div>
                <p class="text-sm text-charcoal/60">${course.description || ''}</p>
                ${buttonHtml}
            </div>`;
        }).join('');
    }

    async function openTeacherModal(courseId, courseTitle) {
        currentCourseForSelection = { course_id: courseId, title: courseTitle };
        document.getElementById('modalCourseName').textContent = courseTitle;
        document.getElementById('teachersList').innerHTML = '<p class="text-center text-charcoal/60 py-8">Loading teachers...</p>';
        document.getElementById('teacherModal').classList.remove('hidden');

        // F-039-FIX: Only show teachers with active record in 'teachers' table
        const { data: activeTeacherRecs } = await db
          .from('teachers')
          .select('profile_id')
          .eq('is_active', true);

        const activeProfileIds = (activeTeacherRecs || []).map(function(r) { return r.profile_id; }).filter(Boolean);
        diag('active teacher count: ' + activeProfileIds.length);

        if (!activeProfileIds.length) {
          document.getElementById('teachersList').innerHTML = '<p class="text-center text-charcoal/60 py-8">No teachers available right now.</p>';
          return;
        }

        const { data: teachers, error } = await db
          .from('profiles')
          .select('id, full_name, email, role')
          .in('id', activeProfileIds)
          .eq('role', 'teacher');

        if (error || !teachers || teachers.length === 0) {
            document.getElementById('teachersList').innerHTML = '<p class="text-center text-charcoal/60 py-8">No teachers available right now.</p>';
            return;
        }

        document.getElementById('teachersList').innerHTML = teachers.map(t => `
            <div class="border border-primary/15 rounded-xl p-4 hover:border-primary/40 transition">
                <div class="flex items-center gap-3">
                    <div class="w-12 h-12 rounded-full bg-primary text-white flex items-center justify-center font-bold text-lg">${(t.full_name || t.email || 'T').charAt(0).toUpperCase()}</div>
                    <div class="flex-1 min-w-0">
                        <p class="font-semibold text-primary truncate">${t.full_name || 'Teacher'}</p>
                        <p class="text-xs text-charcoal/60 truncate">${t.email || ''}</p>
                    </div>
                    <button onclick="selectTeacher('${t.id}', '${(t.full_name || '').replace(/'/g, "\\'")}', '${t.email || ''}')" class="btn-primary px-4 py-2 rounded-lg text-xs font-semibold">Select</button>
                </div>
            </div>
        `).join('');
    }

    function closeTeacherModal() {
        document.getElementById('teacherModal').classList.add('hidden');
        // F-040-FIX: do NOT reset currentCourseForSelection here — needed by confirmSelection()
        // (reset happens in closeConfirmModal instead)
    }

    function selectTeacher(teacherId, teacherName, teacherEmail) {
        selectedTeacherForConfirm = { id: teacherId, name: teacherName, email: teacherEmail };

        document.getElementById('confirmTeacherInfo').innerHTML = `
            <p class="text-xs text-charcoal/60 mb-2">Selected Teacher</p>
            <p class="font-semibold text-primary">${teacherName}</p>
            <p class="text-xs text-charcoal/60">${teacherEmail}</p>
            <p class="text-xs text-charcoal/60 mt-3">Course: <strong>${currentCourseForSelection.title}</strong></p>
        `;

        closeTeacherModal();
        document.getElementById('confirmModal').classList.remove('hidden');
    }

    function closeConfirmModal() {
        document.getElementById('confirmModal').classList.add('hidden');
        selectedTeacherForConfirm = null;
        currentCourseForSelection = null;
    }

    async function confirmSelection(evt) {
        diag('--- confirmSelection called ---');
        diag('teacher: ' + (selectedTeacherForConfirm ? selectedTeacherForConfirm.id : 'null'));
        diag('course: ' + (currentCourseForSelection ? currentCourseForSelection.course_id : 'null'));
        if (!selectedTeacherForConfirm || !currentCourseForSelection) return;

        const btn = (typeof event !== 'undefined' && event && event.target) ? event.target : document.getElementById('confirmBtn');
        btn.disabled = true;
        btn.textContent = 'Saving...';

        const { error } = await db.from('student_teacher_assignments').insert({
            student_id: currentUser.id,
            course_id: currentCourseForSelection.course_id,
            teacher_id: selectedTeacherForConfirm.id,
            assigned_by: 'student',
            status: 'pending'
        });
        diag('insert error: ' + JSON.stringify(error));

        if (error) {
            alert('Error: ' + error.message);
            btn.disabled = false;
            btn.textContent = '✓ Confirm';
            return;
        }

        // Notify admin (using notifications system)
        try {
            if (window.Notif) {
                await Notif.toAdmins(
                    'New Teacher Request',
                    'Student requested teacher ' + selectedTeacherForConfirm.name + ' for ' + currentCourseForSelection.title,
                    'info',
                    '/admin/teacher-requests.html'
                );
            }
        } catch(e) { console.warn('Notification failed:', e); }

        alert('✓ Request submitted! Admin approval pending.');
        closeConfirmModal();
        await loadCoursesAndAssignments();
    }

    async function requestChange(courseId, courseTitle, currentTeacherId) {
        const reason = prompt('আপনি কেন teacher change করতে চান? (কারণ লিখুন)');
        if (!reason || !reason.trim()) return;

        // For now, open teacher modal to select new teacher
        openTeacherModal(courseId, courseTitle);
        // Note: Complex flow can be implemented in Phase B
    }

    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
    } else {
        init();
    }
    </script>

    <script src="../assets/js/notifications.js"></script>
    <script src="../assets/js/inject-bell.js"></script>

<script>
  (function() {
    var btn = document.getElementById('diagToggle');
    var panel = document.getElementById('diagPanel');
    if (btn && panel) {
      // Start hidden
      panel.style.display = 'none';
      btn.addEventListener('click', function() {
        if (panel.style.display === 'none') {
          panel.style.display = 'block';
          btn.style.opacity = '1';
        } else {
          panel.style.display = 'none';
          btn.style.opacity = '0.3';
        }
      });
    }
  })();
</script>
