<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lessons | Al-Arabiyah Learning Center</title>
<meta name="theme-color" content="#0A3622">
<link rel="manifest" href="../manifest.json">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body{font-family:'Inter',sans-serif;background:#F9F7F2}
h1,h2,h3,h4{font-family:'Playfair Display',serif}
.btn-primary{background:#0A3622;color:white;transition:.2s}
.btn-primary:hover{background:#062218}
.sidebar-link{transition:all .2s}
.sidebar-link:hover,.sidebar-link.active{background:rgba(212,175,55,0.15);color:#0A3622;border-left:3px solid #D4AF37}
.lesson-item{transition:.3s}
.lesson-item.completed{background:#dcfce7}
.lesson-check{width:28px;height:28px;border-radius:50%;border:2px solid rgba(10,54,34,.3);display:flex;align-items:center;justify-content:center;flex-shrink:0;cursor:pointer;transition:.2s}
.lesson-check:hover{border-color:#16a34a}
.lesson-check.done{background:#16a34a;border-color:#16a34a;color:white}
</style>
</head>
<body class="bg-cream text-charcoal min-h-screen">

<header class="sticky top-0 z-40 bg-white border-b border-primary/10">
  <div class="px-4 py-3 flex items-center justify-between">
    <div class="flex items-center gap-3">
      <button id="sidebarToggle" class="lg:hidden p-2 text-primary">

      </button>
      <a href="../index.html" class="flex items-center gap-2">
        <img src="../assets/images/logo.png" alt="Al-Arabiyah" class="w-10 h-10 rounded-full border-2 border-secondary object-cover">
        <div class="hidden sm:block">
          <div class="font-heading font-bold text-primary text-sm leading-tight">Al-Arabiyah</div>
          <div class="text-xs text-primary/70">Learning Center</div>
        </div>
      </a>
    </div>
    <div class="flex items-center gap-3">
      <a href="my-courses.html" class="text-sm text-primary font-medium hover:text-secondary">← My Courses</a>

    </div>
  </div>
</header>

<div class="flex">

        </button>
      </div>
      <nav class="space-y-1">

          Dashboard
        </a>
        <a href="my-courses.html" class="sidebar-link active flex items-center gap-3 px-4 py-3 rounded-lg text-primary font-medium">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"/></svg>
          My Courses
        </a>
        <a href="quizzes.html" class="sidebar-link flex items-center gap-3 px-4 py-3 rounded-lg text-charcoal/70">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8.228 9c.549-1.165 2.03-2 3.772-2 2.21 0 4 1.343 4 3 0 1.4-1.278 2.575-3.006 2.907-.542.104-.994.54-.994 1.093m0 3h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
          Quizzes
        </a>
        <a href="assignments.html" class="sidebar-link flex items-center gap-3 px-4 py-3 rounded-lg text-charcoal/70">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/></svg>
          Assignments
        </a>
        <a href="chat.html" class="sidebar-link flex items-center gap-3 px-4 py-3 rounded-lg text-charcoal/70">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"/></svg>
          Chat
        </a>
        <a href="my-plan.html" class="sidebar-link flex items-center gap-3 px-4 py-3 rounded-lg text-charcoal/70">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
          My Plan
        </a>
        <a href="book-class.html" class="sidebar-link flex items-center gap-3 px-4 py-3 rounded-lg text-charcoal/70">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>
          Book a Class
        </a>
        <a href="live-class.html" class="sidebar-link flex items-center gap-3 px-4 py-3 rounded-lg text-charcoal/70">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"/></svg>
          My Live Classes
        </a>
        <a href="submit-review.html" class="sidebar-link flex items-center gap-3 px-4 py-3 rounded-lg text-charcoal/70">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11.049 2.927c.3-.921 1.603-.921 1.902 0l1.519 4.674a1 1 0 00.95.69h4.915c.969 0 1.371 1.24.588 1.81l-3.976 2.888a1 1 0 00-.363 1.118l1.518 4.674c.3.922-.755 1.688-1.538 1.118l-3.976-2.888a1 1 0 00-1.176 0l-3.976 2.888c-.783.57-1.838-.197-1.538-1.118l1.518-4.674a1 1 0 00-.363-1.118l-3.976-2.888c-.784-.57-.38-1.81.588-1.81h4.914a1 1 0 00.951-.69l1.519-4.674z"/></svg>
          Submit Review
        </a>
        <a href="payment.html" class="sidebar-link flex items-center gap-3 px-4 py-3 rounded-lg text-charcoal/70">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 10h18M7 15h1m4 0h1m-7 4h12a3 3 0 003-3V8a3 3 0 00-3-3H6a3 3 0 00-3 3v8a3 3 0 003 3z"/></svg>
          Payments
        </a>
        <a href="certificate.html" class="sidebar-link flex items-center gap-3 px-4 py-3 rounded-lg text-charcoal/70">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
          Certificates
        </a>
        <a href="profile.html" class="sidebar-link flex items-center gap-3 px-4 py-3 rounded-lg text-charcoal/70">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
          My Profile
        </a>
      </nav>
    </div>
  </aside>

  <div id="sidebarOverlay" class="hidden lg:hidden fixed inset-0 bg-black/50 z-20"></div>

  <main class="flex-1 min-w-0 p-4 md:p-6 lg:p-8">
    <div id="loading" class="text-center py-20">
      <div class="inline-block animate-spin rounded-full h-8 w-8 border-4 border-primary/20 border-t-primary"></div>
    </div>

    <div id="content" class="hidden max-w-4xl"></div>
  </main>
</div>

<script src="../assets/js/supabase-config.js"></script>
<script src="../assets/js/notifications.js"></script>
<script src="../assets/js/inject-bell.js"></script>
<script>
(async () => {
  let tries = 0;
  while (!window.db && tries < 50) { await new Promise(r => setTimeout(r, 100)); tries++; }
  if (!window.db) return;
  const db = window.db;

  // Sidebar toggle
  document.getElementById('sidebarToggle').addEventListener('click', () => {
    document.getElementById('sidebar').classList.remove('-translate-x-full');
    document.getElementById('sidebarOverlay').classList.remove('hidden');
  });
  document.getElementById('sidebarClose').addEventListener('click', () => {
    document.getElementById('sidebar').classList.add('-translate-x-full');
    document.getElementById('sidebarOverlay').classList.add('hidden');
  });
  document.getElementById('sidebarOverlay').addEventListener('click', () => {
    document.getElementById('sidebar').classList.add('-translate-x-full');
    document.getElementById('sidebarOverlay').classList.add('hidden');
  });

  // Auth
  const { data: { session } } = await db.auth.getSession();
  if (!session) { window.location.href = '../auth/login.html'; return; }
  const user = session.user;

  // Get course from URL
  const params = new URLSearchParams(window.location.search);
  const courseId = params.get('course');
  if (!courseId) { window.location.href = 'my-courses.html'; return; }

  // Access control: Check enrollment
  const { data: enrollment } = await db.from('enrollments')
    .select('*').eq('student_id', user.id).eq('course_id', courseId)
    .in('status', ['active', 'completed']).maybeSingle();

  if (!enrollment) {
    document.getElementById('loading').classList.add('hidden');
    const content = document.getElementById('content');
    content.classList.remove('hidden');
    content.innerHTML = `
      <div class="bg-white rounded-3xl p-10 text-center border border-primary/5">
        <div class="w-20 h-20 bg-yellow-100 rounded-full flex items-center justify-center mx-auto mb-4">
          <svg class="w-10 h-10 text-yellow-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/></svg>
        </div>
        <h2 class="text-2xl font-bold text-primary mb-2">Access Denied</h2>
        <p class="text-charcoal/60 text-sm mb-6">You are not enrolled in this course. Please enroll first.</p>
        <a href="my-courses.html" class="btn-primary inline-block px-6 py-3 rounded-full font-semibold">My Courses</a>
      </div>
    `;
    return;
  }

  // Load course
  const { data: course } = await db.from('courses').select('*').eq('id', courseId).single();
  if (!course) { window.location.href = 'my-courses.html'; return; }

  // Load modules with lessons
  const { data: modules } = await db.from('modules').select('*, lessons(*)').eq('course_id', courseId).order('sort_order');

  // Load progress
  const { data: progressData } = await db.from('progress').select('lesson_id').eq('student_id', user.id).eq('course_id', courseId).eq('is_completed', true);
  const completedLessonIds = new Set((progressData || []).map(p => p.lesson_id));

  const allLessons = (modules || []).flatMap(m => m.lessons || []);
  const totalLessons = allLessons.length;
  const completedCount = allLessons.filter(l => completedLessonIds.has(l.id)).length;
  const progressPct = totalLessons > 0 ? Math.round((completedCount / totalLessons) * 100) : 0;

  document.getElementById('loading').classList.add('hidden');
  const box = document.getElementById('content');
  box.classList.remove('hidden');

  box.innerHTML = `
    <div class="mb-6">
      <a href="my-courses.html" class="inline-flex items-center gap-2 text-primary/60 hover:text-secondary text-sm mb-3">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"/></svg>
        Back to Courses
      </a>
      <h1 class="text-3xl font-bold text-primary mb-1">${course.title}</h1>
      <p class="text-charcoal/60 text-sm">${course.description || ''}</p>
    </div>

    <div class="bg-white rounded-2xl p-6 border border-primary/5 mb-6">
      <div class="flex items-center justify-between mb-3">
        <h3 class="font-bold text-primary">Your Progress</h3>
        <span class="text-2xl font-bold ${progressPct === 100 ? 'text-green-600' : 'text-primary'}">${progressPct}%</span>
      </div>
      <div class="w-full bg-cream rounded-full h-3 mb-2">
        <div class="bg-secondary h-3 rounded-full transition-all" style="width: ${progressPct}%"></div>
      </div>
      <p class="text-xs text-charcoal/60">${completedCount} of ${totalLessons} lessons completed</p>
      ${progressPct === 100 ? '<div class="mt-4 bg-green-50 border border-green-200 rounded-xl p-3"><p class="text-sm font-semibold text-green-800">🎉 Course completed! Certificate issued.</p></div>' : ''}
    </div>

    <div class="space-y-4">
      ${(modules || []).map(m => `
        <div class="bg-white rounded-2xl border border-primary/5 overflow-hidden">
          <div class="bg-cream px-5 py-3 border-b border-primary/10">
            <h3 class="font-bold text-primary">${m.title}</h3>
            <p class="text-xs text-charcoal/60">${(m.lessons || []).length} lessons</p>
          </div>
          <div class="divide-y divide-primary/5">
            ${(m.lessons || []).sort((a,b) => (a.sort_order||0)-(b.sort_order||0)).map(l => {
              const done = completedLessonIds.has(l.id);
              return `
                <div class="lesson-item ${done ? 'completed' : ''} px-5 py-4 flex items-center gap-4">
                  <div class="lesson-check ${done ? 'done' : ''}" onclick="toggleLesson('${l.id}', '${m.id}', '${courseId}', ${done})">
                    ${done ? '<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"/></svg>' : ''}
                  </div>
                  <div class="flex-1 min-w-0">
                    <p class="font-semibold text-primary text-sm ${done ? 'line-through opacity-60' : ''}">${l.title}</p>
                    ${l.duration_min ? `<p class="text-xs text-charcoal/50">${l.duration_min} min</p>` : ''}
                  </div>
                  ${l.video_url ? `<a href="${l.video_url}" target="_blank" class="text-secondary text-xs font-semibold">Watch →</a>` : ''}
                </div>
              `;
            }).join('') || '<p class="text-charcoal/50 text-sm p-4">No lessons yet</p>'}
          </div>
        </div>
      `).join('') || '<div class="bg-white rounded-2xl p-10 text-center border border-primary/5 text-charcoal/60 text-sm">No modules yet. Wait for admin to add lessons.</div>'}
    </div>
  `;

  window.toggleLesson = async (lessonId, moduleId, courseId, isDone) => {
    if (isDone) {
      await db.from('progress').delete().eq('student_id', user.id).eq('lesson_id', lessonId);
    } else {
      await db.from('progress').upsert({
        student_id: user.id,
        lesson_id: lessonId,
        module_id: moduleId,
        course_id: courseId,
        is_completed: true,
        completed_at: new Date().toISOString()
      }, { onConflict: 'student_id,lesson_id' });

      // Check if all lessons complete → auto issue certificate
      const { data: allModules } = await db.from('modules').select('id, lessons(id)').eq('course_id', courseId);
      const allLessonIds = (allModules || []).flatMap(m => (m.lessons || []).map(l => l.id));
      const { data: doneList } = await db.from('progress').select('lesson_id').eq('student_id', user.id).eq('course_id', courseId).eq('is_completed', true);
      const doneIds = (doneList || []).map(p => p.lesson_id);
      const allDone = allLessonIds.length > 0 && allLessonIds.every(id => doneIds.includes(id));

      if (allDone) {
        const { data: existingCert } = await db.from('certificates').select('id').eq('student_id', user.id).eq('course_id', courseId).maybeSingle();
        if (!existingCert) {
          const certId = 'ALC-' + new Date().getFullYear() + '-' + Math.floor(Math.random() * 90000 + 10000);
          const { data: profile } = await db.from('profiles').select('full_name').eq('id', user.id).single();
          const { data: courseInfo } = await db.from('courses').select('title').eq('id', courseId).single();

          await db.from('certificates').insert({
            certificate_id: certId,
            student_id: user.id,
            course_id: courseId,
            student_name: profile?.full_name || user.email.split('@')[0],
            course_name: courseInfo?.title || 'Quran Course',
            issued_by: null
          });

          if (window.Notif) {
            await Notif.send(user.id, 'Certificate Issued 🏆', 'Congratulations! You completed ' + (courseInfo?.title || 'the course') + '.', 'certificate', '/student/certificate.html').catch(() => {});
            await Notif.toAdmins('Auto Certificate Issued 🎉', (profile?.full_name || user.email) + ' completed ' + (courseInfo?.title || 'a course'), 'certificate', '/admin/certificates.html').catch(() => {});
          }

          alert('🎉 Congratulations! Certificate issued!');
        }
      }
    }
    location.reload();
  };
})();
</script>

</body>
</html>
