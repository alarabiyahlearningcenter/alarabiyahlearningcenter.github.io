<!DOCTYPE html>
<html>
<head>
    <title>Debug v4 — Direct Token Approach</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: monospace; padding: 20px; background: #000; color: #0f0; line-height: 1.8; font-size: 13px; }
        .err { color: #f66; } .ok { color: #6f6; } .warn { color: #ff0; } .info { color: #6cf; }
        h2 { color: #fff; }
    </style>
</head>
<body>
    <h2>🔍 Debug v4 — Direct Token</h2>
    <div id="log">Starting...</div>

    <script>
        const log = (msg, cls) => {
            document.getElementById('log').innerHTML += '<div class="' + (cls || '') + '">' + msg + '</div>';
        };

        (async function() {
            try {
                // Find raw token dynamically
                let raw = null;
                for (let i = 0; i < localStorage.length; i++) {
                    const k = localStorage.key(i);
                    if (k && k.indexOf('sb-') === 0 && k.indexOf('-auth-token') !== -1) {
                        raw = localStorage.getItem(k);
                        break;
                    }
                }
                if (!raw) { log('❌ No token', 'err'); return; }
                
                const parsed = JSON.parse(raw);
                const accessToken = parsed.access_token;
                const user = parsed.user;
                
                log('=== ✓ Token loaded ===', 'ok');
                log('User email: ' + user.email, 'ok');
                log('User id: ' + user.id, 'ok');
                log('Token length: ' + accessToken.length, 'ok');

                log('=== Testing direct REST API with token ===', 'warn');
                const url = 'https://vgsgjsneymetzsuzl1fb.supabase.co/rest/v1/enrollments?select=id,course_id,status&student_id=eq.' + user.id;
                const res = await fetch(url, {
                    headers: {
                        'apikey': 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZnc2dqc25leW1ldHpzdXpsMWZiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3MjU0NjI4OTQsImV4cCI6MjA0MTAzODg5NH0.gSnsS1xGl0ChIZB5k7oyK3HgL8G4xKv7mR2sB-XLxOk',
                        'Authorization': 'Bearer ' + accessToken
                    }
                });
                
                log('Response status: ' + res.status, res.ok ? 'ok' : 'err');
                const data = await res.json();
                log('Response data: ' + JSON.stringify(data).substring(0, 200), 'info');
                
                if (Array.isArray(data) && data.length > 0) {
                    log('✓✓✓ Direct REST API WORKS! Found ' + data.length + ' enrollments', 'ok');
                    log('👉 Use direct fetch() with Authorization header instead of Supabase client', 'warn');
                } else if (res.ok) {
                    log('✓ API works but no enrollments for this user', 'warn');
                } else {
                    log('❌ API failed', 'err');
                }

                log('=== DONE ===', 'ok');
            } catch(e) {
                log('❌ EXCEPTION: ' + e.message, 'err');
                log(e.stack, 'err');
            }
        })();
    </script>
</body>
</html>
