<!DOCTYPE html>
<html>
<head>
    <title>Debug Test</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: monospace; padding: 20px; background: #000; color: #0f0; line-height: 1.8; }
        .err { color: #f66; }
        .ok { color: #6f6; }
        .warn { color: #ff0; }
        h2 { color: #fff; }
    </style>
</head>
<body>
    <h2>🔍 Debug Console — Select Teacher Page</h2>
    <div id="log">Starting...</div>

    <script>
        const log = (msg, cls) => {
            document.getElementById('log').innerHTML += '<div class="' + (cls || '') + '">' + msg + '</div>';
        };

        (async function() {
            try {
                log('=== STEP 1: Page loaded ===', 'ok');
                log('URL: ' + location.href);

                log('=== STEP 2: Check localStorage keys ===', 'warn');
                const keys = [];
                for (let i = 0; i < localStorage.length; i++) {
                    const k = localStorage.key(i);
                    if (k && k.indexOf('sb-') === 0) keys.push(k);
                }
                log('Total sb-* keys: ' + keys.length);
                keys.forEach(k => log('  KEY: ' + k));

                log('=== STEP 3: Check auth-token ===', 'warn');
                const raw = localStorage.getItem('sb-vgsgjsneymetzsuzl1fb-auth-token');
                if (!raw) {
                    log('❌ NO auth-token in localStorage!', 'err');
                    log('   This means you are NOT logged in on this domain.', 'err');
                } else {
                    log('✓ Token found (' + raw.length + ' chars)', 'ok');
                    try {
                        const parsed = JSON.parse(raw);
                        log('✓ Parsed successfully', 'ok');
                        log('  Has access_token: ' + !!parsed.access_token);
                        log('  Has user: ' + !!parsed.user);
                        log('  User email: ' + (parsed.user && parsed.user.email || 'none'));
                        log('  User id: ' + (parsed.user && parsed.user.id || 'none'));
                    } catch(e) {
                        log('❌ JSON.parse failed: ' + e.message, 'err');
                    }
                }

                log('=== STEP 4: Supabase getSession ===', 'warn');
                const db = window.supabase.createClient(
                    'https://vgsgjsneymetzsuzl1fb.supabase.co',
                    'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZnc2dqc25leW1ldHpzdXpsMWZiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3MjU0NjI4OTQsImV4cCI6MjA0MTAzODg5NH0.gSnsS1xGl0ChIZB5k7oyK3HgL8G4xKv7mR2sB-XLxOk'
                );
                const res = await db.auth.getSession();
                const session = res.data && res.data.session;
                if (session && session.user) {
                    log('✓ getSession returned valid session', 'ok');
                    log('  Email: ' + session.user.email);
                } else {
                    log('❌ getSession returned NO session', 'err');
                }

                log('=== STEP 5: Fetch enrollments (test) ===', 'warn');
                if (session && session.user) {
                    const { data, error } = await db
                        .from('enrollments')
                        .select('id, course_id, status')
                        .eq('student_id', session.user.id);
                    if (error) {
                        log('❌ Enrollment fetch error: ' + error.message, 'err');
                    } else {
                        log('✓ Enrollments found: ' + (data ? data.length : 0), 'ok');
                    }
                } else {
                    log('Skipped - no session', 'warn');
                }

                log('=== DONE ===', 'ok');
            } catch(e) {
                log('❌ EXCEPTION: ' + e.message, 'err');
                log('Stack: ' + e.stack, 'err');
            }
        })();
    </script>
</body>
</html>
