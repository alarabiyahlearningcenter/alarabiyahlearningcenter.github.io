    </div>

    <!-- Save -->
    <div class="sticky bottom-4">
      <button id="saveBtn" class="btn-primary w-full py-4 rounded-xl font-semibold text-lg shadow-lg">Save All Social Links</button>
      <p id="saveStatus" class="text-sm text-center mt-2 hidden"></p>
    </div>
  </div>
</div>

<script src="../assets/js/supabase-config.js"></script>
<script src="../assets/js/super-admin-shell.js"></script>
<script>
(async () => {
  const ctx = await initSuperAdminShell();
  if (!ctx) return;
  const db = ctx.db;

  async function getSetting(key) {
    const { data } = await db.from('site_settings').select('value').eq('key', key).maybeSingle();
    if (!data) return null;
    try { return JSON.parse(data.value); } catch { return data.value; }
  }

  async function saveSetting(key, value) {
    const jsonValue = JSON.stringify(value);
    const { error } = await db.from('site_settings').upsert({ key, value: jsonValue }, { onConflict: 'key' });
    return error;
  }

  const keys = ['facebook', 'youtube', 'instagram', 'tiktok', 'twitter', 'telegram', 'whatsapp_channel'];
  const loaded = await Promise.all(keys.map(k => getSetting(k)));

  keys.forEach((k, i) => {
    document.getElementById(k).value = loaded[i] || '';
  });

  document.getElementById('loading').classList.add('hidden');
  document.getElementById('socialContent').classList.remove('hidden');

  document.getElementById('saveBtn').addEventListener('click', async () => {
    const btn = document.getElementById('saveBtn');
    const status = document.getElementById('saveStatus');
    btn.disabled = true;
    btn.textContent = 'Saving...';

    const errors = await Promise.all(
      keys.map(k => saveSetting(k, document.getElementById(k).value.trim()))
    );

    const hasError = errors.some(e => e);
    if (hasError) {
      status.textContent = '❌ Error: ' + (errors.find(e => e)?.message || 'Unknown');
      status.className = 'text-sm text-center text-red-600 mt-2';
    } else {
      status.textContent = '✓ Social links saved!';
      status.className = 'text-sm text-center text-green-600 mt-2';
    }
    status.classList.remove('hidden');
    btn.disabled = false;
    btn.textContent = 'Save All Social Links';
    setTimeout(() => status.classList.add('hidden'), 2500);
  });
})();
</script>

</body>
</html>
