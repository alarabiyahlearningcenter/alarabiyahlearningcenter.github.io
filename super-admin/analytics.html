<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Analytics | Super Admin</title>
<meta name="theme-color" content="#0A3622">
<link rel="manifest" href="../manifest.json">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
body{font-family:'Inter',sans-serif;background:#F9F7F2}
h1,h2,h3,h4{font-family:'Playfair Display',serif}
.btn-primary{background:#0A3622;color:white;transition:.2s}
.btn-primary:hover{background:#062218}
.sidebar-link{transition:all .2s}
.sidebar-link:hover,.sidebar-link.active{background:rgba(212,175,55,0.15);color:#0A3622;border-left:3px solid #D4AF37}
.card-hover{transition:.3s}
.card-hover:hover{box-shadow:0 12px 24px rgba(10,54,34,.1)}
.stat-icon{width:48px;height:48px;border-radius:14px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.chart-container{position:relative;height:280px}
</style>
</head>
<body class="bg-cream text-charcoal min-h-screen">

<div id="super-admin-shell"></div>

<div id="page-content" class="hidden">
  <div class="mb-6">
    <h1 class="text-2xl md:text-3xl font-bold text-primary mb-1">Analytics</h1>
    <p class="text-charcoal/60 text-sm">Business insights & performance metrics</p>
  </div>

  <!-- KPI Stats -->
  <div class="grid grid-cols-2 lg:grid-cols-4 gap-4 mb-6">
    <div class="bg-white rounded-2xl p-5 card-hover border border-primary/5">
      <div class="flex items-center justify-between mb-3">
        <div class="stat-icon" style="background:#dbeafe">
          <svg class="w-6 h-6 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
        </div>
        <span id="growthRev" class="text-xs font-semibold text-green-600">+0%</span>
      </div>
      <p class="text-xs text-charcoal/60 mb-1">Total Revenue</p>
      <p id="kpiRevenue" class="text-2xl font-bold text-primary">৳0</p>
    </div>

    <div class="bg-white rounded-2xl p-5 card-hover border border-primary/5">
      <div class="flex items-center justify-between mb-3">
        <div class="stat-icon" style="background:#dbeafe">
          <svg class="w-6 h-6 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
        </div>
        <span id="growthUsers" class="text-xs font-semibold text-green-600">+0%</span>
      </div>
      <p class="text-xs text-charcoal/60 mb-1">Total Users</p>
      <p id="kpiUsers" class="text-2xl font-bold text-primary">0</p>
    </div>

    <div class="bg-white rounded-2xl p-5 card-hover border border-primary/5">
      <div class="flex items-center justify-between mb-3">
        <div class="stat-icon" style="background:#dcfce7">
          <svg class="w-6 h-6 text-green-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"/></svg>
        </div>
      </div>
      <p class="text-xs text-charcoal/60 mb-1">Course Enrollments</p>
      <p id="kpiEnrollments" class="text-2xl font-bold text-primary">0</p>
    </div>

    <div class="bg-white rounded-2xl p-5 card-hover border border-primary/5">
      <div class="flex items-center justify-between mb-3">
        <div class="stat-icon" style="background:rgba(212,175,55,.2)">
          <svg class="w-6 h-6 text-secondary" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
        </div>
      </div>
      <p class="text-xs text-charcoal/60 mb-1">Avg. Payment</p>
      <p id="kpiAvgPay" class="text-2xl font-bold text-primary">৳0</p>
    </div>
  </div>

  <!-- Charts Row 1 -->
  <div class="grid lg:grid-cols-3 gap-6 mb-6">
    <div class="bg-white rounded-2xl p-6 border border-primary/5 lg:col-span-2">
      <div class="flex items-center justify-between mb-4">
        <h3 class="text-lg font-bold text-primary">Revenue (Last 6 Months)</h3>
        <span class="text-xs text-charcoal/60">BDT ৳</span>
      </div>
      <div class="chart-container">
        <canvas id="revenueChart"></canvas>
      </div>
    </div>

    <div class="bg-white rounded-2xl p-6 border border-primary/5">
      <h3 class="text-lg font-bold text-primary mb-4">User Roles</h3>
      <div class="chart-container">
        <canvas id="rolesChart"></canvas>
      </div>
    </div>
  </div>

  <!-- Charts Row 2 -->
  <div class="grid lg:grid-cols-2 gap-6 mb-6">
    <div class="bg-white rounded-2xl p-6 border border-primary/5">
      <h3 class="text-lg font-bold text-primary mb-4">New Signups (Last 6 Months)</h3>
      <div class="chart-container">
        <canvas id="signupsChart"></canvas>
      </div>
    </div>

    <div class="bg-white rounded-2xl p-6 border border-primary/5">
      <h3 class="text-lg font-bold text-primary mb-4">Payment Status Breakdown</h3>
      <div class="chart-container">
        <canvas id="paymentStatusChart"></canvas>
      </div>
    </div>
  </div>

  <!-- Top Courses -->
  <div class="bg-white rounded-2xl p-6 border border-primary/5">
    <h3 class="text-lg font-bold text-primary mb-4">Top Performing Courses</h3>
    <div id="topCourses">
      <p class="text-charcoal/60 text-sm text-center py-6">Loading...</p>
    </div>
  </div>
</div>

<script src="../assets/js/supabase-config.js"></script>
<script src="../assets/js/notifications.js"></script>
<script src="../assets/js/super-admin-shell.js"></script>
<script>
(async () => {
  const ctx = await initSuperAdminShell();
  if (!ctx) return;
  const db = ctx.db;

  // ============ FETCH DATA ============
  const [profilesRes, paymentsRes, enrollmentsRes, coursesRes] = await Promise.all([
    db.from('profiles').select('id, role, created_at'),
    db.from('payments').select('amount, status, created_at'),
    db.from('enrollments').select('id, course_id, created_at'),
    db.from('courses').select('id, title')
  ]);

  const profiles = profilesRes.data || [];
  const payments = paymentsRes.data || [];
  const enrollments = enrollmentsRes.data || [];
  const courses = coursesRes.data || [];

  // ============ KPI CALCULATION ============
  const verified = payments.filter(p => p.status === 'verified');
  const totalRevenue = verified.reduce((s, p) => s + Number(p.amount || 0), 0);
  const avgPay = verified.length ? Math.round(totalRevenue / verified.length) : 0;

  document.getElementById('kpiRevenue').textContent = '৳' + totalRevenue.toLocaleString();
  document.getElementById('kpiUsers').textContent = profiles.length;
  document.getElementById('kpiEnrollments').textContent = enrollments.length;
  document.getElementById('kpiAvgPay').textContent = '৳' + avgPay.toLocaleString();

  // ============ MONTHLY DATA (last 6 months) ============
  function getLast6Months() {
    const months = [];
    const now = new Date();
    for (let i = 5; i >= 0; i--) {
      const d = new Date(now.getFullYear(), now.getMonth() - i, 1);
      months.push({
        label: d.toLocaleDateString('en-US', { month: 'short', year: '2-digit' }),
        year: d.getFullYear(),
        month: d.getMonth()
      });
    }
    return months;
  }

  const months = getLast6Months();
  const revenueByMonth = months.map(m => {
    return verified.filter(p => {
      const d = new Date(p.created_at);
      return d.getFullYear() === m.year && d.getMonth() === m.month;
    }).reduce((s, p) => s + Number(p.amount || 0), 0);
  });

  const signupsByMonth = months.map(m => {
    return profiles.filter(u => {
      const d = new Date(u.created_at);
      return d.getFullYear() === m.year && d.getMonth() === m.month;
    }).length;
  });

  // Growth calculations
  const lastMonthRev = revenueByMonth[revenueByMonth.length - 1] || 0;
  const prevMonthRev = revenueByMonth[revenueByMonth.length - 2] || 0;
  const revGrowth = prevMonthRev > 0 ? Math.round(((lastMonthRev - prevMonthRev) / prevMonthRev) * 100) : (lastMonthRev > 0 ? 100 : 0);

  const lastMonthUsers = signupsByMonth[signupsByMonth.length - 1] || 0;
  const prevMonthUsers = signupsByMonth[signupsByMonth.length - 2] || 0;
  const userGrowth = prevMonthUsers > 0 ? Math.round(((lastMonthUsers - prevMonthUsers) / prevMonthUsers) * 100) : (lastMonthUsers > 0 ? 100 : 0);

  const growRevEl = document.getElementById('growthRev');
  growRevEl.textContent = (revGrowth >= 0 ? '+' : '') + revGrowth + '%';
  growRevEl.className = 'text-xs font-semibold ' + (revGrowth >= 0 ? 'text-green-600' : 'text-red-600');

  const growUsersEl = document.getElementById('growthUsers');
  growUsersEl.textContent = (userGrowth >= 0 ? '+' : '') + userGrowth + '%';
  growUsersEl.className = 'text-xs font-semibold ' + (userGrowth >= 0 ? 'text-green-600' : 'text-red-600');

  // ============ ROLE CHART ============
  const roles = ['student', 'teacher', 'admin', 'super_admin'];
  const roleCounts = roles.map(r => profiles.filter(u => u.role === r).length);

  // ============ PAYMENT STATUS CHART ============
  const pStatuses = ['pending', 'verified', 'rejected', 'refunded'];
  const pCounts = pStatuses.map(s => payments.filter(p => p.status === s).length);

  // ============ CHART.JS ============
  const PRIMARY = '#0A3622';
  const SECONDARY = '#D4AF37';

  // Revenue Chart
  new Chart(document.getElementById('revenueChart'), {
    type: 'line',
    data: {
      labels: months.map(m => m.label),
      datasets: [{
        label: 'Revenue (BDT)',
        data: revenueByMonth,
        borderColor: PRIMARY,
        backgroundColor: 'rgba(10,54,34,0.1)',
        tension: 0.4,
        fill: true,
        pointBackgroundColor: SECONDARY,
        pointBorderColor: PRIMARY,
        pointRadius: 5,
        pointHoverRadius: 7
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: { legend: { display: false } },
      scales: {
        y: { beginAtZero: true, ticks: { callback: v => '৳' + v } }
      }
    }
  });

  // Roles Chart
  new Chart(document.getElementById('rolesChart'), {
    type: 'doughnut',
    data: {
      labels: ['Students', 'Teachers', 'Admins', 'Super Admins'],
      datasets: [{
        data: roleCounts,
        backgroundColor: ['#3b82f6', SECONDARY, PRIMARY, '#7c3aed'],
        borderWidth: 2,
        borderColor: '#fff'
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: {
        legend: { position: 'bottom', labels: { font: { size: 11 }, padding: 12 } }
      },
      cutout: '65%'
    }
  });

  // Signups Chart
  new Chart(document.getElementById('signupsChart'), {
    type: 'bar',
    data: {
      labels: months.map(m => m.label),
      datasets: [{
        label: 'New Users',
        data: signupsByMonth,
        backgroundColor: SECONDARY,
        borderRadius: 8
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: { legend: { display: false } },
      scales: { y: { beginAtZero: true, ticks: { stepSize: 1 } } }
    }
  });

  // Payment Status Chart
  new Chart(document.getElementById('paymentStatusChart'), {
    type: 'bar',
    data: {
      labels: ['Pending', 'Verified', 'Rejected', 'Refunded'],
      datasets: [{
        label: 'Payments',
        data: pCounts,
        backgroundColor: ['#eab308', '#16a34a', '#dc2626', '#64748b'],
        borderRadius: 8
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      indexAxis: 'y',
      plugins: { legend: { display: false } },
      scales: { x: { beginAtZero: true, ticks: { stepSize: 1 } } }
    }
  });

  // ============ TOP COURSES ============
  const enrollmentCount = {};
  enrollments.forEach(e => {
    if (e.course_id) enrollmentCount[e.course_id] = (enrollmentCount[e.course_id] || 0) + 1;
  });

  const topCourses = Object.entries(enrollmentCount)
    .map(([cid, count]) => {
      const course = courses.find(c => c.id === cid);
      return { title: course?.title || 'Unknown', count };
    })
    .sort((a, b) => b.count - a.count)
    .slice(0, 5);

  const topBox = document.getElementById('topCourses');
  if (topCourses.length === 0) {
    topBox.innerHTML = '<p class="text-charcoal/60 text-sm text-center py-6">No enrollment data yet</p>';
  } else {
    const max = topCourses[0].count;
    topBox.innerHTML = topCourses.map((c, i) => {
      const pct = Math.round((c.count / max) * 100);
      return `
        <div class="mb-4">
          <div class="flex items-center justify-between mb-2">
            <div class="flex items-center gap-2">
              <span class="w-6 h-6 rounded-full bg-primary text-secondary text-xs font-bold flex items-center justify-center">${i + 1}</span>
              <p class="text-sm font-semibold text-primary">${c.title}</p>
            </div>
            <p class="text-xs text-charcoal/60">${c.count} enrollments</p>
          </div>
          <div class="w-full bg-cream rounded-full h-2">
            <div class="bg-secondary h-2 rounded-full transition-all" style="width: ${pct}%"></div>
          </div>
        </div>
      `;
    }).join('');
  }
})();
</script>

</body>
</html>
