        <a href="live-class.html" class="sidebar-link flex items-center gap-3 px-4 py-3 rounded-lg text-charcoal/70">

  <div id="sidebarOverlay" class="hidden lg:hidden fixed inset-0 bg-black/50 z-20"></div>

  <main class="flex-1 min-w-0 p-4 md:p-6 lg:p-8">

      <h1 class="text-2xl md:text-3xl font-bold text-primary mb-1">My Certificates</h1>
      <p class="text-charcoal/60 text-sm">View and download your certificates</p>
    </div>

    <div id="loading" class="text-center py-20 no-print">

<script>
const SUPABASE_URL = 'https://vgsgisyneymtszuslftb.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZnc2dpc3luZXltdHN6dXNsZnRiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA0NTg0NjQsImV4cCI6MjEwNjAzNDQ2NH0.HaYptmVnZCbGiOCg1NyYkcdHQDqjXlAHeq_i_bTC6Yk';
const { createClient } = supabase;
const db = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

document.getElementById('sidebarToggle').addEventListener('click', () => {
  document.getElementById('sidebar').classList.remove('-translate-x-full');
  document.getElementById('sidebarOverlay').classList.remove('hidden');
});
document.getElementById('sidebarClose').addEventListener('click', () => {
  document.getElementById('sidebar').classList.add('-translate-x-full');
  document.getElementById('sidebarOverlay').classList.add('hidden');
});
document.getElementById('sidebarOverlay').addEventListener('click', () => {
  document.getElementById('sidebar').classList.add('-translate-x-full');
  document.getElementById('sidebarOverlay').classList.add('hidden');
});
document.getElementById('userMenuBtn').addEventListener('click', (e) => {
  e.stopPropagation();
  document.getElementById('userMenu').classList.toggle('hidden');
});
document.addEventListener('click', () => document.getElementById('userMenu').classList.add('hidden'));
document.getElementById('logoutBtn').addEventListener('click', async () => {
  await db.auth.signOut();
  window.location.href = '../auth/login.html';
});

(async () => {
  const { data: { session } } = await db.auth.getSession();
  if (!session) { window.location.href = '../auth/login.html'; return; }
  const user = session.user;

  const { data: profile } = await db.from('profiles').select('*').eq('id', user.id).single();
  const fullName = profile?.full_name || user.email.split('@')[0];
  document.getElementById('userName').textContent = fullName;
  document.getElementById('userEmail').textContent = user.email;
  document.getElementById('avatar').textContent = fullName.charAt(0).toUpperCase();

  const { data: certificates } = await db.from('certificates').select('*').eq('student_id', user.id).order('issued_at', { ascending: false });

  const container = document.getElementById('certificateContainer');
  document.getElementById('loading').classList.add('hidden');

  if (!certificates || certificates.length === 0) {
    container.innerHTML = `
      <div class="bg-white rounded-3xl p-12 text-center border border-primary/5 no-print">
        <div class="w-20 h-20 bg-primary/10 rounded-full flex items-center justify-center mx-auto mb-4">
          <svg class="w-10 h-10 text-primary" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4M7.835 4.697a3.42 3.42 0 001.946-.806 3.42 3.42 0 014.438 0 3.42 3.42 0 001.946.806 3.42 3.42 0 013.138 3.138 3.42 3.42 0 00.806 1.946 3.42 3.42 0 010 4.438 3.42 3.42 0 00-.806 1.946 3.42 3.42 0 01-3.138 3.138 3.42 3.42 0 00-1.946.806 3.42 3.42 0 01-4.438 0 3.42 3.42 0 00-1.946-.806 3.42 3.42 0 01-3.138-3.138 3.42 3.42 0 00-.806-1.946 3.42 3.42 0 010-4.438 3.42 3.42 0 00.806-1.946 3.42 3.42 0 013.138-3.138z"/></svg>
        </div>
        <h3 class="text-xl font-bold text-primary mb-2">No Certificates Yet</h3>
        <p class="text-charcoal/60 text-sm mb-6">Complete a course to earn your certificate!</p>
        <a href="my-courses.html" class="btn-primary inline-block px-6 py-3 rounded-full font-semibold">View My Courses</a>
      </div>
    `;
    return;
  }

  container.innerHTML = certificates.map(cert => {
    const date = new Date(cert.issued_at).toLocaleDateString('en-GB', { day: '2-digit', month: 'long', year: 'numeric' });
    return `
      <div class="mb-8">
        <div class="flex items-center justify-between mb-3 no-print">
          <p class="text-sm font-semibold text-primary">Certificate: ${cert.certificate_id}</p>
          <div class="flex gap-2">
            <button onclick="window.print()" class="text-xs bg-primary text-white px-4 py-2 rounded-full font-semibold hover:bg-primary-dark">
              Download / Print
            </button>
            <a href="../certificate-verification.html?id=${cert.certificate_id}" class="text-xs border border-primary text-primary px-4 py-2 rounded-full font-semibold hover:bg-primary hover:text-white">
              Verify Online
            </a>
          </div>
        </div>
        <div class="cert-card rounded-2xl p-6 md:p-10 text-center relative overflow-hidden" id="cert-${cert.id}">
          <div class="absolute inset-0 opacity-5">
            <div class="absolute top-0 left-0 w-64 h-64 bg-secondary rounded-full blur-3xl"></div>
            <div class="absolute bottom-0 right-0 w-64 h-64 bg-secondary rounded-full blur-3xl"></div>
          </div>
          <div class="relative">
            <div class="flex items-center justify-center gap-3 mb-4">
              <img src="../assets/images/logo.png" alt="Al-Arabiyah" class="w-14 h-14 rounded-full border-2 border-secondary">
            </div>
            <p class="text-secondary text-xs md:text-sm tracking-widest mb-2">AL-ARABIYAH LEARNING CENTER</p>
            <h2 class="text-2xl md:text-4xl font-bold text-white mb-2" style="font-family: 'Playfair Display', serif;">Certificate of Completion</h2>
            <div class="w-24 h-1 bg-secondary mx-auto my-5"></div>
            <p class="text-white/70 text-xs md:text-sm mb-2">This is to certify that</p>
            <p class="text-2xl md:text-3xl font-bold text-secondary mb-4" style="font-family: 'Playfair Display', serif;">${cert.student_name}</p>
            <p class="text-white/70 text-xs md:text-sm mb-2">has successfully completed the course</p>
            <p class="text-lg md:text-xl font-semibold text-white mb-6">${cert.course_name}</p>
            <div class="flex flex-col md:flex-row justify-between items-center gap-4 pt-6 border-t border-white/20">
              <div class="text-left">
                <p class="text-white/60 text-xs">Certificate ID</p>
                <p class="text-secondary font-semibold text-sm">${cert.certificate_id}</p>
              </div>
              <div class="text-center">
                <div class="w-12 h-12 bg-secondary rounded-full flex items-center justify-center mx-auto">
                  <svg class="w-6 h-6 text-primary" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                </div>
                <p class="text-white/60 text-xs mt-1">Verified</p>
              </div>
              <div class="text-right">
                <p class="text-white/60 text-xs">Issued Date</p>
                <p class="text-secondary font-semibold text-sm">${date}</p>
              </div>
            </div>
          </div>
        </div>
      </div>
    `;
  }).join('');
})();
</script>

<script src="../assets/js/notifications.js"></script>
<script src="../assets/js/inject-bell.js"></script>
</body>
