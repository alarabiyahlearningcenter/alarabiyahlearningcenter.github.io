<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Teacher Dashboard — Al-Arabiyah</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  body { font-family: 'Segoe UI', system-ui, sans-serif; background: #faf8f2; color: #1a3a2a; }
  .btn-primary { background: #0A3622; color: #D4AF37; padding: 10px 20px; border-radius: 999px; font-weight: 600; }
  .btn-primary:hover { background: #062218; }
  .card { background: #fff; border-radius: 16px; padding: 20px; box-shadow: 0 4px 20px rgba(10,54,34,.06); }
  .student-row { display: flex; align-items: center; gap: 12px; padding: 12px; border-radius: 12px; transition: all .2s; }
  .student-row:hover { background: #f5f2e8; }
  .avatar { width: 44px; height: 44px; border-radius: 50%; background: #0A3622; color: #D4AF37; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 16px; }
  .modal { position: fixed; inset: 0; background: rgba(0,0,0,.6); display: none; align-items: center; justify-content: center; z-index: 100; padding: 20px; }
  .modal.active { display: flex; }
  .modal-content { background: #fff; border-radius: 20px; max-width: 500px; width: 100%; max-height: 90vh; overflow-y: auto; }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 6px; font-size: 11px; font-weight: 700; }
  .badge-active { background: #dcfce7; color: #15803d; }
  .input-field { width: 100%; padding: 10px 14px; border: 2px solid #e5e7eb; border-radius: 10px; font-size: 14px; outline: none; }
  .input-field:focus { border-color: #D4AF37; }
</style>
</head>
<body>

<!-- Header -->
<header style="background:#0A3622;padding:16px 20px;position:sticky;top:0;z-index:50">
  <div style="max-width:900px;margin:0 auto;display:flex;justify-content:space-between;align-items:center">
    <div style="display:flex;gap:12px;align-items:center">
      <img src="images/logo.png" alt="Logo" style="width:40px;height:40px;border-radius:50%" onerror="this.style.display='none'">
      <div>
        <h1 style="color:#D4AF37;font-weight:700;font-size:18px">Teacher Dashboard</h1>
        <p id="headerName" style="color:#fff;font-size:12px;opacity:.8">Loading...</p>
      </div>
    </div>
    <button onclick="logout()" style="background:rgba(255,255,255,.1);color:#fff;padding:8px 16px;border-radius:999px;font-size:13px">Logout</button>
  </div>
</header>

<main style="max-width:900px;margin:0 auto;padding:20px">

  <!-- Stats -->
  <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:20px">
    <div class="card" style="text-align:center">
      <p style="font-size:11px;color:#6b7280;text-transform:uppercase;font-weight:700">Students</p>
      <p id="statStudents" style="font-size:28px;font-weight:800;color:#0A3622">—</p>
    </div>
    <div class="card" style="text-align:center">
      <p style="font-size:11px;color:#6b7280;text-transform:uppercase;font-weight:700">Active</p>
      <p id="statActive" style="font-size:28px;font-weight:800;color:#15803d">—</p>
    </div>
    <div class="card" style="text-align:center">
      <p style="font-size:11px;color:#6b7280;text-transform:uppercase;font-weight:700">Classes Today</p>
      <p id="statToday" style="font-size:28px;font-weight:800;color:#D4AF37">—</p>
    </div>
  </div>

  <!-- Action buttons -->
  <div style="display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap">
    <button onclick="openAddStudentModal()" class="btn-primary">➕ Add Student</button>
    <button onclick="loadStudents()" style="background:#fff;border:2px solid #0A3622;color:#0A3622;padding:10px 20px;border-radius:999px;font-weight:600">🔄 Refresh</button>
  </div>

  <!-- Search -->
  <input id="searchBox" type="text" class="input-field" placeholder="🔍 Search my students..." style="margin-bottom:16px" oninput="filterStudents()">

  <!-- Student list -->
  <div id="studentsList" class="card"></div>

</main>

<!-- Add Student Modal -->
<div id="addStudentModal" class="modal">
  <div class="modal-content" style="padding:24px">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
      <h2 style="font-size:20px;font-weight:700;color:#0A3622">➕ Add Student</h2>
      <button onclick="closeModal('addStudentModal')" style="font-size:24px;color:#6b7280;background:none;border:none;cursor:pointer">✕</button>
    </div>

    <label style="font-size:12px;font-weight:700;color:#6b7280;text-transform:uppercase">Search student by name or email</label>
    <input id="studentSearchInput" class="input-field" placeholder="Type name or email..." oninput="searchStudentDebounced()" style="margin-top:6px">

    <div id="searchResults" style="margin-top:12px;max-height:250px;overflow-y:auto"></div>

    <div id="assignOptions" style="display:none;margin-top:16px;padding-top:16px;border-top:1px solid #e5e7eb">
      <p style="font-size:13px;font-weight:700;color:#0A3622;margin-bottom:8px">Selected: <span id="selectedStudentName" style="color:#D4AF37"></span></p>
      <label style="font-size:12px;font-weight:700;color:#6b7280;text-transform:uppercase">Subjects (comma separated)</label>
      <input id="subjectsInput" class="input-field" placeholder="Quran, Tajweed" style="margin-top:6px;margin-bottom:12px">
      <label style="font-size:12px;font-weight:700;color:#6b7280;text-transform:uppercase">Schedule</label>
      <input id="scheduleInput" class="input-field" placeholder="Mon-Wed-Fri 5PM" style="margin-top:6px;margin-bottom:12px">
      <label style="font-size:12px;font-weight:700;color:#6b7280;text-transform:uppercase">Notes (private)</label>
      <textarea id="notesInput" class="input-field" rows="2" placeholder="Optional notes..." style="margin-top:6px;margin-bottom:16px"></textarea>
      <button onclick="assignStudent()" class="btn-primary" style="width:100%">✅ Assign to Me</button>
    </div>
  </div>
</div>

<script>
const SUPABASE_URL = 'https://vgsgisyneymtszuslftb.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZnc2dpc3luZXltdHN6dXNsZnRiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA0NTg0NjQsImV4cCI6MjEwNjAzNDQ2NH0.HaYptmVnZCbGiOCg1NyYkcdHQDqjXlAHeq_i_bTC6Yk';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let currentUser = null;
let allStudents = [];
let selectedStudent = null;
let searchTimer = null;

// ---------- INIT ----------
async function init() {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) { window.location.href = 'auth/login.html'; return; }
  currentUser = session.user;

  const { data: profile } = await sb.from('profiles').select('*').eq('id', currentUser.id).single();
  if (!profile || (profile.role !== 'teacher' && profile.role !== 'admin')) {
    document.body.innerHTML = '<div style="padding:40px;text-align:center"><h2>Access Denied</h2><p>Only teachers can access this page.</p><a href="index.html">← Home</a></div>';
    return;
  }
  document.getElementById('headerName').textContent = profile.full_name || currentUser.email;
  await loadStudents();
}

// ---------- LOAD STUDENTS ----------
async function loadStudents() {
  const box = document.getElementById('studentsList');
  box.innerHTML = '<p style="text-align:center;padding:20px;color:#6b7280">Loading...</p>';

  const { data, error } = await sb
    .from('teacher_students')
    .select(`
      id, status, subjects, schedule, notes, assigned_at,
      student:profiles!teacher_students_student_id_fkey (id, full_name, email, avatar_url)
    `)
    .eq('teacher_id', currentUser.id)
    .eq('status', 'active')
    .order('assigned_at', { ascending: false });

  if (error) {
    console.error(error);
    box.innerHTML = '<p style="text-align:center;padding:20px;color:#dc2626">Failed to load: ' + error.message + '</p>';
    return;
  }

  allStudents = data || [];
  document.getElementById('statStudents').textContent = allStudents.length;
  document.getElementById('statActive').textContent = allStudents.filter(s => s.status === 'active').length;
  document.getElementById('statToday').textContent = '0';

  renderStudents(allStudents);
}

// ---------- RENDER ----------
function renderStudents(list) {
  const box = document.getElementById('studentsList');
  if (!list.length) {
    box.innerHTML = '<p style="text-align:center;padding:30px;color:#6b7280">No students yet. Click "Add Student" to begin.</p>';
    return;
  }
  box.innerHTML = list.map(row => {
    const s = row.student;
    if (!s) return '';
    const initial = (s.full_name || s.email || '?')[0].toUpperCase();
    const subjects = (row.subjects || []).join(', ') || '—';
    const schedule = row.schedule || '—';
    return `
      <div class="student-row">
        <div class="avatar">${initial}</div>
        <div style="flex:1;min-width:0">
          <p style="font-weight:700;color:#0A3622;font-size:14px">${escapeHtml(s.full_name || 'Unnamed')}</p>
          <p style="font-size:12px;color:#6b7280">${escapeHtml(s.email || '')}</p>
          <p style="font-size:11px;color:#9ca3af;margin-top:2px">📚 ${escapeHtml(subjects)} • 🕐 ${escapeHtml(schedule)}</p>
        </div>
        <span class="badge badge-active">${row.status}</span>
        <button onclick="removeStudent('${row.id}', '${escapeHtml(s.full_name || '')}')" style="background:#fee2e2;color:#dc2626;border:none;padding:6px 10px;border-radius:8px;cursor:pointer;font-size:12px">✕</button>
      </div>
    `;
  }).join('');
}

function filterStudents() {
  const q = document.getElementById('searchBox').value.toLowerCase();
  if (!q) return renderStudents(allStudents);
  const filtered = allStudents.filter(r => {
    const s = r.student;
    return s && ((s.full_name || '').toLowerCase().includes(q) || (s.email || '').toLowerCase().includes(q));
  });
  renderStudents(filtered);
}

// ---------- MODAL ----------
function openAddStudentModal() {
  document.getElementById('addStudentModal').classList.add('active');
  document.getElementById('studentSearchInput').value = '';
  document.getElementById('searchResults').innerHTML = '';
  document.getElementById('assignOptions').style.display = 'none';
  selectedStudent = null;
}

function closeModal(id) { document.getElementById(id).classList.remove('active'); }

function searchStudentDebounced() {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(searchStudents, 350);
}

async function searchStudents() {
  const term = document.getElementById('studentSearchInput').value.trim();
  const box = document.getElementById('searchResults');
  if (term.length < 2) { box.innerHTML = '<p style="font-size:12px;color:#9ca3af;padding:8px">Type at least 2 characters...</p>'; return; }
  box.innerHTML = '<p style="font-size:12px;color:#9ca3af;padding:8px">Searching...</p>';

  const { data, error } = await sb
    .from('profiles')
    .select('id, full_name, email, avatar_url')
    .eq('role', 'student')
    .or(`full_name.ilike.%${term}%,email.ilike.%${term}%`)
    .limit(20);

  if (error) { box.innerHTML = '<p style="color:#dc2626;font-size:12px;padding:8px">Error: ' + error.message + '</p>'; return; }

  if (!data || !data.length) {
    box.innerHTML = '<p style="font-size:12px;color:#9ca3af;padding:8px">No students found.</p>';
    return;
  }

  box.innerHTML = data.map(s => {
    const initial = (s.full_name || s.email || '?')[0].toUpperCase();
    return `
      <div onclick="pickStudent('${s.id}', '${escapeHtml(s.full_name || s.email)}')" style="display:flex;align-items:center;gap:10px;padding:10px;border-radius:10px;cursor:pointer;border:1px solid #e5e7eb;margin-bottom:6px">
        <div class="avatar" style="width:36px;height:36px;font-size:14px">${initial}</div>
        <div>
          <p style="font-weight:600;font-size:13px">${escapeHtml(s.full_name || 'Unnamed')}</p>
          <p style="font-size:11px;color:#6b7280">${escapeHtml(s.email || '')}</p>
        </div>
      </div>
    `;
  }).join('');
}

function pickStudent(id, name) {
  selectedStudent = { id, name };
  document.getElementById('selectedStudentName').textContent = name;
  document.getElementById('assignOptions').style.display = 'block';
  document.getElementById('searchResults').innerHTML = '<p style="font-size:12px;color:#15803d;padding:8px">✅ Selected: ' + name + '</p>';
}

async function assignStudent() {
  if (!selectedStudent) return;
  const subjectsRaw = document.getElementById('subjectsInput').value.trim();
  const subjects = subjectsRaw ? subjectsRaw.split(',').map(s => s.trim()).filter(Boolean) : null;
  const schedule = document.getElementById('scheduleInput').value.trim() || null;
  const notes = document.getElementById('notesInput').value.trim() || null;

  const { error } = await sb.from('teacher_students').insert({
    teacher_id: currentUser.id,
    student_id: selectedStudent.id,
    assigned_by: currentUser.id,
    subjects,
    schedule,
    notes,
    status: 'active'
  });

  if (error) {
    if (error.code === '23505') alert('This student is already assigned to you.');
    else alert('Failed: ' + error.message);
    return;
  }

  closeModal('addStudentModal');
  await loadStudents();
  alert('✅ Student assigned successfully!');
}

async function removeStudent(id, name) {
  if (!confirm('Remove ' + name + ' from your student list?')) return;
  const { error } = await sb.from('teacher_students').update({ status: 'removed' }).eq('id', id);
  if (error) { alert('Failed: ' + error.message); return; }
  await loadStudents();
}

function escapeHtml(t) {
  const d = document.createElement('div');
  d.textContent = t || '';
  return d.innerHTML;
}

async function logout() {
  await sb.auth.signOut();
  window.location.href = 'auth/login.html';
}

init();
</script>

</body>
</html>
